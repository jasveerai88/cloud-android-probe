            RB="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
            echo "marker_token: $RT2_TOKEN"; echo "marker_readback: $RB"
            if [ "$RB" = "$RT2_TOKEN" ]; then RT2_MOK=1; echo "MARKER_OK=1 - pushed via adb push, verified by readback"; else RT2_MOK=0; echo "MARKER_FAILED - readback did not reproduce the token; the certificate will carry marker_ok=0 and identity rests on android_id alone"; fi
          }
          rt2_pack() {
            # $1 = local tar name; $2 = include snapshots dir (0/1);
            # $3.. = extra certificate lines. Discovery pack in the v3.5
            # shape. Sets RT2_PACK_OK. Expects RT2_ID1 / RT2_TOKEN / RT2_MOK.
            RT2_PACK_OK=0; RT2_TAR="$1"; local INC_SNAP="$2"; shift 2
            echo "-- AVD folder listing BEFORE pack --"; ls -lh "$AVDDIR" 2>&1
            UD_PRESENT=""
            for uf in userdata-qemu.img.qcow2 userdata-qemu.img userdata.img; do
              if [ -f "$AVDDIR/$uf" ]; then UD_PRESENT="$UD_PRESENT $uf"; else echo "pack discover: userdata candidate absent: $uf"; fi
            done
            if [ -z "$UD_PRESENT" ]; then echo "PACK_SKIPPED=1 - no userdata candidate in the AVD folder"; return 0; fi
            LARGEST=""; LARGEST_SIZE=0
            for uf in $UD_PRESENT; do
              SZ="$(stat -c %s "$AVDDIR/$uf" 2>/dev/null)"; case "$SZ" in ''|*[!0-9]*) SZ=0;; esac
              if [ "$SZ" -gt "$LARGEST_SIZE" ]; then LARGEST_SIZE=$SZ; LARGEST=$uf; fi
            done
            SHA="$(sha256sum "$AVDDIR/$LARGEST" | awk '{print $1}')"
            LIST=""; : > "$EVID/rt2-pack-sizes.txt"
            for f in $UD_PRESENT encryptionkey.img.qcow2 encryptionkey.img sdcard.img config.ini emulator-user.ini hardware-qemu.ini; do
              if [ -f "$AVDDIR/$f" ]; then LIST="$LIST $f"; printf 'packed_file: %s %s bytes\n' "$f" "$(stat -c %s "$AVDDIR/$f")" >> "$EVID/rt2-pack-sizes.txt"; else echo "pack: absent, skipped: $f"; fi
            done
            if [ "$INC_SNAP" = "1" ]; then
              if [ -d "$AVDDIR/snapshots" ]; then
                LIST="$LIST snapshots"
                echo "-- snapshots/ tree packed into the capsule (packed_file lines) --"
                find "$AVDDIR/snapshots" -type f 2>/dev/null | while read -r sf; do printf 'packed_file: %s %s bytes\n' "${sf#$AVDDIR/}" "$(stat -c %s "$sf" 2>/dev/null)"; done >> "$EVID/rt2-pack-sizes.txt"
                grep 'snapshots/' "$EVID/rt2-pack-sizes.txt" 2>/dev/null || echo "no snapshot files listed"
              else
                echo "pack: snapshots dir ABSENT though include_snapshots=1 - the capsule will have no snapshot to load"
              fi
            fi
            EMU_PKG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            SYSIMG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            EMUVER="$("$EMU_BIN" -version 2>&1 | head -1 | tr -d '\r')"; if [ -z "$EMUVER" ]; then EMUVER="pkgrev:$EMU_PKG_REV"; fi
            if [ "$RT2_MOK" = "1" ]; then MT="$RT2_TOKEN"; else MT=""; fi
            {
              echo "avd_name=$AVD"; echo "system_image=$SYSIMG"
              echo "emulator_version=$EMUVER"; echo "emulator_pkg_revision=$EMU_PKG_REV"; echo "system_image_revision=$SYSIMG_REV"
              echo "session=1"; echo "packed_utc=$(date -u +%FT%TZ)"
              echo "android_id=$RT2_ID1"; echo "marker_token=$MT"; echo "marker_ok=$RT2_MOK"
              echo "largest_userdata_file=$LARGEST"; echo "largest_userdata_size_bytes=$LARGEST_SIZE"; echo "largest_userdata_sha256=$SHA"
              for line in "$@"; do echo "$line"; done
              cat "$EVID/rt2-pack-sizes.txt"
              echo "packed_file: phonevault-version.txt (this file)"
            } > "$AVDDIR/phonevault-version.txt"
            echo "-- phonevault-version.txt written into the pack --"; cat "$AVDDIR/phonevault-version.txt"
            LIST="$LIST phonevault-version.txt"
            rm -f "$RT2_TAR"
            tar -cf "$RT2_TAR" -C "$AVDDIR" $LIST 2>&1; echo "tar_rc=$?"
            ls -lh "$RT2_TAR" 2>&1; echo "-- tar contents --"; tar -tf "$RT2_TAR" 2>&1
            if [ -f "$RT2_TAR" ]; then RT2_PACK_OK=1; echo "PACK_OK=1 - local tar $RT2_TAR (roundtrip2 packs are NEVER uploaded)"; else echo "PACK_FAILED=1 - tar did not produce $RT2_TAR"; fi
          }
          rt2_restore() {
            # $1 = local tar; rest = boot-2 extra flags. Certificate read
            # from the tar itself; integrity re-verified; AVD wiped into a
            # clean hand-made folder; untar; boot 2; capture. Sets RT2_CID /
            # RT2_CMK / RT2_SHAOK / RT2_ID2 / RT2_RB (+ RT2_BOOTED via boot).
            local TAR="$1"; shift
            CERTDIR="pv-rt2-cert"; rm -rf "$CERTDIR"; mkdir -p "$CERTDIR"
            echo "-- certificate read from the tar itself --"
            tar -xf "$TAR" -C "$CERTDIR" phonevault-version.txt 2>&1; echo "cert_extract_rc=$?"
            cat "$CERTDIR/phonevault-version.txt" 2>&1
            RT2_CID="$(sed -n 's/^android_id=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
            RT2_CMK="$(sed -n 's/^marker_token=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
            C_LF="$(sed -n 's/^largest_userdata_file=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
            C_LS="$(sed -n 's/^largest_userdata_sha256=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
            RT2_SHAOK=0
            if [ -n "$C_LF" ] && tar -xf "$TAR" -C "$CERTDIR" "$C_LF" 2>/dev/null; then
              ACT="$(sha256sum "$CERTDIR/$C_LF" 2>/dev/null | awk '{print $1}')"
              if [ "$ACT" = "$C_LS" ]; then RT2_SHAOK=1; fi
            fi
            if [ "$RT2_SHAOK" = "1" ]; then echo "tar integrity: recomputed largest-userdata SHA-256 == certificate - YES"; else echo "tar integrity: recomputed largest-userdata SHA-256 == certificate - NO"; fi
            echo "-- WIPE the AVD folder completely (the phone now exists ONLY inside the tar) --"
            rm -rf "$AVDDIR" "$ANDROID_AVD_HOME/$AVD.ini"
            echo "-- hand-make a clean AVD folder (diagnosis attempt B shape) --"
            mkdir -p "$AVDDIR"
            printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/%s.avd\ntarget=android-34\n' "$AVDDIR" "$AVD" > "$ANDROID_AVD_HOME/$AVD.ini"
            echo "-- untar the pack into the clean folder --"
            tar -xf "$TAR" -C "$AVDDIR" 2>&1; echo "untar_rc=$?"
            ls -lh "$AVDDIR" 2>&1 | head -25
            if [ -d "$AVDDIR/snapshots" ]; then echo "-- restored snapshots tree --"; find "$AVDDIR/snapshots" -maxdepth 2 2>&1 | head -20; fi
            if pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "WARNING: qemu-system still alive before boot 2"; fi
            echo "-- boot 2 (extra flags: $*) --"
            rt2_boot "$EVID/rt2-boot2-console.log" "$@"
            RT2_ID2=""; RT2_RB=""
            if [ "$RT2_BOOTED" = "1" ]; then
              RT2_ID2="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
              RT2_RB="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
            fi
            echo "birth_android_id (certificate)=$RT2_CID"
            echo "restored_android_id=$RT2_ID2"
            echo "marker_expected (certificate)=$RT2_CMK"
            echo "marker_readback=$RT2_RB"
          }
          rt2_judge() {
            # $1 = verdict label (ROUNDTRIP2-N / ROUNDTRIP2-S). Appends
            # exactly one verdict line to $VERDICTS. RT2_EXTRA_FAIL may add
            # a failure component.
            local LBL="$1" FAIL=""
            if [ "$RT2_BOOTED" != "1" ]; then
              echo "$LBL: NOT EVALUATED - restore boot never reached sys.boot_completed=1 in the bounded wait"
              echo "$LBL: NOT EVALUATED - restore boot failed" >> "$VERDICTS"; return 0
            fi
            if [ "$RT2_ID2" != "$RT2_CID" ]; then FAIL="android_id mismatch (birth $RT2_CID, restored $RT2_ID2)"; fi
            if [ -n "$RT2_CMK" ] && [ "$RT2_RB" != "$RT2_CMK" ]; then
              if [ -n "$FAIL" ]; then FAIL="$FAIL; "; fi
              FAIL="${FAIL}marker mismatch (expected $RT2_CMK, got '${RT2_RB:-<missing/empty>}')"
            fi
            if [ "$RT2_SHAOK" != "1" ]; then
              if [ -n "$FAIL" ]; then FAIL="$FAIL; "; fi
              FAIL="${FAIL}tar integrity mismatch (recomputed SHA-256 != certificate)"
            fi
            if [ -n "$RT2_EXTRA_FAIL" ]; then
              if [ -n "$FAIL" ]; then FAIL="$FAIL; "; fi
              FAIL="${FAIL}$RT2_EXTRA_FAIL"
            fi
            if [ -z "$FAIL" ]; then
              echo "$LBL: SAME PHONE (birth $RT2_CID == restored $RT2_ID2, marker readback matched)"
              echo "$LBL: SAME PHONE" >> "$VERDICTS"
            else
              echo "$LBL: IDENTITY LOST - $FAIL"
              echo "$LBL: IDENTITY LOST - $FAIL" >> "$VERDICTS"
            fi
          }
          rt2_feature_state() {
            # $1 = verbose boot log. Prints the EncryptUserData lines
            # verbatim and sets RT2_FSTATE to the FINAL '= on/off'
            # assignment in file order (default parse first, overrides
            # applied after - last wins).
            echo "-- FeatureControl EncryptUserData lines from $1 (verbatim, unique) --"
            grep 'EncryptUserData' "$1" 2>/dev/null | sort -u | head -8
            RT2_FSTATE="$(grep 'EncryptUserData' "$1" 2>/dev/null | grep -oE '= (on|off)' | tail -1 | tr -d '= ')"
            if [ -z "$RT2_FSTATE" ]; then
              LASTLINE="$(grep 'EncryptUserData' "$1" 2>/dev/null | tail -1)"
              case "$LASTLINE" in *off*) RT2_FSTATE="off";; *on*) RT2_FSTATE="on";; esac
            fi
            echo "feature_state_final=${RT2_FSTATE:-<no EncryptUserData line in log>}"
          }
          # ---- attempt N ----
          {
            echo "===== 8a roundtrip2 attempt N: no-lock birth (EncryptUserData guest feature DISABLED at both boots) ====="
            if [ "$MODE" != "roundtrip2" ]; then
              echo "mode=$MODE - attempt N not applicable (roundtrip2 mode only)"
            elif [ "$AVD_OK" != "1" ]; then
              echo "ROUNDTRIP2-N: NOT RUN (AVD creation failed in step 2 - no AVD to birth)"
              echo "ROUNDTRIP2-N: NOT RUN (AVD creation failed in step 2)" >> "$VERDICTS"
            else
              echo "-- mechanism evidence (the emulator's own docs + shipped files) --"
              echo "Android developer documentation disables an emulator feature with the flag form -feature -<Name> (the emulator troubleshooting page's own example: -feature -Vulkan, used to turn a feature OFF from the command line). Attempt N applies that exact form to the guest feature - -feature -EncryptUserData - at BOTH the birth boot and the restore boot: a phone born unencrypted must also be restored with the feature off, or the guest would go looking for FBE keys that were never created."
              echo "-- SDK-shipped default (emulator/lib/advancedFeatures.ini), EncryptUserData line --"
              grep -i 'EncryptUserData' "$ANDROID_HOME/emulator/lib/advancedFeatures.ini" 2>&1 || echo "no EncryptUserData line in the shipped advancedFeatures.ini"
              echo "-- emulator -help-all: the -feature flag as the binary itself documents it --"
              "$EMU_BIN" -help-all 2>&1 | grep -i -A1 -- '-feature' | head -8
              echo "-- birth boot (-wipe-data, -no-snapshot, -verbose, -feature -EncryptUserData) --"
              rt2_boot "$EVID/rt2-n-boot1.log" -wipe-data -no-snapshot -verbose -feature -EncryptUserData
              rt2_feature_state "$EVID/rt2-n-boot1.log"
              if [ "$RT2_FSTATE" != "off" ]; then
                echo "ROUNDTRIP2-N: NOT RUN (the documented flag did not disable the guest feature - final FeatureControl EncryptUserData state in the birth boot log is '${RT2_FSTATE:-absent}', not 'off'; a phone born encrypted would test nothing new)"
                echo "ROUNDTRIP2-N: NOT RUN (EncryptUserData could not be disabled - final boot-log state ${RT2_FSTATE:-absent})" >> "$VERDICTS"
                if [ "$RT2_BOOTED" = "1" ]; then rt2_stop; fi
              elif [ "$RT2_BOOTED" != "1" ]; then
                echo "ROUNDTRIP2-N: NOT RUN (feature confirmed off, but the birth boot never reached sys.boot_completed=1 - runner problem, not evidence)"
                echo "ROUNDTRIP2-N: NOT RUN (birth boot failed with the feature off)" >> "$VERDICTS"
              else
                RT2_ID1="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                echo "attempt_n_birth_android_id=$RT2_ID1"
                rt2_marker
                rt2_stop
                if [ "$RT2_GRACEFUL" != "1" ]; then
                  echo "ROUNDTRIP2-N: NOT RUN (graceful stop unproven after the birth boot - pack refused under the v3.5 H5 guard)"
                  echo "ROUNDTRIP2-N: NOT RUN (graceful stop unproven)" >> "$VERDICTS"
                else
                  rt2_pack pv-n-state.tar 0 "route=roundtrip2-n" "userdata_encryption=off - EncryptUserData guest feature disabled at birth AND restore boots (flag form -feature -EncryptUserData)" "feature_state_birth=$RT2_FSTATE"
                  if [ "$RT2_PACK_OK" != "1" ]; then
                    echo "ROUNDTRIP2-N: NOT RUN (pack failed - see pack lines above)"
                    echo "ROUNDTRIP2-N: NOT RUN (pack failed)" >> "$VERDICTS"
                  else
                    RT2_EXTRA_FAIL=""
                    rt2_restore "$PWD/pv-n-state.tar" -no-snapshot -verbose -feature -EncryptUserData
                    rt2_feature_state "$EVID/rt2-boot2-console.log"
                    if [ "$RT2_FSTATE" != "off" ]; then RT2_EXTRA_FAIL="restore boot did NOT run with the feature off (final state ${RT2_FSTATE:-absent}) - the restore half of the no-lock route was not in force"; fi
                    rt2_judge "ROUNDTRIP2-N"
                    if [ "$RT2_BOOTED" = "1" ]; then rt2_stop; fi
                  fi
                fi
              fi
            fi
          } > "$SECN" 2>&1
          cat "$SECN"
          mkdir -p .pv-evidence-final
          cp "$SECN" .pv-evidence-final/ 2>/dev/null
          if [ -s "$VERDICTS" ]; then cp "$VERDICTS" "$EVID/identity-verdict.txt"; cp "$EVID/identity-verdict.txt" .pv-evidence-final/ 2>/dev/null; fi
          echo "attempt N evidence merged into .pv-evidence-final"


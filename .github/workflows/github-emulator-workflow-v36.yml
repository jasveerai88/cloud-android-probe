            # readback (the v3.4 lesson - an adb-shell redirect into /sdcard
            # fails on this image). Sets RT2_TOKEN / RT2_MOK.
            RT2_TOKEN="pv1-$(date -u +%Y%m%d%H%M%S)-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            printf '%s\n' "$RT2_TOKEN" > rt2-marker-local.txt

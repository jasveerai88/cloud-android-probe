            # v3.5 graceful stop: emu kill, then poll until the launcher AND
            # every qemu-system process are gone. NO hard kill, ever.
            RT2_GRACEFUL=0
            adb -s emulator-5554 emu kill 2>&1; echo "emu_kill_rc=$?"

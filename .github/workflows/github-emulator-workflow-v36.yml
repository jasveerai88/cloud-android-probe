            RT2_GRACEFUL=0
            adb -s emulator-5554 emu kill 2>&1; echo "emu_kill_rc=$?"
            for i in $(seq 1 24); do
              ALIVE=""
              if [ -n "$RT2_PID" ] && kill -0 "$RT2_PID" 2>/dev/null; then ALIVE="$ALIVE launcher_pid=$RT2_PID"; fi
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then ALIVE="$ALIVE qemu-system present"; fi
              if [ -z "$ALIVE" ]; then RT2_GRACEFUL=1; echo "graceful stop confirmed at poll $i"; break; fi
              echo "shutdown poll $i: still alive:$ALIVE"; sleep 5
            done
            if [ "$RT2_GRACEFUL" != "1" ]; then echo "GRACEFUL_STOP=0 - launcher/qemu still alive after 120s"; fi
            sync 2>/dev/null; echo "host sync done"
          }
          rt2_marker() {
            # birth only: token via local file + adb push, verified by cat
            # readback (the v3.4 lesson - an adb-shell redirect into /sdcard
            # fails on this image). Sets RT2_TOKEN / RT2_MOK.
            RT2_TOKEN="pv1-$(date -u +%Y%m%d%H%M%S)-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            printf '%s\n' "$RT2_TOKEN" > rt2-marker-local.txt
            adb -s emulator-5554 push rt2-marker-local.txt /sdcard/phonevault-marker-boot1.txt 2>&1; echo "marker_push_rc=$?"
            RB="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
            echo "marker_token: $RT2_TOKEN"; echo "marker_readback: $RB"
            if [ "$RB" = "$RT2_TOKEN" ]; then RT2_MOK=1; echo "MARKER_OK=1 - pushed via adb push, verified by readback"; else RT2_MOK=0; echo "MARKER_FAILED - readback did not reproduce the token; the certificate will carry marker_ok=0 and identity rests on android_id alone"; fi
          }
          rt2_pack() {
            # $1 = local tar name; $2 = include snapshots dir (0/1);
            # $3.. = extra certificate lines. Discovery pack in the v3.5
            # shape. Sets RT2_PACK_OK. Expects RT2_ID1 / RT2_TOKEN / RT2_MOK.
            RT2_PACK_OK=0; RT2_TAR="$1"; local INC_SNAP="$2"; shift 2
            echo "-- AVD folder listing BEFORE pack --"; ls -lh "$AVDDIR" 2>&1
            UD_PRESENT=""
            for uf in userdata-qemu.img.qcow2 userdata-qemu.img userdata.img; do
              if [ -f "$AVDDIR/$uf" ]; then UD_PRESENT="$UD_PRESENT $uf"; else echo "pack discover: userdata candidate absent: $uf"; fi
            done
            if [ -z "$UD_PRESENT" ]; then echo "PACK_SKIPPED=1 - no userdata candidate in the AVD folder"; return 0; fi
            LARGEST=""; LARGEST_SIZE=0
            for uf in $UD_PRESENT; do
              SZ="$(stat -c %s "$AVDDIR/$uf" 2>/dev/null)"; case "$SZ" in ''|*[!0-9]*) SZ=0;; esac
              if [ "$SZ" -gt "$LARGEST_SIZE" ]; then LARGEST_SIZE=$SZ; LARGEST=$uf; fi
            done
            SHA="$(sha256sum "$AVDDIR/$LARGEST" | awk '{print $1}')"
            LIST=""; : > "$EVID/rt2-pack-sizes.txt"
            for f in $UD_PRESENT encryptionkey.img.qcow2 encryptionkey.img sdcard.img config.ini emulator-user.ini hardware-qemu.ini; do
              if [ -f "$AVDDIR/$f" ]; then LIST="$LIST $f"; printf 'packed_file: %s %s bytes\n' "$f" "$(stat -c %s "$AVDDIR/$f")" >> "$EVID/rt2-pack-sizes.txt"; else echo "pack: absent, skipped: $f"; fi
            done
            if [ "$INC_SNAP" = "1" ]; then
              if [ -d "$AVDDIR/snapshots" ]; then
                LIST="$LIST snapshots"
                echo "-- snapshots/ tree packed into the capsule (packed_file lines) --"
                find "$AVDDIR/snapshots" -type f 2>/dev/null | while read -r sf; do printf 'packed_file: %s %s bytes\n' "${sf#$AVDDIR/}" "$(stat -c %s "$sf" 2>/dev/null)"; done >> "$EVID/rt2-pack-sizes.txt"
                grep 'snapshots/' "$EVID/rt2-pack-sizes.txt" 2>/dev/null || echo "no snapshot files listed"
              else
                echo "pack: snapshots dir ABSENT though include_snapshots=1 - the capsule will have no snapshot to load"
              fi
            fi
            EMU_PKG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            SYSIMG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            EMUVER="$("$EMU_BIN" -version 2>&1 | head -1 | tr -d '\r')"; if [ -z "$EMUVER" ]; then EMUVER="pkgrev:$EMU_PKG_REV"; fi
            if [ "$RT2_MOK" = "1" ]; then MT="$RT2_TOKEN"; else MT=""; fi
            {
              echo "avd_name=$AVD"; echo "system_image=$SYSIMG"
              echo "emulator_version=$EMUVER"; echo "emulator_pkg_revision=$EMU_PKG_REV"; echo "system_image_revision=$SYSIMG_REV"
              echo "session=1"; echo "packed_utc=$(date -u +%FT%TZ)"
              echo "android_id=$RT2_ID1"; echo "marker_token=$MT"; echo "marker_ok=$RT2_MOK"
              echo "largest_userdata_file=$LARGEST"; echo "largest_userdata_size_bytes=$LARGEST_SIZE"; echo "largest_userdata_sha256=$SHA"
              for line in "$@"; do echo "$line"; done
              cat "$EVID/rt2-pack-sizes.txt"
              echo "packed_file: phonevault-version.txt (this file)"
            } > "$AVDDIR/phonevault-version.txt"
            echo "-- phonevault-version.txt written into the pack --"; cat "$AVDDIR/phonevault-version.txt"
            LIST="$LIST phonevault-version.txt"
            rm -f "$RT2_TAR"
            tar -cf "$RT2_TAR" -C "$AVDDIR" $LIST 2>&1; echo "tar_rc=$?"
            ls -lh "$RT2_TAR" 2>&1; echo "-- tar contents --"; tar -tf "$RT2_TAR" 2>&1
            if [ -f "$RT2_TAR" ]; then RT2_PACK_OK=1; echo "PACK_OK=1 - local tar $RT2_TAR (roundtrip2 packs are NEVER uploaded)"; else echo "PACK_FAILED=1 - tar did not produce $RT2_TAR"; fi
          }
          rt2_restore() {
            # $1 = local tar; rest = boot-2 extra flags. Certificate read
            # from the tar itself; integrity re-verified; AVD wiped into a
            # clean hand-made folder; untar; boot 2; capture. Sets RT2_CID /
            # RT2_CMK / RT2_SHAOK / RT2_ID2 / RT2_RB (+ RT2_BOOTED via boot).
            local TAR="$1"; shift
            CERTDIR="pv-rt2-cert"; rm -rf "$CERTDIR"; mkdir -p "$CERTDIR"
            echo "-- certificate read from the tar itself --"
            tar -xf "$TAR" -C "$CERTDIR" phonevault-version.txt 2>&1; echo "cert_extract_rc=$?"
            cat "$CERTDIR/phonevault-version.txt" 2>&1
            RT2_CID="$(sed -n 's/^android_id=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
            RT2_CMK="$(sed -n 's/^marker_token=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
            C_LF="$(sed -n 's/^largest_userdata_file=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
            C_LS="$(sed -n 's/^largest_userdata_sha256=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
            RT2_SHAOK=0
            if [ -n "$C_LF" ] && tar -xf "$TAR" -C "$CERTDIR" "$C_LF" 2>/dev/null; then
              ACT="$(sha256sum "$CERTDIR/$C_LF" 2>/dev/null | awk '{print $1}')"
              if [ "$ACT" = "$C_LS" ]; then RT2_SHAOK=1; fi
            fi
            if [ "$RT2_SHAOK" = "1" ]; then echo "tar integrity: recomputed largest-userdata SHA-256 == certificate - YES"; else echo "tar integrity: recomputed largest-userdata SHA-256 == certificate - NO"; fi
            echo "-- WIPE the AVD folder completely (the phone now exists ONLY inside the tar) --"
            rm -rf "$AVDDIR" "$ANDROID_AVD_HOME/$AVD.ini"
            echo "-- hand-make a clean AVD folder (diagnosis attempt B shape) --"
            mkdir -p "$AVDDIR"
            printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/%s.avd\ntarget=android-34\n' "$AVDDIR" "$AVD" > "$ANDROID_AVD_HOME/$AVD.ini"
            echo "-- untar the pack into the clean folder --"
            tar -xf "$TAR" -C "$AVDDIR" 2>&1; echo "untar_rc=$?"
            ls -lh "$AVDDIR" 2>&1 | head -25
            if [ -d "$AVDDIR/snapshots" ]; then echo "-- restored snapshots tree --"; find "$AVDDIR/snapshots" -maxdepth 2 2>&1 | head -20; fi
            if pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "WARNING: qemu-system still alive before boot 2"; fi
            echo "-- boot 2 (extra flags: $*) --"
            rt2_boot "$EVID/rt2-boot2-console.log" "$@"
            RT2_ID2=""; RT2_RB=""
            if [ "$RT2_BOOTED" = "1" ]; then
              RT2_ID2="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
              RT2_RB="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
            fi
            echo "birth_android_id (certificate)=$RT2_CID"
            echo "restored_android_id=$RT2_ID2"
            echo "marker_expected (certificate)=$RT2_CMK"
            echo "marker_readback=$RT2_RB"
          }
          rt2_judge() {
            # $1 = verdict label (ROUNDTRIP2-N / ROUNDTRIP2-S). Appends
            # exactly one verdict line to $VERDICTS. RT2_EXTRA_FAIL may add
            # a failure component.
            local LBL="$1" FAIL=""
            if [ "$RT2_BOOTED" != "1" ]; then
              echo "$LBL: NOT EVALUATED - restore boot never reached sys.boot_completed=1 in the bounded wait"
              echo "$LBL: NOT EVALUATED - restore boot failed" >> "$VERDICTS"; return 0
            fi
            if [ "$RT2_ID2" != "$RT2_CID" ]; then FAIL="android_id mismatch (birth $RT2_CID, restored $RT2_ID2)"; fi
            if [ -n "$RT2_CMK" ] && [ "$RT2_RB" != "$RT2_CMK" ]; then
              if [ -n "$FAIL" ]; then FAIL="$FAIL; "; fi
              FAIL="${FAIL}marker mismatch (expected $RT2_CMK, got '${RT2_RB:-<missing/empty>}')"
            fi
            if [ "$RT2_SHAOK" != "1" ]; then
              if [ -n "$FAIL" ]; then FAIL="$FAIL; "; fi
              FAIL="${FAIL}tar integrity mismatch (recomputed SHA-256 != certificate)"
            fi
            if [ -n "$RT2_EXTRA_FAIL" ]; then
              if [ -n "$FAIL" ]; then FAIL="$FAIL; "; fi
              FAIL="${FAIL}$RT2_EXTRA_FAIL"
            fi
            if [ -z "$FAIL" ]; then
              echo "$LBL: SAME PHONE (birth $RT2_CID == restored $RT2_ID2, marker readback matched)"
              echo "$LBL: SAME PHONE" >> "$VERDICTS"
            else
              echo "$LBL: IDENTITY LOST - $FAIL"
              echo "$LBL: IDENTITY LOST - $FAIL" >> "$VERDICTS"
            fi
          }
          rt2_feature_state() {
            # $1 = verbose boot log. Prints the EncryptUserData lines
            # verbatim and sets RT2_FSTATE to the FINAL '= on/off'
            # assignment in file order (default parse first, overrides
            # applied after - last wins).
            echo "-- FeatureControl EncryptUserData lines from $1 (verbatim, unique) --"
            grep 'EncryptUserData' "$1" 2>/dev/null | sort -u | head -8
            RT2_FSTATE="$(grep 'EncryptUserData' "$1" 2>/dev/null | grep -oE '= (on|off)' | tail -1 | tr -d '= ')"
            if [ -z "$RT2_FSTATE" ]; then
              LASTLINE="$(grep 'EncryptUserData' "$1" 2>/dev/null | tail -1)"
              case "$LASTLINE" in *off*) RT2_FSTATE="off";; *on*) RT2_FSTATE="on";; esac
            fi
            echo "feature_state_final=${RT2_FSTATE:-<no EncryptUserData line in log>}"
          }
          # ---- attempt S ----
          SECS="$EVID/08b-roundtrip2-s.txt"; : > "$SECS"
          VERDICTS="$EVID/rt2-verdicts.txt"; [ -f "$VERDICTS" ] || : > "$VERDICTS"
          {
            echo "===== 8b roundtrip2 attempt S: snapshot capsule (save pv1, pack the WHOLE AVD incl. snapshots/, boot -snapshot pv1) ====="
            if [ "$MODE" != "roundtrip2" ]; then
              echo "mode=$MODE - attempt S not applicable (roundtrip2 mode only)"
            elif [ "$AVD_OK" != "1" ]; then
              echo "ROUNDTRIP2-S: NOT RUN (AVD creation failed in step 2 - no AVD to birth)"
              echo "ROUNDTRIP2-S: NOT RUN (AVD creation failed in step 2)" >> "$VERDICTS"
            elif pgrep -f 'qemu-system' >/dev/null 2>&1; then
              echo "ROUNDTRIP2-S: NOT RUN (a qemu-system process from an earlier step/attempt is still alive - resetting the AVD under a live emulator would corrupt the test)"
              echo "ROUNDTRIP2-S: NOT RUN (qemu-system still alive at attempt start)" >> "$VERDICTS"
            else
              echo "-- reset the AVD to birth-clean: config set kept, every state file removed (attempt N's restored phone must not leak into attempt S) --"
              find "$AVDDIR" -mindepth 1 -maxdepth 1 ! -name 'config.ini' ! -name 'emulator-user.ini' ! -name 'hardware-qemu.ini' -exec rm -rf {} + 2>&1
              ls -la "$AVDDIR" 2>&1
              echo "-- birth boot (-wipe-data; snapshots ENABLED - deliberately NO -no-snapshot flag, or the save below cannot work) --"
              rt2_boot "$EVID/rt2-s-boot1.log" -wipe-data
              if [ "$RT2_BOOTED" != "1" ]; then
                echo "ROUNDTRIP2-S: NOT RUN (birth boot never reached sys.boot_completed=1 - runner problem, not evidence)"
                echo "ROUNDTRIP2-S: NOT RUN (birth boot failed)" >> "$VERDICTS"
              else
                RT2_ID1="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                echo "attempt_s_birth_android_id=$RT2_ID1"
                rt2_marker
                echo "-- save the capsule: adb emu avd snapshot save pv1 --"
                adb -s emulator-5554 emu avd snapshot save pv1 2>&1; echo "snapshot_save_rc=$?"
                sleep 3
                SNAP_OK=0
                if [ -d "$AVDDIR/snapshots/pv1" ] && [ -n "$(find "$AVDDIR/snapshots/pv1" -type f 2>/dev/null | head -1)" ]; then SNAP_OK=1; fi
                echo "-- snapshots tree after the save --"
                find "$AVDDIR/snapshots" -type f -exec ls -lh {} \; 2>&1 | head -25
                echo "snapshot_saved=$SNAP_OK"
                rt2_stop
                if [ "$SNAP_OK" != "1" ]; then
                  echo "ROUNDTRIP2-S: NOT RUN (snapshot save produced no snapshots/pv1 capsule on disk - the capsule route could not be created on this emulator build)"
                  echo "ROUNDTRIP2-S: NOT RUN (snapshot save failed - no snapshots/pv1 on disk)" >> "$VERDICTS"
                elif [ "$RT2_GRACEFUL" != "1" ]; then
                  echo "ROUNDTRIP2-S: NOT RUN (graceful stop unproven - pack refused under the v3.5 H5 guard)"
                  echo "ROUNDTRIP2-S: NOT RUN (graceful stop unproven)" >> "$VERDICTS"
                else
                  rt2_pack pv-s-state.tar 1 "route=roundtrip2-s" "snapshot_name=pv1" "snapshot_packed=1 - the ENTIRE AVD folder incl. snapshots/ was packed; the restore boot loads the capsule with -snapshot pv1"
                  if [ "$RT2_PACK_OK" != "1" ]; then
                    echo "ROUNDTRIP2-S: NOT RUN (pack failed - see pack lines above)"
                    echo "ROUNDTRIP2-S: NOT RUN (pack failed)" >> "$VERDICTS"
                  else
                    RT2_EXTRA_FAIL=""
                    rt2_restore "$PWD/pv-s-state.tar" -snapshot pv1 -verbose
                    echo "-- snapshot lines from the restore boot log (verbatim, first 12) --"
                    grep -i 'snapshot' "$EVID/rt2-boot2-console.log" 2>/dev/null | head -12
                    if ! grep -qi 'snapshot' "$EVID/rt2-boot2-console.log" 2>/dev/null; then echo "(no snapshot lines in the restore boot log)"; fi
                    rt2_judge "ROUNDTRIP2-S"
                    if [ "$RT2_BOOTED" = "1" ]; then rt2_stop; fi
                  fi
                fi
              fi
            fi
          } > "$SECS" 2>&1
          cat "$SECS"
          mkdir -p .pv-evidence-final
          cp "$SECS" .pv-evidence-final/ 2>/dev/null
          if [ -s "$VERDICTS" ]; then cp "$VERDICTS" "$EVID/identity-verdict.txt"; cp "$EVID/identity-verdict.txt" .pv-evidence-final/ 2>/dev/null; fi
          echo "-- roundtrip2 verdicts (both attempts) --"
          cat "$VERDICTS" 2>&1
          echo "attempt S evidence merged into .pv-evidence-final"

      - name: Upload boot screencap (artifact only, never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshot
          path: .pv-screencap.png
          if-no-files-found: ignore

      - name: Determine pack state (flag for the conditioned state upload)
        id: packflag
        if: always()
        shell: bash
        run: |
          if [ -f .pv-pack-ok ] && [ -f phonevault-state.tar ]; then
            echo "pack_ok=true" >> "$GITHUB_OUTPUT"
            echo "verified pack present (.pv-pack-ok + phonevault-state.tar): the state upload step runs and must find the tar (if-no-files-found: error)"
          else
            echo "pack_ok=false" >> "$GITHUB_OUTPUT"
            echo "no verified pack this run: the state upload step is skipped - nothing-to-upload is a legitimate outcome (not booted / pack skipped), not an error"
          fi

      - name: Upload PhoneVault AVD state (artifact transport only, never committed)
        if: steps.packflag.outputs.pack_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phonevault-avd-state
          path: phonevault-state.tar
          if-no-files-found: error
          retention-days: 90

      - name: Write verdict + commit output back
        if: always()
        shell: bash
        run: |
          set +e
          OUT=emulator-output.txt
          EVID=.pv-evidence-final
          MODE="$(cat .pv-mode.txt 2>/dev/null | tr -d '\r\n')"
          if [ -z "$MODE" ]; then MODE="fresh"; fi
          IVERD=""
          if [ -f "$EVID/identity-verdict.txt" ]; then IVERD="$(cat "$EVID/identity-verdict.txt")"; fi
          BOOTED=0; CAPOK=0
          [ -f "$EVID/03-boot.txt" ] && BOOTED="$(grep -c 'BOOTED_FLAG=1' "$EVID/03-boot.txt")"
          [ -f "$EVID/04-capture.txt" ] && CAPOK="$(grep -c 'CAPTURE_OK=1' "$EVID/04-capture.txt")"
          # v3.4 HONEST VERDICT: PACKED and MARKER below are derived from the
          # flags the run actually set (pack-state.txt from section 6,
          # marker-state.txt from section 4, the restore identity verdict) -
          # never asserted by template. Run No.3's verdict line claimed
          # "state packed" while its own section 6 said PACK_SKIPPED=1; that
          # class of lie is what this derivation removes.
          PACKOK=0
          if [ -f "$EVID/pack-state.txt" ] && grep -q 'PACK_OK=1' "$EVID/pack-state.txt"; then PACKOK=1; fi
          if [ "$PACKOK" = "1" ]; then PACKTXT="PACKED=1 (state packed as artifact phonevault-avd-state, section 6)"; else PACKTXT="PACKED=0 (state NOT packed - see section 6)"; fi
          MARKER_STATE="unknown"
          if [ "$MODE" = "restore" ] || [ "$MODE" = "roundtrip" ] || [ "$MODE" = "roundtrip2" ]; then
            case "$IVERD" in
              *"SAME PHONE"*) MARKER_STATE="see identity verdict above" ;;
              *"marker mismatch"*) MARKER_STATE="FAILED" ;;
              *"NOT EVALUATED"*) MARKER_STATE="not evaluated (phone did not boot)" ;;
              *) if grep -q 'NOT EVALUATED' "$EVID/04-capture.txt" 2>/dev/null; then MARKER_STATE="not evaluated (restored pack carried no verified marker)"; fi ;;
            esac
          elif [ -f "$EVID/marker-state.txt" ]; then
            if grep -q 'MARKER_OK=1' "$EVID/marker-state.txt"; then MARKER_STATE="OK"; else MARKER_STATE="FAILED"; fi
          fi
          MARKERTXT="marker: $MARKER_STATE"
          if [ "$MARKER_STATE" = "FAILED" ]; then MARKERTXT="MARKER_FAILED (marker: FAILED - see section 4)"; fi
          {
            if { [ "$MODE" = "restore" ] || [ "$MODE" = "roundtrip" ] || [ "$MODE" = "roundtrip2" ]; } && [ -n "$IVERD" ]; then
              echo "$IVERD"
            fi
            if [ "$MODE" = "roundtrip2" ] && [ -n "$IVERD" ]; then
              echo "EMULATOR BOOT: BOOTED - roundtrip2 job (attempt N no-lock birth: section 08a; attempt S snapshot capsule: section 08b); the two ROUNDTRIP2 verdicts above are this job's permanence proofs and no artifact shelf was used; each attempt packed to a LOCAL tar only (nothing uploaded); marker: see the identity verdicts above"
            elif [ "$BOOTED" = "1" ] && [ "$CAPOK" = "1" ]; then
              if [ "$MODE" = "roundtrip" ]; then
                echo "EMULATOR BOOT: BOOTED - roundtrip job (boot 1: sections 3-4; graceful pack: sections 5-6; wipe + clean-room restore + boot 2: section 7); the roundtrip verdict above is this job's permanence proof and no artifact shelf was used; $PACKTXT; $MARKERTXT"
              elif [ "$MODE" = "restore" ]; then
                echo "EMULATOR BOOT: BOOTED - sys.boot_completed=1 reached on factoryphone restored from artifact phonevault-avd-state (no -wipe-data); identity verdict above + section 4; $PACKTXT; $MARKERTXT"
              else
                echo "EMULATOR BOOT: BOOTED - sys.boot_completed=1 reached on factoryphone (android-34 google_apis x86_64, KVM accel, headless); identity + screencap captured; $PACKTXT; $MARKERTXT; no vault state was restored in this run (fresh mode, by design)"
              fi
            elif [ "$BOOTED" = "1" ]; then
              echo "EMULATOR BOOT: NO BOOT - emulator reported boot_completed but identity capture failed (see section 4)"
            else
              KVM="$(grep -h 'KVM_GATE:' "$EVID/00-baseline.txt" 2>/dev/null)"
              CFG="$(grep -h 'CONFIG_MISSING' "$EVID/02-avd.txt" 2>/dev/null)"
              RST="$(grep -h 'RESTORE_FAILED' "$EVID/02c-restore.txt" 2>/dev/null)"
              if echo "$KVM" | grep -q ABSENT; then
                echo "EMULATOR BOOT: NO BOOT - /dev/kvm absent on this runner (see section 0)"
              elif [ -n "$CFG" ]; then
                ARC="$(grep -h 'avdmanager_rc=' "$EVID/02-avd.txt" 2>/dev/null | tail -1)"
                echo "EMULATOR BOOT: NO BOOT - AVD creation failed, no config.ini ($ARC; boot skipped by design; FULL avdmanager output in section 02b below)"
              elif [ -n "$RST" ]; then
                echo "EMULATOR BOOT: NO BOOT - restore mode: state restore failed, boot not attempted (see section 02c below)"
              else
                echo "EMULATOR BOOT: NO BOOT - sys.boot_completed never reached 1 within the 12-minute bounded wait (see sections 3-4 + emulator console log tail)"
              fi
            fi
            echo ""
            for f in "$EVID"/0*.txt; do
              [ -f "$f" ] || continue
              echo "########## $f ##########"
              cat "$f"
              echo ""
            done
          } > "$OUT" 2>&1
          cat "$OUT"
          git config user.name "cloud-android-probe"
          git config user.email "probe@localhost"
          git add emulator-output.txt
          git commit -m "emulator output [skip ci]" || exit 0
          git push

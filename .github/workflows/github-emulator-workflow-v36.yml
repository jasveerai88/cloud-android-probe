name: cloud-android-emulator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fresh = new phone (boots with -wipe-data); restore = boot a certificate-verified packed phonevault-avd-state artifact (no -wipe-data, identity proof); roundtrip = self-contained proof in ONE job (fresh boot, marker, graceful pack to a local tar, wipe, clean-room restore from that tar, boot, identity verdict; never touches the artifact shelf); roundtrip2 = TWO routes around the encryption wall in ONE job, each a full birth -> marker -> graceful pack -> wipe -> clean-room restore -> boot -> identity check with its own verdict line: attempt N = no-lock birth (EncryptUserData guest feature DISABLED at both boots via -feature -EncryptUserData), attempt S = snapshot capsule (adb emu avd snapshot save pv1, pack the WHOLE AVD incl. snapshots/, restore boot with -snapshot pv1); never touches the artifact shelf"
        type: choice
        options:
          - fresh
          - restore
          - roundtrip
          - roundtrip2
        default: fresh
        required: true
      pin_run_id:
        description: "restore mode only: run ID whose phonevault-avd-state artifact is tried FIRST (the sealed phone's pack run; the value lives in phonevault/STATE.md, deliberately not in this file). Empty = verified-newest order."
        type: string
        required: false
        default: ""
      expected_android_id:
        description: "restore mode only: certificate gate - a candidate pack is accepted only if its own phonevault-version.txt android_id equals this value (read it from the pack's birth certificate, e.g. phonevault/STATE.md). Empty = integrity + marker_ok gates only."
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/emulator.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: phonevault-emulator
  cancel-in-progress: false

jobs:
  emulator-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PhoneVault step 1 of 8 - baseline, KVM gate, SDK install, version capture (v3.6)
        shell: bash
        run: |
          set +e
          OUT=emulator-output.txt
          EVID=.pv-evidence
          mkdir -p "$EVID"
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="fresh"; fi
          {
            echo "PHONEVAULT EMULATOR BOOT TEST v3.6"
            echo "v3.5 changes over v3.4.2, each from the run No.9 / restore-diagnosis evidence: (1) GRACEFUL PACK (hypothesis H5) - the v3.4.2 shutdown checked only the launcher wrapper PID after one fixed sleep 5 and packed even after a kill -9; QEMU attaches userdata + encryptionkey with cache=unsafe, so guest writes (above all FBE key finalization at first boot) can miss the qcow2 entirely - and every restore boot then first-boots and mints a NEW encryptionkey overlay (run No.9, and diagnosis attempts A replica + B clean room: identity LOST in all three, files bit-identical, disk chain healthy). v3.5: adb emu kill, then a bounded pgrep poll until the launcher AND every qemu-system process are gone; NO hard kill on the pack path; the pack is SKIPPED when a clean stop is not proven. (2) ROUNDTRIP MODE - the self-contained permanence proof in ONE job: fresh boot, marker write+verify, graceful pack to a LOCAL tar (no artifact), wipe the AVD folder completely, restore from that tar into a clean hand-made folder (certificate read from the tar itself), boot WITHOUT -wipe-data, identity verdict with both android_ids + marker readback. It never touches the artifact shelf, so it separates pack-side causes (H5) from shelf/restore-side causes in a single run. (3) RESTORE = PINNED + CERTIFICATE-VERIFIED - the shelf is poisoned (run No.9 uploaded a wrong-phone pack under the same artifact name), so restore tries the dispatch-pinned run first and accepts a candidate pack ONLY when its own phonevault-version.txt passes: android_id present + marker_ok=1, SHA-256 recomputed from the downloaded tar over the certificate largest_userdata_file equals the certificate value, and (when supplied at dispatch) android_id equals the expected value. Expected values are read from files/inputs at runtime - no hash or ID is written into this workflow. (4) VERSIONS RECORDED - emulator -version is captured WITH stderr (v3.4.2 discarded stderr and sealed an EMPTY emulator_version), plus emulator Pkg.Revision and system-image Pkg.Revision, into every pack certificate. (5) Restore mode re-packs ONLY on a SAME PHONE verdict. Unchanged from v3.4.2: ANDROID_AVD_HOME pin, pack by discovery, marker via adb push, honest verdict derivation, bounded waits."
            echo "v3.6 changes over v3.5, from the roundtrip run No.11 verdict (H5 DEAD: graceful stop confirmed at poll 2, pack integrity verified, identity STILL lost - boot1 vs boot2 android_id differed, marker gone; diagnosis verbose logs: guest feature EncryptUserData = on, disks attach correctly, qcow2 chain healthy, and every restore boot mints a NEW encryptionkey.img.qcow2 overlay and first-boots). Settled conclusion: on the android-34 google_apis image the guest data-encryption keying does not survive AVD-folder transport, so /data is re-initialised on any restored boot. v3.6 adds mode roundtrip2 - two routes around that wall, each a full birth -> marker -> graceful pack -> wipe -> clean-room restore -> boot -> identity check in the SAME job, each verdict printed separately (sections 08a/08b), neither touching the artifact shelf. ATTEMPT N (no-lock birth): the phone is born with the EncryptUserData guest feature DISABLED and restored with it disabled too, via the emulator documented flag form -feature -EncryptUserData (Android developer docs disable a feature exactly this way; their example is -feature -Vulkan); the FeatureControl EncryptUserData lines are grepped verbatim from both verbose boot logs, and if the final state is not off the attempt is NOT RUN - an encrypted birth would test nothing new. ATTEMPT S (snapshot capsule): birth with snapshots enabled, adb emu avd snapshot save pv1 after the marker verifies, pack the ENTIRE AVD folder INCLUDING snapshots/ (the v3.5 pack excluded snapshots/ by construction), wipe, restore whole, boot with -snapshot pv1 and no -wipe-data; the snapshot lines from the restore boot log are printed beside the identity verdict. Job timeout raised 60 -> 90 min because roundtrip2 runs two full cycles. Everything else - graceful pack, certificate gates, runtime-read expected values, no hash or ID written into this workflow - is v3.5 unchanged."
            echo "run_started_utc: $(date -u +%FT%TZ)"
            echo "workflow_run_number: ${{ github.run_number }}"
            echo "workflow_run_id: ${{ github.run_id }}"
            echo "workflow_run_attempt: ${{ github.run_attempt }}"
            echo "mode: $MODE (push-triggered runs are always fresh; restore, roundtrip and roundtrip2 are dispatch-only)"
            echo "note: artifact transport is NOT the vault - DESIGN.md section 5 chunk_vault/HF wiring replaces it for real sessions (build step 3)"
            echo "===== 0 runner / kvm gate ====="
            echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH ImageOS=$ImageOS ImageVersion=$ImageVersion"
            uname -a; nproc; free -h; df -h / | tail -1
            ls -l /dev/kvm 2>&1
            if [ ! -e /dev/kvm ]; then
              echo "KVM_GATE: ABSENT - emulator cannot use hardware acceleration on this runner"
            else
              echo "KVM_GATE: PRESENT"
            fi
            echo "===== 0b kvm permissions (standard GitHub emulator step) ====="
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules 2>&1
            sudo udevadm control --reload-rules 2>&1
            sudo udevadm trigger --name-match=kvm 2>&1
            ls -l /dev/kvm 2>&1
            touch /dev/kvm 2>/dev/null; echo "kvm_touch_rc=$? (0 = runner user can open the device)"
          } > "$EVID/00-baseline.txt" 2>&1
          cat "$EVID/00-baseline.txt"

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          SDKMANAGER="$(command -v sdkmanager)"
          AVD="factoryphone"
          SYSIMG="system-images;android-34;google_apis;x86_64"
          # v3.3 (diagnosis fix, DIAGNOSIS-NOTES.md): pin the AVD home explicitly.
          # With ANDROID_AVD_HOME unset, avdmanager on this runner resolves its home
          # via the XDG config dir and creates the AVD under
          # $HOME/.config/.android/avd/ - while every check below looked in
          # $HOME/.android/avd/. Creation never failed; the check looked in the
          # wrong folder. Exported here, before any avdmanager/emulator call, so
          # create, boot, restore and pack all resolve the same AVD home.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          {
            echo "===== 1 sdkmanager installs (emulator + platform-tools + system image) ====="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "sdkmanager=$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1; echo "licenses_rc=$?"
            "$SDKMANAGER" "emulator" "platform-tools" "$SYSIMG" 2>&1 | tail -15
            echo "install_rc=${PIPESTATUS[0]}"
            ls "$ANDROID_HOME/emulator/emulator" 2>&1
            ls "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/" 2>&1 | head -8
            echo "-- version capture (v3.5: these values are sealed into every pack certificate; run No.6's emulator_version was EMPTY) --"
            "$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -3
            echo "emulator_pkg_revision=$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            echo "system_image_pkg_revision=$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            "$SDKMANAGER" --list_installed 2>&1 | grep -Ei 'emulator|system-images' || echo "no emulator/system-images lines in --list_installed output"
          } > "$EVID/01-install.txt" 2>&1
          cat "$EVID/01-install.txt"


          # v3.4.1 split bridge: hand the small scalars to the following steps
          {
            echo "MODE=$MODE"
            echo "AVD=$AVD"
            echo "SYSIMG=$SYSIMG"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          } >> "$GITHUB_ENV"
      - name: PhoneVault step 2 of 8 - create AVD (v3.6)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"
          SDKMANAGER="$(command -v sdkmanager)"

          AVD_OK=0
          {
            echo "===== 2 create AVD factoryphone (fixed PhoneVault profile) ====="
            echo "avd_home=$ANDROID_AVD_HOME"
            echo "----- 2a pre-create diagnostics -----"
            echo "-- avdmanager list device, filtered for pixel_6 --"
            avdmanager list device 2>&1 | grep -i -B1 -A2 'pixel_6' || echo "pixel_6 NOT FOUND in avdmanager list device output"
            if avdmanager list device 2>/dev/null | grep -qi 'pixel_6'; then PIXEL6_LISTED=1; else PIXEL6_LISTED=0; fi
            echo "pixel_6_listed=$PIXEL6_LISTED"
            echo "-- installed system-image dir --"
            ls -la "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/" 2>&1
            echo "-- sdkmanager --list_installed, system-images lines --"
            "$SDKMANAGER" --list_installed 2>&1 | grep -i 'system-images' || echo "no system-images package line in --list_installed output"
            echo "----- 2b create attempts (FULL avdmanager output in section 02b) -----"
            printf 'no\n' > "$EVID/avd-answer.txt"
            : > "$EVID/02b-avdmanager.txt"
            # avdmanager runs with stdin redirected from a file - NO pipeline -
            # so $? immediately after the call IS avdmanager's own exit code
            # (v3 piped through tail and read the wrong PIPESTATUS slot).
            attempt_create() {
              if [ -n "$1" ]; then
                avdmanager create avd -n "$AVD" -k "$SYSIMG" -d "$1" --force < "$EVID/avd-answer.txt" >> "$EVID/02b-avdmanager.txt" 2>&1
              else
                avdmanager create avd -n "$AVD" -k "$SYSIMG" --force < "$EVID/avd-answer.txt" >> "$EVID/02b-avdmanager.txt" 2>&1
              fi
              AVD_RC=$?
            }
            CFG="$ANDROID_AVD_HOME/$AVD.avd/config.ini"
            AVD_RC=""
            DEVICE_USED=""
            if [ "$PIXEL6_LISTED" = "1" ]; then
              echo "--- create attempt 1: -d pixel_6 ---" >> "$EVID/02b-avdmanager.txt"
              attempt_create "pixel_6"
              DEVICE_USED="pixel_6"
              echo "attempt1: avdmanager_rc=$AVD_RC device=pixel_6"
            else
              echo "pixel_6 absent from the device list - going straight to the default-device fallback"
            fi
            if [ ! -f "$CFG" ]; then
              echo "--- create attempt 2: no -d flag (default device) ---" >> "$EVID/02b-avdmanager.txt"
              attempt_create ""
              DEVICE_USED="default (no -d flag)"
              echo "attempt2: avdmanager_rc=$AVD_RC device=default"
            fi
            echo "avdmanager_rc=$AVD_RC"
            echo "device_used=$DEVICE_USED"
            echo "config_path=$CFG"
            if [ -f "$CFG" ]; then
              AVD_OK=1
              # assert the frozen profile values (DESIGN.md section 3)
              sed -i '/^hw.ramSize=/d; /^hw.cpu.ncore=/d; /^disk.dataPartition.size=/d' "$CFG"
              printf 'hw.ramSize=2048\nhw.cpu.ncore=2\ndisk.dataPartition.size=4096M\n' >> "$CFG"
              grep -E '^(hw.ramSize|hw.cpu.ncore|disk.dataPartition.size|image.sysdir|hw.device.name)' "$CFG"
            else
              echo "CONFIG_MISSING - AVD creation failed"
            fi
            echo "-- AVD home contents after creation --"
            ls "$ANDROID_AVD_HOME" 2>&1
            echo "full avdmanager output (both attempts, uncut): section 02b (02b-avdmanager.txt)"
          } > "$EVID/02-avd.txt" 2>&1
          cat "$EVID/02-avd.txt"
          echo "########## 02b avdmanager full output ##########"
          cat "$EVID/02b-avdmanager.txt"

          # v3.5 split bridge: hand the small scalars to the following steps
          {
            echo "AVD_OK=$AVD_OK"
          } >> "$GITHUB_ENV"

      - name: PhoneVault step 3 of 8 - restore fetch, pinned + certificate-verified (v3.6)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"
          AVD_OK="${AVD_OK:-0}"

          RESTORE_OK=0
          EXPECTED_ID=""
          EXPECTED_MARKER=""
          RESTORED_SESSION=0
          RESTORED_MARKER_OK=0
          {
            echo "===== 2c restore state (restore mode only) ====="
            if [ "$MODE" != "restore" ]; then
              echo "mode=$MODE - no artifact restore in this step (fresh boots a new phone; roundtrip restores from this job's own local tar in the roundtrip step; roundtrip2 runs both of its attempts inside the roundtrip2 steps, sections 08a/08b)"
            elif [ "$AVD_OK" != "1" ]; then
              echo "RESTORE_FAILED=1 - AVD creation failed, nowhere to restore into (see section 2)"
            else
              AVDDIR="$ANDROID_AVD_HOME/$AVD.avd"
              echo "gh_version: $(gh --version 2>&1 | head -1)"
              DLDIR="pv-restore-dl"
              STAGE="pv-restore-stage"
              PIN_RUN="${{ inputs.pin_run_id }}"
              EXPECTED_ID_IN="${{ inputs.expected_android_id }}"
              echo "pin_run_id_input=${PIN_RUN:-<none>}"
              echo "expected_android_id_input=${EXPECTED_ID_IN:-<none - gates a+b only>}"
              echo "v3.5 restore rule (DIAGNOSIS2 trap 1: run No.9 re-packed its WRONG phone under the same artifact name - the shelf is poisoned for any blind newest-first fetch): a candidate pack is accepted ONLY when its own phonevault-version.txt passes gate a) android_id present AND marker_ok=1; gate b) integrity - the SHA-256 recomputed from the downloaded tar over the certificate's largest_userdata_file equals the certificate's largest_userdata_sha256; gate c) when expected_android_id is supplied at dispatch, the certificate android_id must equal it. Every expected value is read from the candidate's certificate or the dispatch inputs at runtime - no hash or ID is written into this workflow. Candidate order: pinned run first, then other successful runs newest-first, then artifacts-API entries newest-first; every candidate passes through the same gates."
              CANDIDATES=""
              add_cand() { case " $CANDIDATES " in *" $1 "*) : ;; *) CANDIDATES="$CANDIDATES $1";; esac; }
              if [ -n "$PIN_RUN" ]; then
                case "$PIN_RUN" in *[!0-9]*) echo "pin_run_id_input is not numeric - ignored";; *) add_cand "run:$PIN_RUN";; esac
              fi
              echo "-- successful runs of this workflow, newest first (this run excluded) --"
              RUN_IDS="$(gh run list --workflow emulator.yml --status success --limit 25 --json databaseId --jq '.[].databaseId' 2>&1)"
              echo "$RUN_IDS"
              for RID in $RUN_IDS; do
                case "$RID" in ''|*[!0-9]*) continue;; esac
                if [ "$RID" = "${{ github.run_id }}" ]; then continue; fi
                add_cand "run:$RID"
              done
              echo "-- artifacts API candidates (non-expired, newest first) --"
              ART_JSON="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=phonevault-avd-state&per_page=10" 2>&1)"
              echo "$ART_JSON" | python3 -c 'import sys,json; d=json.loads(sys.stdin.read() or "{}"); live=[a for a in d.get("artifacts",[]) if not a.get("expired")]; live.sort(key=lambda a: a.get("created_at") or "", reverse=True); [print("%s %s" % (a.get("id"), (a.get("workflow_run") or {}).get("id"))) for a in live]' 2>/dev/null > "$EVID/art-candidates.txt" || echo "artifacts_api_parse_error - no API candidates"
              if [ ! -f "$EVID/art-candidates.txt" ]; then : > "$EVID/art-candidates.txt"; fi
              cat "$EVID/art-candidates.txt"
              while read -r AAID ARUN; do
                case "$AAID" in ''|*[!0-9]*) continue;; esac
                add_cand "art:$AAID:$ARUN"
              done < "$EVID/art-candidates.txt"
              echo "candidate_order:$CANDIDATES"
              try_candidate() {
                # $1 = human label. Expects $DLDIR/phonevault-state.tar present.
                # On acceptance the candidate's certificate is left in
                # $EVID/restored-version.txt and the function returns 0.
                [ -f "$DLDIR/phonevault-state.tar" ] || return 1
                rm -rf "$STAGE"; mkdir -p "$STAGE"
                if ! tar -xf "$DLDIR/phonevault-state.tar" -C "$STAGE" phonevault-version.txt 2>/dev/null; then
                  echo "candidate $1: REJECTED - no phonevault-version.txt in tar"
                  return 1
                fi
                CERT="$STAGE/phonevault-version.txt"
                CID="$(sed -n 's/^android_id=//p' "$CERT" | tr -d '\r' | head -1)"
                CMOK="$(sed -n 's/^marker_ok=//p' "$CERT" | tr -d '\r' | head -1)"
                LF="$(sed -n 's/^largest_userdata_file=//p' "$CERT" | tr -d '\r' | head -1)"
                LS="$(sed -n 's/^largest_userdata_sha256=//p' "$CERT" | tr -d '\r' | head -1)"
                echo "candidate $1: certificate android_id=$CID marker_ok=$CMOK largest_userdata_file=$LF"
                if [ -z "$CID" ] || [ "$CMOK" != "1" ]; then echo "candidate $1: REJECTED - gate a (android_id present + marker_ok=1)"; return 1; fi
                if [ -n "$EXPECTED_ID_IN" ] && [ "$CID" != "$EXPECTED_ID_IN" ]; then echo "candidate $1: REJECTED - gate c (certificate android_id != dispatch expected_android_id)"; return 1; fi
                if [ -z "$LF" ] || [ -z "$LS" ]; then echo "candidate $1: REJECTED - gate b (certificate lacks largest_userdata_file / largest_userdata_sha256)"; return 1; fi
                if ! tar -xf "$DLDIR/phonevault-state.tar" -C "$STAGE" "$LF" 2>/dev/null; then echo "candidate $1: REJECTED - gate b (largest userdata file not extractable from tar)"; return 1; fi
                ACT="$(sha256sum "$STAGE/$LF" | awk '{print $1}')"
                if [ "$ACT" != "$LS" ]; then echo "candidate $1: REJECTED - gate b (recomputed userdata SHA-256 != certificate largest_userdata_sha256)"; return 1; fi
                echo "candidate $1: ACCEPTED - certificate gates passed"
                cp "$CERT" "$EVID/restored-version.txt"
                return 0
              }
              FOUND_RUN=""
              RESTORE_PATH=""
              for CAND in $CANDIDATES; do
                rm -rf "$DLDIR"; mkdir -p "$DLDIR"
                KIND="${CAND%%:*}"
                REST="${CAND#*:}"
                if [ "$KIND" = "run" ]; then
                  echo "-- candidate: artifact phonevault-avd-state from run $REST --"
                  gh run download "$REST" --name phonevault-avd-state --dir "$DLDIR" 2>&1 | tail -2
                  if try_candidate "run $REST"; then FOUND_RUN="$REST"; RESTORE_PATH="runs"; break; fi
                else
                  AID2="${REST%%:*}"; ARUN2="${REST##*:}"
                  echo "-- candidate: artifact id $AID2 (run $ARUN2) via artifacts API --"
                  if gh api "repos/${{ github.repository }}/actions/artifacts/$AID2/zip" > "$DLDIR/phonevault-state.zip" 2>"$EVID/art-dl.err" && [ -s "$DLDIR/phonevault-state.zip" ]; then
                    if command -v unzip >/dev/null 2>&1; then unzip -o "$DLDIR/phonevault-state.zip" -d "$DLDIR" >/dev/null 2>&1; else python3 -c "import zipfile; zipfile.ZipFile('$DLDIR/phonevault-state.zip').extractall('$DLDIR')" 2>&1; fi
                  else
                    echo "artifact zip download failed:"; cat "$EVID/art-dl.err" 2>&1
                  fi
                  if try_candidate "artifact $AID2 (run $ARUN2)"; then FOUND_RUN="${ARUN2:-api-$AID2}"; RESTORE_PATH="artifacts-api"; break; fi
                fi
              done
              echo "RESTORE_PATH=${RESTORE_PATH:-none}"
              if [ -z "$FOUND_RUN" ]; then
                echo "RESTORE_FAILED=1 - no candidate pack passed the certificate gates (pinned + verified fetch; see candidate lines above)"
              else
                echo "state_source_run=$FOUND_RUN"
                echo "restore_path=$RESTORE_PATH"
                ls -lh "$DLDIR/phonevault-state.tar"
                echo "-- accepted pack's phonevault-version.txt (the birth certificate to match) --"
                cat "$EVID/restored-version.txt"
                EXPECTED_ID="$(sed -n 's/^android_id=//p' "$EVID/restored-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                EXPECTED_MARKER="$(sed -n 's/^marker_token=//p' "$EVID/restored-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                RESTORED_SESSION="$(sed -n 's/^session=//p' "$EVID/restored-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                case "$RESTORED_SESSION" in ''|*[!0-9]*) RESTORED_SESSION=0;; esac
                RESTORED_MARKER_OK="$(sed -n 's/^marker_ok=//p' "$EVID/restored-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                case "$RESTORED_MARKER_OK" in 1) : ;; *) if [ -n "$EXPECTED_MARKER" ]; then RESTORED_MARKER_OK=1; else RESTORED_MARKER_OK=0; fi;; esac
                echo "expected_android_id=$EXPECTED_ID"
                echo "expected_marker_token=$EXPECTED_MARKER"
                echo "restored_session=$RESTORED_SESSION"
                echo "restored_marker_ok=$RESTORED_MARKER_OK (0 = the packed run never verified its marker; the identity proof then judges android_id only)"
                echo "-- untar into $AVDDIR BEFORE boot (overwrites the fresh AVD's userdata + config.ini with the packed ones) --"
                tar -xf "$DLDIR/phonevault-state.tar" -C "$AVDDIR" 2>&1; echo "untar_rc=$?"
                ls -lh "$AVDDIR" 2>&1 | head -20
                UD_FOUND=""
                for uf in userdata-qemu.img.qcow2 userdata-qemu.img userdata.img; do
                  if [ -f "$AVDDIR/$uf" ]; then UD_FOUND="$uf"; break; fi
                done
                if [ -n "$UD_FOUND" ] && [ -f "$AVDDIR/config.ini" ]; then
                  RESTORE_OK=1
                  echo "RESTORE_OK=1 - state restored (userdata file found: $UD_FOUND); boot will run WITHOUT -wipe-data"
                else
                  echo "RESTORE_FAILED=1 - untar produced no userdata candidate (userdata-qemu.img.qcow2 / userdata-qemu.img / userdata.img) and/or no config.ini in the AVD folder"
                fi
              fi
            fi
          } > "$EVID/02c-restore.txt" 2>&1
          cat "$EVID/02c-restore.txt"

          # v3.5 split bridge: hand the small scalars to the following steps
          {
            echo "RESTORE_OK=$RESTORE_OK"
            echo "EXPECTED_ID=$EXPECTED_ID"
            echo "EXPECTED_MARKER=$EXPECTED_MARKER"
            echo "RESTORED_SESSION=$RESTORED_SESSION"
            echo "RESTORED_MARKER_OK=$RESTORED_MARKER_OK"
          } >> "$GITHUB_ENV"

      - name: PhoneVault step 4 of 8 - boot + capture identity and marker (v3.6)
        shell: bash
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"

          EMU_PID=""
          {
            echo "===== 3 boot emulator headless (bounded wait 12 min) ====="
            if [ "$AVD_OK" != "1" ]; then
              echo "BOOT_SKIPPED=1 - AVD creation failed (CONFIG_MISSING, see sections 2 + 02b); boot NOT attempted - the job ends in minutes with a NO BOOT verdict instead of hanging"
              echo "BOOTED_FLAG="
            elif [ "$MODE" = "roundtrip2" ]; then
              echo "BOOT_SKIPPED=1 - roundtrip2 mode: no boot in this step; attempt N (section 08a) and attempt S (section 08b) each run their own birth + restore boots inside the roundtrip2 steps, with per-attempt flags (-feature -EncryptUserData / -snapshot pv1) that this step's single boot cannot express"
              echo "BOOTED_FLAG="
            elif [ "$MODE" = "restore" ] && [ "$RESTORE_OK" != "1" ]; then
              echo "BOOT_SKIPPED=1 - restore mode but the state restore failed (RESTORE_FAILED, see section 02c); boot NOT attempted"
              echo "BOOTED_FLAG="
            else
              EMU_BIN="$ANDROID_HOME/emulator/emulator"
              # -wipe-data is FRESH mode only: it guarantees a clean, deterministic
              # first start of a brand-new phone. RESTORE boots must NEVER pass it
              # (DESIGN.md section 3 - it would factory-reset the restored phone).
              if [ "$MODE" = "restore" ]; then WIPE_FLAG=""; else WIPE_FLAG="-wipe-data"; fi
              echo "mode=$MODE wipe_flag='${WIPE_FLAG:-<none - restore boot>}'"
              nohup "$EMU_BIN" @"$AVD" -port 5554 -no-window -no-audio -no-boot-anim \
                -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 \
                -no-snapshot $WIPE_FLAG > "$EVID/emulator-console.log" 2>&1 &
              EMU_PID=$!
              echo "emulator_pid=$EMU_PID"
              timeout 90 adb -s emulator-5554 wait-for-device 2>&1; echo "wait_for_device_rc=$? (124 = timed out after 90s; the bounded poll below still runs)"
              BOOTED=""
              for i in $(seq 1 36); do
                BC="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
                echo "poll $i: sys.boot_completed='$BC'"
                if [ "$BC" = "1" ]; then BOOTED=1; break; fi
                sleep 20
              done
              echo "BOOTED_FLAG=$BOOTED"
              adb devices 2>&1
              if [ "$BOOTED" = "1" ]; then echo "boot_wait_result: sys.boot_completed=1 reached"; else echo "boot_wait_result: TIMEOUT after 12 min"; fi
            fi
          } > "$EVID/03-boot.txt" 2>&1
          cat "$EVID/03-boot.txt"

          PV_MARKER=""
          MARKER_OK=0
          {
            echo "===== 4 capture identity + marker (only if booted) ====="
            BOOTED="$(grep -c 'BOOTED_FLAG=1' "$EVID/03-boot.txt")"
            if [ "$BOOTED" = "1" ]; then
              ANDROID_ID="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
              printf '%s' "$ANDROID_ID" > "$EVID/android-id.txt"
              echo "android_id: $ANDROID_ID"
              echo "model: $(adb -s emulator-5554 shell getprop ro.product.model 2>/dev/null | tr -d '\r')"
              echo "device: $(adb -s emulator-5554 shell getprop ro.product.device 2>/dev/null | tr -d '\r')"
              echo "android_release: $(adb -s emulator-5554 shell getprop ro.build.version.release 2>/dev/null | tr -d '\r')"
              echo "android_sdk: $(adb -s emulator-5554 shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r')"
              if [ "$MODE" = "restore" ]; then
                # RESTORE: the marker file is READ ONLY here - never overwritten.
                # Identity = BOTH the live android_id AND the marker readback equal
                # the values sealed in the restored phonevault-version.txt.
                ACTUAL_MARKER="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
                echo "expected_android_id: $EXPECTED_ID"
                echo "actual_android_id: $ANDROID_ID"
                echo "expected_marker_token: $EXPECTED_MARKER"
                echo "actual_marker_token: $ACTUAL_MARKER"
                FAILPARTS=""
                if [ "$ANDROID_ID" != "$EXPECTED_ID" ]; then FAILPARTS="android_id mismatch (expected $EXPECTED_ID, got $ANDROID_ID)"; fi
                # The marker half of the proof runs only when the packed run
                # actually verified its marker (marker_ok=1 in the restored
                # version file); otherwise identity is judged on android_id
                # alone and the marker is reported as not evaluated - never
                # silently passed, never failed on an empty expectation.
                MARKER_EVAL=1
                if [ "$RESTORED_MARKER_OK" != "1" ] || [ -z "$EXPECTED_MARKER" ]; then MARKER_EVAL=0; fi
                if [ "$MARKER_EVAL" = "1" ]; then
                  if [ "$ACTUAL_MARKER" != "$EXPECTED_MARKER" ]; then
                    if [ -n "$FAILPARTS" ]; then FAILPARTS="$FAILPARTS; "; fi
                    FAILPARTS="${FAILPARTS}marker mismatch (expected $EXPECTED_MARKER, got '${ACTUAL_MARKER:-<missing/empty>}')"
                    MARKER_OK=0
                  else
                    MARKER_OK=1
                  fi
                  echo "marker_check: EVALUATED (restored pack marker_ok=1)"
                else
                  MARKER_OK=$RESTORED_MARKER_OK
                  echo "marker_check: NOT EVALUATED - restored pack carries no verified marker (marker_ok=$RESTORED_MARKER_OK); identity judged on android_id only"
                fi
                if [ -z "$FAILPARTS" ]; then IVERDICT="IDENTITY PROOF: SAME PHONE"; else IVERDICT="IDENTITY LOST — $FAILPARTS"; fi
                echo "identity_verdict: $IVERDICT"
                printf '%s\n' "$IVERDICT" > "$EVID/identity-verdict.txt"
                printf 'MARKER_OK=%s\n' "$MARKER_OK" > "$EVID/marker-state.txt"
                PV_MARKER="$EXPECTED_MARKER"
              else
                TOKEN="pv1-$(date -u +%Y%m%d%H%M%S)-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
                echo "$TOKEN" > phonevault-marker-token.txt
                # v3.4 MARKER VIA PUSH: run No.3 evidence - the old shell
                # redirect (an adb-shell echo into /sdcard) failed on
                # this image with "/system/bin/sh: can't create
                # /sdcard/phonevault-marker-boot1.txt: Operation not
                # permitted" and the readback came back empty, yet CAPTURE_OK
                # still claimed success. Write the token to a local runner
                # file, adb push it, and verify by cat readback; the marker
                # counts only when the readback reproduces the token.
                printf '%s\n' "$TOKEN" > phonevault-marker-local.txt
                adb -s emulator-5554 push phonevault-marker-local.txt /sdcard/phonevault-marker-boot1.txt 2>&1; echo "marker_push_rc=$?"
                MARKER_READBACK="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
                echo "marker_token: $TOKEN"
                echo "marker_readback: $MARKER_READBACK"
                if [ "$MARKER_READBACK" = "$TOKEN" ]; then
                  MARKER_OK=1
                  echo "MARKER_OK=1 - marker pushed via adb push and verified by readback"
                else
                  MARKER_OK=0
                  echo "MARKER_FAILED - adb push/readback did not reproduce the token; the marker is NOT verified on the phone and must not be claimed"
                fi
                printf 'MARKER_OK=%s\n' "$MARKER_OK" > "$EVID/marker-state.txt"
                PV_MARKER="$TOKEN"
              fi
              adb -s emulator-5554 exec-out screencap -p > phone-boot.png 2>/dev/null
              ls -l phone-boot.png 2>&1
              echo "CAPTURE_OK=1"
            else
              echo "CAPTURE_OK=0 - not booted, no identity to capture"
              if [ "$MODE" = "restore" ]; then echo "identity_verdict: NOT EVALUATED - phone did not boot"; fi
              echo "--- emulator console log (tail 60) ---"
              if [ -f "$EVID/emulator-console.log" ]; then tail -60 "$EVID/emulator-console.log" 2>&1; else echo "no emulator console log (boot not attempted - see section 3)"; fi
            fi
          } > "$EVID/04-capture.txt" 2>&1
          cat "$EVID/04-capture.txt"


          # v3.4.1 split bridge: hand the small scalars to the following steps
          {
            echo "EMU_PID=$EMU_PID"
            echo "PV_MARKER=$PV_MARKER"
          } >> "$GITHUB_ENV"
      - name: PhoneVault step 5 of 8 - graceful shutdown + pack (v3.6)
        shell: bash
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"

          {
            echo "===== 5 shutdown (v3.5 GRACEFUL - the pack waits for a provably dead emulator) ====="
            if [ "$AVD_OK" != "1" ]; then echo "no emulator was started (boot skipped after CONFIG_MISSING)"; fi
            # v3.5 H5 guard. What v3.4.2 did here (its step 4, read verbatim):
            # 'adb emu kill', ONE fixed 'sleep 5', then a check of the
            # LAUNCHER wrapper PID only - and if that PID lingered it
            # escalated kill -> kill -9 and PACKED ANYWAY; the string
            # qemu-system appears nowhere in v3.4.2, so the process that
            # actually owns the drives was never checked. QEMU attaches
            # userdata + encryptionkey with cache=unsafe (diagnosis sections
            # 3c/4c argv lines), so guest writes can sit in the QEMU/host
            # cache: a tar taken while qemu lives, or right after a SIGKILL,
            # can seal a half-flushed /data whose first-boot FBE key
            # finalization never reached the qcow2 - the restore then
            # first-boots and mints a new encryptionkey overlay, which is
            # exactly the run No.9 + diagnosis A/B signature. v3.5: emu kill,
            # then a bounded poll until BOTH the launcher PID AND every
            # qemu-system process are gone; NO hard kill anywhere on the
            # pack path - if a clean stop is not proven in 120s the pack is
            # SKIPPED (see section 6), never sealed from suspect state.
            GRACEFUL_OK=0
            adb -s emulator-5554 emu kill 2>&1; echo "emu_kill_rc=$?"
            for i in $(seq 1 24); do
              ALIVE=""
              if [ -n "$EMU_PID" ] && kill -0 "$EMU_PID" 2>/dev/null; then ALIVE="$ALIVE launcher_pid=$EMU_PID"; fi
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then ALIVE="$ALIVE qemu-system_pids=$(pgrep -f 'qemu-system' 2>/dev/null | tr '\n' ' ')"; fi
              if [ -z "$ALIVE" ]; then
                GRACEFUL_OK=1
                echo "graceful stop confirmed: launcher + qemu-system all gone at poll $i (~$(( (i - 1) * 5 ))s after emu kill)"
                break
              fi
              echo "shutdown poll $i: still alive:$ALIVE"
              sleep 5
            done
            if [ "$GRACEFUL_OK" = "1" ]; then
              echo "GRACEFUL_STOP=1"
            else
              echo "GRACEFUL_STOP=0 - emulator/qemu still alive after 120s; the pack in section 6 will be SKIPPED (H5 guard: never seal after a hard kill)"
            fi
            printf 'GRACEFUL_OK=%s\n' "$GRACEFUL_OK" > "$EVID/graceful-state.txt"
            sync 2>/dev/null; echo "host sync done (host page cache flushed before tar)"
            df -h / | tail -1
            du -sh "$ANDROID_AVD_HOME/$AVD.avd" 2>/dev/null
            ls -lh "$ANDROID_AVD_HOME/$AVD.avd/" 2>/dev/null | head -20

          } > "$EVID/05-shutdown.txt" 2>&1
          cat "$EVID/05-shutdown.txt"

          {
            echo "===== 6 pack AVD state (artifact transport - NOT the vault) ====="
            printf 'PACK_OK=0\n' > "$EVID/pack-state.txt"
            BOOTED6="$(grep -c 'BOOTED_FLAG=1' "$EVID/03-boot.txt")"
            if [ "$BOOTED6" != "1" ]; then
              echo "PACK_SKIPPED=1 - phone did not boot; nothing worth sealing"
            elif [ "$MODE" = "restore" ] && ! grep -q 'SAME PHONE' "$EVID/identity-verdict.txt" 2>/dev/null; then
              echo "PACK_SKIPPED=1 - restore mode but the identity verdict is not SAME PHONE; refusing to re-seal a phone that is not the restored one (poisoned-shelf guard, DIAGNOSIS2 trap 1)"
            elif ! grep -q 'GRACEFUL_OK=1' "$EVID/graceful-state.txt" 2>/dev/null; then
              echo "PACK_SKIPPED=1 - graceful shutdown NOT confirmed (launcher/qemu processes not proven gone); refusing to seal possibly-unflushed userdata (H5 guard, v3.5)"
            else
              AVDDIR="$ANDROID_AVD_HOME/$AVD.avd"
              echo "-- AVD folder listing BEFORE pack (discovery evidence; no state filename is assumed) --"
              ls -lh "$AVDDIR" 2>&1
              # v3.4 PACK BY DISCOVERY. Run No.3 evidence: this emulator
              # version writes userdata-qemu.img (base) + userdata-qemu.img.qcow2
              # (the grown overlay) and encryptionkey.img + encryptionkey.img.qcow2;
              # the fixed filename DESIGN.md section 2 assumed is never
              # written, so the v3.2/v3.3 pack skipped every time. Discover
              # instead: tar every PRESENT file from the candidate list below;
              # skip only when NONE of the userdata candidates exists.
              # Why the encryptionkey images travel with userdata: /data is
              # file-based encrypted and its keys are wrapped against the
              # encryption key image - userdata without its encryptionkey set
              # is undecryptable on restore. The qcow2 set (userdata base +
              # overlay, encryptionkey base + overlay) IS the phone's
              # identity and travels as one.
              UD_CANDIDATES="userdata-qemu.img.qcow2 userdata-qemu.img userdata.img"
              UD_PRESENT=""
              for uf in $UD_CANDIDATES; do
                if [ -f "$AVDDIR/$uf" ]; then UD_PRESENT="$UD_PRESENT $uf"; else echo "pack discover: userdata candidate absent: $uf"; fi
              done
              if [ -z "$UD_PRESENT" ]; then
                echo "PACK_SKIPPED=1 - none of the userdata candidates ($UD_CANDIDATES) exists in the AVD folder; nothing to seal"
              else
                echo "userdata candidates present:$UD_PRESENT"
                if [ "$MODE" = "restore" ]; then SESSION=$((RESTORED_SESSION + 1)); else SESSION=1; fi
                EMU_PKG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
                SYSIMG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
                EMUVER="$("$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -1 | tr -d '\r')"
                if [ -z "$EMUVER" ]; then EMUVER="pkgrev:$EMU_PKG_REV"; fi
                AID="$(cat "$EVID/android-id.txt" 2>/dev/null)"
                MARKER_OK_PACK=0
                if [ -f "$EVID/marker-state.txt" ] && grep -q 'MARKER_OK=1' "$EVID/marker-state.txt"; then MARKER_OK_PACK=1; fi
                if [ "$MARKER_OK_PACK" = "1" ]; then MT="$PV_MARKER"; else MT=""; fi
                # largest userdata file (by bytes) carries the grown phone;
                # its SHA-256 is the pack's integrity anchor
                LARGEST=""; LARGEST_SIZE=0
                for uf in $UD_PRESENT; do
                  SZ="$(stat -c %s "$AVDDIR/$uf" 2>/dev/null)"; case "$SZ" in ''|*[!0-9]*) SZ=0;; esac
                  if [ "$SZ" -gt "$LARGEST_SIZE" ]; then LARGEST_SIZE=$SZ; LARGEST=$uf; fi
                done
                SHA="$(sha256sum "$AVDDIR/$LARGEST" | awk '{print $1}')"
                # full candidate list for the tar: discovered userdata +
                # encryptionkey set + sdcard + the config set + the version
                # file generated below. Anything absent is simply not packed.
                CANDIDATES="$UD_PRESENT encryptionkey.img.qcow2 encryptionkey.img sdcard.img config.ini emulator-user.ini hardware-qemu.ini"
                LIST=""
                SIZES_FILE="$EVID/pack-sizes.txt"; : > "$SIZES_FILE"
                for f in $CANDIDATES; do
                  if [ -f "$AVDDIR/$f" ]; then
                    LIST="$LIST $f"
                    printf 'packed_file: %s %s bytes\n' "$f" "$(stat -c %s "$AVDDIR/$f" 2>/dev/null)" >> "$SIZES_FILE"
                  else
                    echo "pack: absent, skipped: $f"
                  fi
                done
                {
                  echo "avd_name=$AVD"
                  echo "system_image=$SYSIMG"
                  echo "emulator_version=$EMUVER"
                  echo "emulator_pkg_revision=$EMU_PKG_REV"
                  echo "system_image_revision=$SYSIMG_REV"
                  echo "session=$SESSION"
                  echo "packed_utc=$(date -u +%FT%TZ)"
                  echo "android_id=$AID"
                  echo "marker_token=$MT"
                  echo "marker_ok=$MARKER_OK_PACK"
                  echo "largest_userdata_file=$LARGEST"
                  echo "largest_userdata_size_bytes=$LARGEST_SIZE"
                  echo "largest_userdata_sha256=$SHA"
                  cat "$SIZES_FILE"
                  echo "packed_file: phonevault-version.txt (this file)"
                } > "$AVDDIR/phonevault-version.txt"
                echo "-- phonevault-version.txt written into the pack --"
                cat "$AVDDIR/phonevault-version.txt"
                LIST="$LIST phonevault-version.txt"
                echo "pack set:$LIST"
                echo "excluded by construction (never in the candidate list): cache.img, cache.img.qcow2, snapshots/, *.lock"
                tar -cf phonevault-state.tar -C "$AVDDIR" $LIST 2>&1; echo "tar_rc=$?"
                ls -lh phonevault-state.tar 2>&1
                echo "-- tar contents --"
                tar -tf phonevault-state.tar 2>&1
                if [ -f phonevault-state.tar ]; then
                  printf 'PACK_OK=1\n' > "$EVID/pack-state.txt"
                  if [ "$MODE" = "roundtrip" ]; then
                    echo "PACK_OK=1 - roundtrip mode: pack tar stays LOCAL (no .pv-pack-ok flag, no artifact upload); the roundtrip step restores from this exact tar"
                  else
                    touch .pv-pack-ok
                    echo "PACK_OK=1 - pack tar created and flagged (.pv-pack-ok) for the conditioned upload step"
                  fi
                else
                  echo "PACK_FAILED=1 - tar did not produce phonevault-state.tar"
                fi
              fi
            fi
          } > "$EVID/06-pack.txt" 2>&1
          cat "$EVID/06-pack.txt"

          # stash evidence where the (always) output step can find it
          cp -r "$EVID" .pv-evidence-final 2>/dev/null
          printf '%s\n' "$MODE" > .pv-mode.txt
          if [ -f phone-boot.png ]; then cp phone-boot.png .pv-screencap.png; fi
          if [ -f phonevault-marker-token.txt ]; then cp phonevault-marker-token.txt .pv-marker-token.txt; fi
          echo "evidence stashed"

      - name: PhoneVault step 6 of 8 - roundtrip restore + boot 2 + verdict (v3.6, roundtrip mode only)
        shell: bash
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          MODE="${MODE:-fresh}"
          {
            echo "===== 7 roundtrip: wipe + clean-room restore from THIS JOB's local tar + boot 2 ====="
            if [ "$MODE" != "roundtrip" ]; then
              echo "mode=$MODE - roundtrip not applicable (fresh keeps its pack as an artifact; restore judges the shelf pack in section 4)"
            elif ! grep -q 'PACK_OK=1' "$EVID/pack-state.txt" 2>/dev/null || [ ! -f phonevault-state.tar ]; then
              echo "ROUNDTRIP NOT EVALUATED - this job produced no verified local pack (see sections 5-6)"
              printf '%s\n' "ROUNDTRIP: NOT EVALUATED - no local pack from this job" > "$EVID/identity-verdict.txt"
            else
              AVDDIR="$ANDROID_AVD_HOME/$AVD.avd"
              TAR="$PWD/phonevault-state.tar"
              CERTDIR="pv-rt-cert"
              rm -rf "$CERTDIR"; mkdir -p "$CERTDIR"
              echo "-- certificate read from the tar itself (the artifact shelf is never touched in roundtrip mode) --"
              tar -xf "$TAR" -C "$CERTDIR" phonevault-version.txt 2>&1; echo "cert_extract_rc=$?"
              cat "$CERTDIR/phonevault-version.txt" 2>&1
              RT_ID1="$(sed -n 's/^android_id=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
              RT_MARKER="$(sed -n 's/^marker_token=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
              RT_LF="$(sed -n 's/^largest_userdata_file=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
              RT_LS="$(sed -n 's/^largest_userdata_sha256=//p' "$CERTDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
              RT_SHA_OK=0
              if [ -n "$RT_LF" ] && tar -xf "$TAR" -C "$CERTDIR" "$RT_LF" 2>/dev/null; then
                RT_ACT="$(sha256sum "$CERTDIR/$RT_LF" 2>/dev/null | awk '{print $1}')"
                if [ "$RT_ACT" = "$RT_LS" ]; then RT_SHA_OK=1; fi
              fi
              if [ "$RT_SHA_OK" = "1" ]; then echo "roundtrip tar integrity: recomputed largest-userdata SHA-256 == certificate - YES"; else echo "roundtrip tar integrity: recomputed largest-userdata SHA-256 == certificate - NO"; fi
              echo "roundtrip_id_boot1 (from this job's certificate)=$RT_ID1"
              echo "roundtrip_marker_expected (from certificate)=$RT_MARKER"
              echo "-- WIPE the AVD folder completely (after this, the phone exists ONLY inside the local tar) --"
              rm -rf "$AVDDIR" "$ANDROID_AVD_HOME/$AVD.ini"
              ls -la "$ANDROID_AVD_HOME" 2>&1
              echo "-- hand-make a clean AVD folder (diagnosis attempt B shape: no avdmanager run, no stray template userdata.img) --"
              mkdir -p "$AVDDIR"
              printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/%s.avd\ntarget=android-34\n' "$AVDDIR" "$AVD" > "$ANDROID_AVD_HOME/$AVD.ini"
              cat "$ANDROID_AVD_HOME/$AVD.ini"
              echo "-- untar the local pack into the clean folder --"
              tar -xf "$TAR" -C "$AVDDIR" 2>&1; echo "untar_rc=$?"
              ls -lh "$AVDDIR" 2>&1 | head -20
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "WARNING: a qemu-system process is still alive before boot 2 (should not happen after the graceful pack)"; fi
              echo "-- boot 2 WITHOUT -wipe-data (restore semantics: the restored state must be honored, not reset) --"
              nohup "$ANDROID_HOME/emulator/emulator" @"$AVD" -port 5554 -no-window -no-audio -no-boot-anim \
                -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 \
                -no-snapshot > "$EVID/emulator-console-rt.log" 2>&1 &
              RT_PID=$!
              echo "roundtrip_emulator_pid=$RT_PID"
              timeout 90 adb -s emulator-5554 wait-for-device 2>&1; echo "wait_for_device_rc=$?"
              RT_BOOTED=""
              for i in $(seq 1 36); do
                BC="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
                echo "boot2 poll $i: sys.boot_completed='$BC'"
                if [ "$BC" = "1" ]; then RT_BOOTED=1; break; fi
                sleep 20
              done
              if [ "$RT_BOOTED" = "1" ]; then
                RT_ID2="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                RT_READBACK="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
                echo "roundtrip_id_boot1=$RT_ID1"
                echo "roundtrip_id_boot2=$RT_ID2"
                echo "roundtrip_marker_expected=$RT_MARKER"
                echo "roundtrip_marker_readback=$RT_READBACK"
                RT_FAIL=""
                if [ "$RT_ID2" != "$RT_ID1" ]; then RT_FAIL="android_id mismatch (boot1 $RT_ID1, boot2 $RT_ID2)"; fi
                if [ -n "$RT_MARKER" ] && [ "$RT_READBACK" != "$RT_MARKER" ]; then
                  if [ -n "$RT_FAIL" ]; then RT_FAIL="$RT_FAIL; "; fi
                  RT_FAIL="${RT_FAIL}marker mismatch (expected $RT_MARKER, got '${RT_READBACK:-<missing/empty>}')"
                fi
                if [ "$RT_SHA_OK" != "1" ]; then
                  if [ -n "$RT_FAIL" ]; then RT_FAIL="$RT_FAIL; "; fi
                  RT_FAIL="${RT_FAIL}tar integrity mismatch (recomputed SHA-256 != certificate)"
                fi
                if [ -z "$RT_FAIL" ]; then
                  RTV="ROUNDTRIP PROOF: SAME PHONE"
                else
                  RTV="ROUNDTRIP: IDENTITY LOST - $RT_FAIL"
                fi
                echo "roundtrip_verdict: $RTV"
                printf '%s\n' "$RTV" > "$EVID/identity-verdict.txt"
              else
                echo "ROUNDTRIP NOT EVALUATED - boot 2 never reached sys.boot_completed=1 in the bounded wait"
                printf '%s\n' "ROUNDTRIP: NOT EVALUATED - boot 2 failed" > "$EVID/identity-verdict.txt"
                echo "--- roundtrip emulator console log (tail 40) ---"
                tail -40 "$EVID/emulator-console-rt.log" 2>&1
              fi
              adb -s emulator-5554 emu kill 2>&1; echo "roundtrip_emu_kill_rc=$?"
              for i in $(seq 1 12); do
                if ! pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "roundtrip emulator stopped at poll $i"; break; fi
                sleep 5
              done
            fi
          } > "$EVID/07-roundtrip.txt" 2>&1
          cat "$EVID/07-roundtrip.txt"
          mkdir -p .pv-evidence-final
          cp "$EVID/07-roundtrip.txt" .pv-evidence-final/ 2>/dev/null
          if [ -f "$EVID/identity-verdict.txt" ]; then cp "$EVID/identity-verdict.txt" .pv-evidence-final/ 2>/dev/null; fi
          echo "roundtrip evidence merged into .pv-evidence-final"

      - name: PhoneVault step 7 of 8 - roundtrip2 attempt N - no-lock birth (v3.6, roundtrip2 mode only)
        shell: bash
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"
          AVDDIR="$ANDROID_AVD_HOME/$AVD.avd"
          EMU_BIN="$ANDROID_HOME/emulator/emulator"
          SECN="$EVID/08a-roundtrip2-n.txt"; : > "$SECN"
          VERDICTS="$EVID/rt2-verdicts.txt"; : > "$VERDICTS"
          # ---- roundtrip2 shared helpers (an identical copy lives in the
          # attempt-S step: GitHub steps are separate shells, so only files
          # persist between steps, never functions) ----
          rt2_boot() {
            # $1 = boot console log; remaining args = extra emulator flags.
            # Base flags are the v3.5 production set. Sets RT2_BOOTED/RT2_PID.
            local LOG="$1"; shift
            nohup "$EMU_BIN" @"$AVD" -port 5554 -no-window -no-audio -no-boot-anim \
              -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 "$@" > "$LOG" 2>&1 &
            RT2_PID=$!
            echo "emulator_pid=$RT2_PID (extra flags: $*)"
            timeout 90 adb -s emulator-5554 wait-for-device 2>&1; echo "wait_for_device_rc=$? (124 = timed out; the bounded poll below still runs)"
            RT2_BOOTED=""
            for i in $(seq 1 30); do
              BC="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              echo "boot poll $i: sys.boot_completed='$BC'"
              if [ "$BC" = "1" ]; then RT2_BOOTED=1; break; fi
              sleep 20
            done
            if [ "$RT2_BOOTED" = "1" ]; then echo "boot_wait_result: sys.boot_completed=1 reached"; else echo "boot_wait_result: TIMEOUT after 10 min"; fi
          }

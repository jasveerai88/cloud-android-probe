              ALIVE=""
              if [ -n "$RT2_PID" ] && kill -0 "$RT2_PID" 2>/dev/null; then ALIVE="$ALIVE launcher_pid=$RT2_PID"; fi
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then ALIVE="$ALIVE qemu-system present"; fi
              if [ -z "$ALIVE" ]; then RT2_GRACEFUL=1; echo "graceful stop confirmed at poll $i"; break; fi
              echo "shutdown poll $i: still alive:$ALIVE"; sleep 5

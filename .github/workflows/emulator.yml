                        echo "ROUNDTRIP5-C: NOT EVALUATED - the second reboot never reached sys.boot_completed=1 in ~15 min (the apply readings above stand; survival unproven)"
                        echo "ROUNDTRIP5-C: NOT EVALUATED - second reboot failed" >> "$VERDICTS"
                      else
                        FINAL_ID="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                        FINAL_MARKER="$(adb -s emulator-5554 shell cat "$RT4_MPATH" 2>/dev/null | tr -d '\r')"
                        rt4_root
                        FIN_MD5="$(adb -s emulator-5554 shell md5sum /data/system/users/0/settings_secure.xml 2>/dev/null | awk '{print $1}' | tr -d '\r')"
                        echo "android_id_AFTER_reboot2=$FINAL_ID"
                        echo "marker_AFTER_reboot2 (${RT4_MPATH})=$FINAL_MARKER"
                        echo "settings_secure.xml md5 after reboot2=$FIN_MD5 (birth=$CAP_MD5_BIRTH, restored-pre-apply=$PRE_MD5)"
                        C_FAIL=""
                        if [ "$X_ID" != "$CAP_ID" ]; then C_FAIL="extracted certificate android_id ($X_ID) != capsule android_id ($CAP_ID)"; fi
                        if [ "$X_MT" != "$RT4_TOKEN" ]; then
                          if [ -n "$C_FAIL" ]; then C_FAIL="$C_FAIL; "; fi
                          C_FAIL="${C_FAIL}extracted certificate marker_token != capsule token"
                        fi
                        if [ "$POST_ID" != "$CAP_ID" ]; then
                          if [ -n "$C_FAIL" ]; then C_FAIL="$C_FAIL; "; fi
                          C_FAIL="${C_FAIL}settings put did not take (post-apply android_id $POST_ID != capsule $CAP_ID)"
                        fi
                        if [ "$POST_MARKER" != "$RT4_TOKEN" ]; then
                          if [ -n "$C_FAIL" ]; then C_FAIL="$C_FAIL; "; fi
                          C_FAIL="${C_FAIL}marker not restored by the capsule tar (post-apply readback '${POST_MARKER:-<missing/empty>}')"
                        fi
                        SURVIVED="yes"
                        if [ "$FINAL_ID" != "$CAP_ID" ]; then
                          SURVIVED="no"
                          if [ -n "$C_FAIL" ]; then C_FAIL="$C_FAIL; "; fi
                          C_FAIL="${C_FAIL}applied android_id did NOT survive the extra reboot (after reboot2: $FINAL_ID)"
                        fi
                        if [ "$FINAL_MARKER" != "$RT4_TOKEN" ]; then
                          if [ -n "$C_FAIL" ]; then C_FAIL="$C_FAIL; "; fi
                          C_FAIL="${C_FAIL}marker did not survive the extra reboot (after reboot2: '${FINAL_MARKER:-<missing/empty>}')"
                        fi
                        if [ -z "$C_FAIL" ]; then
                          echo "ROUNDTRIP5-C: IDENTITY RESTORED (code-applied) - capsule android_id $CAP_ID re-applied by root after the disk restore (the restored boot had woken as $PRE_ID) and SURVIVED the extra reboot; marker restored from $RT4_MPATH and survived; this is code-applied identity, NOT disk-native persistence"
                          echo "ROUNDTRIP5-C: IDENTITY RESTORED (code-applied) - applied android_id survived the extra reboot" >> "$VERDICTS"
                        else
                          echo "ROUNDTRIP5-C: FAILED - $C_FAIL (birth $RT4_ID1, capsule $CAP_ID, restored-pre-apply $PRE_ID, post-apply $POST_ID, after-reboot2 $FINAL_ID; applied-id-survived-reboot=$SURVIVED)"
                          echo "ROUNDTRIP5-C: FAILED - $C_FAIL" >> "$VERDICTS"
                        fi
                      fi
                    fi
                    rt4_stop
                  fi
                fi
              fi
            fi
          } > "$SECE" 2>&1
          cat "$SECE"
          mkdir -p .pv-evidence-final
          cp "$SECE" .pv-evidence-final/ 2>/dev/null
          cp "$EVID/00e-disk-c2.txt" .pv-evidence-final/ 2>/dev/null
          if [ -s "$VERDICTS" ]; then cp "$VERDICTS" "$EVID/identity-verdict.txt"; cp "$EVID/identity-verdict.txt" .pv-evidence-final/ 2>/dev/null; fi
          echo "-- roundtrip5 verdicts so far --"
          cat "$VERDICTS" 2>&1
          echo "attempt C part 2 evidence merged into .pv-evidence-final"
          # v3.9 per-attempt cleanup: attempt C's verdict is sealed and
          # its evidence copied out - delete its multi-GB payloads NOW so
          # attempt S starts with the space they held (run No.17 lesson).
          # The AVD reset uses the same keep-list attempt S applies at
          # its own start, so this cannot break S's birth.
          if [ "$MODE" = "roundtrip5" ]; then
            echo "-- v3.9 cleanup after attempt C (verdict sealed) --"
            ls -lh pv-c-state.tar 2>&1
            rm -f pv-c-state.tar
            find "$AVDDIR" -mindepth 1 -maxdepth 1 ! -name 'config.ini' ! -name 'emulator-user.ini' ! -name 'hardware-qemu.ini' -exec rm -rf {} + 2>&1
            df -h . 2>&1 | tail -1
          fi


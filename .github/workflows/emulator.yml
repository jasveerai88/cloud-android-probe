            timeout 90 adb -s emulator-5554 wait-for-device 2>&1; echo "wait_for_device_rc=$?"
            local i BC
            for i in $(seq 1 45); do
              BC="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              echo "reboot poll $i: sys.boot_completed='$BC'"
              if [ "$BC" = "1" ]; then RT4_BOOTED=1; break; fi
              sleep 20
            done
            if [ "$RT4_BOOTED" = "1" ]; then echo "reboot_wait_result: sys.boot_completed=1 reached"; else echo "reboot_wait_result: TIMEOUT after ~15 min"; fi
          }
          # ---- attempt C part 2 (disk restore + root apply + reboot) ----
          rt5_disk_guard() {

                fi
              done
              echo "packed_file: phonevault-version.txt (this file)"
            } > "$AVDDIR/phonevault-version.txt"
            echo "-- phonevault-version.txt (in pack) --"; cat "$AVDDIR/phonevault-version.txt"
            LIST="$LIST phonevault-version.txt"
            rm -f "$RT4_TAR"
            tar -cf "$RT4_TAR" -C "$AVDDIR" --exclude='snapshots/default_boot' $LIST 2>"$EVID/rt4-tar-err.txt"; TARRC=$?
            cat "$EVID/rt4-tar-err.txt" 2>&1; echo "tar_rc=$TARRC"
            ls -lh "$RT4_TAR" 2>&1
            if [ "$TARRC" = "0" ] && [ -s "$RT4_TAR" ]; then RT4_PACK_OK=1; echo "PACK_OK=1 - local tar $RT4_TAR complete (tar_rc=0; never uploaded)"; else echo "PACK_FAILED=1 - tar_rc=$TARRC; the pack is NOT trusted and the AVD will NOT be wiped under it"; fi
          }
          # ---- attempt S part 1 (runs SECOND in roundtrip5) ----
          rt5_disk_guard() {
            # v3.9 disk guard ($1 = label): rc=1 when free < 2 GB.
            local FREEKB
            FREEKB="$(df -Pk . 2>/dev/null | awk 'NR==2 {print $4}')"
            echo "disk guard ($1): free_kb=${FREEKB:-unknown} floor_kb=2097152"
            df -h . 2>&1 | tail -1
            if [ -n "$FREEKB" ] && [ "$FREEKB" -lt 2097152 ]; then echo "DISK_GUARD=TRIPPED ($1)"; return 1; fi
            echo "DISK_GUARD=OK ($1)"
          }
          SECS="$EVID/11-roundtrip5-s.txt"; : > "$SECS"
          VERDICTS="$EVID/rt4-verdicts.txt"; [ -f "$VERDICTS" ] || : > "$VERDICTS"
          SSTATE="$EVID/rt4-s-state.txt"
          # v3.9: a guard trip seals NOT EVALUATED (disk) + skips the
          # body (deduped: one ROUNDTRIP5-S line per attempt).
          PV_SKIP_S1=""
          rt5_disk_guard "attempt S part 1 start" > "$EVID/00f-disk-s1.txt" 2>&1 || PV_SKIP_S1=1
          cat "$EVID/00f-disk-s1.txt"
          if [ "$PV_SKIP_S1" = "1" ]; then grep -q '^ROUNDTRIP5-S:' "$VERDICTS" 2>/dev/null || echo "ROUNDTRIP5-S: NOT EVALUATED (disk - free < 2 GB at the attempt S part 1 boundary; harness fault, not evidence)" >> "$VERDICTS"; fi
          {
            echo "===== 11 roundtrip5 attempt S (part 1): snapshot capsule, SECOND ====="
            if [ "$MODE" != "roundtrip5" ] || [ "$PV_SKIP_S1" = "1" ]; then
              if [ "$PV_SKIP_S1" = "1" ]; then echo "attempt S part 1 SKIPPED - ROUNDTRIP5-S NOT EVALUATED (disk) sealed by the v3.9 guard above"; else echo "mode=$MODE - attempt S part 1 not applicable (roundtrip5 mode only)"; fi
            elif [ "$AVD_OK" != "1" ]; then
              echo "ROUNDTRIP5-S: NOT RUN (AVD creation failed in step 2 - no AVD to birth)"
              echo "ROUNDTRIP5-S: NOT RUN (AVD creation failed in step 2)" >> "$VERDICTS"
            else
              echo "-- sequencing gate: attempt C's processes must be VERIFIABLY gone before S touches the AVD (bounded poll; a hung leftover is then cleared - no pack is in flight here) --"
              S_CLEAN=0
              for i in $(seq 1 24); do
                if pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "sequencing poll $i: qemu-system still alive"; sleep 5; else S_CLEAN=1; echo "no qemu-system alive at sequencing poll $i - attempt S may proceed"; break; fi
              done
              if [ "$S_CLEAN" != "1" ]; then
                echo "clearing the hung leftover before giving up (start hygiene):"
                rt4_kill_hung
                if pgrep -f 'qemu-system' >/dev/null 2>&1; then S_CLEAN=0; else S_CLEAN=1; echo "leftover cleared - attempt S may proceed"; fi
              fi
              if [ "$S_CLEAN" != "1" ]; then
                echo "ROUNDTRIP5-S: NOT RUN (emulator processes from attempt C still alive and could not be cleared - refusing to reset the AVD under a live emulator)"
                echo "ROUNDTRIP5-S: NOT RUN (attempt C emulator processes still alive, unclearable)" >> "$VERDICTS"
              else
                echo "-- reset the AVD to birth-clean: config set kept, every state file removed (attempt C's phone must not leak into attempt S) --"
                find "$AVDDIR" -mindepth 1 -maxdepth 1 ! -name 'config.ini' ! -name 'emulator-user.ini' ! -name 'hardware-qemu.ini' -exec rm -rf {} + 2>&1
                ls -la "$AVDDIR" 2>&1
                echo "-- birth boot (-wipe-data; snapshots ENABLED - deliberately NO -no-snapshot flag, or the save below cannot work) --"
                rt4_boot "$EVID/rt4-s-boot1.log" -wipe-data
                if [ "$RT4_BOOTED" != "1" ]; then
                  echo "ROUNDTRIP5-S: NOT RUN (birth boot failed on both attempts - runner problem, not evidence)"
                  echo "ROUNDTRIP5-S: NOT RUN (birth boot failed on both attempts)" >> "$VERDICTS"
                else
                  RT4_ID1="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                  echo "attempt_s_birth_android_id=$RT4_ID1"
                  rt4_marker
                  if [ "$RT4_MOK" != "1" ]; then
                    echo "ROUNDTRIP5-S: NOT EVALUATED (marker not written+verified at birth - v3.8 validity gate: such a birth proves nothing, attempt stops)"
                    echo "ROUNDTRIP5-S: NOT EVALUATED - marker write/verify failed at birth" >> "$VERDICTS"
                    rt4_stop
                  else
                    echo "-- save the capsule: adb emu avd snapshot save pv1 --"
                    adb -s emulator-5554 emu avd snapshot save pv1 2>&1; echo "snapshot_save_rc=$?"
                    sleep 3
                    SNAP_OK=0
                    if [ -s "$AVDDIR/snapshots/pv1/ram.bin" ]; then SNAP_OK=1; fi
                    echo "-- snapshots tree after the save --"
                    find "$AVDDIR/snapshots" -type f -exec ls -lh {} \; 2>&1 | head -25
                    echo "snapshot_saved=$SNAP_OK (requires snapshots/pv1/ram.bin present and non-empty)"
                    rt4_stop
                    if [ "$SNAP_OK" != "1" ]; then
                      echo "ROUNDTRIP5-S: NOT RUN (snapshot save produced no snapshots/pv1/ram.bin on disk - the capsule route could not be created on this emulator build)"
                      echo "ROUNDTRIP5-S: NOT RUN (snapshot save failed - no snapshots/pv1/ram.bin)" >> "$VERDICTS"
                    elif [ "$RT4_GRACEFUL" != "1" ]; then
                      echo "ROUNDTRIP5-S: NOT RUN (graceful stop unproven - pack refused under the v3.5 H5 guard)"
                      echo "ROUNDTRIP5-S: NOT RUN (graceful stop unproven)" >> "$VERDICTS"
                    else
                      rt4_pack_s pv-s-state.tar "route=roundtrip5-s" "snapshot_name=pv1" "snapshot_packed=1 - the AVD folder incl. snapshots/pv1 was packed (snapshots/default_boot EXCLUDED - emulator quick-boot cache, not our capsule); the restore boot loads the capsule with -snapshot pv1"
                      if [ "$RT4_PACK_OK" != "1" ]; then
                        echo "ROUNDTRIP5-S: NOT RUN (pack failed - tar_rc != 0 or tar missing; the AVD was NOT wiped under a bad pack)"
                        echo "ROUNDTRIP5-S: NOT RUN (pack failed)" >> "$VERDICTS"
                      else
                        SEAL_LINE="$(tar -tvf pv-s-state.tar 2>/dev/null | awk '$1 ~ /^-/ {print $3" "$6}' | sort -n | tail -1)"
                        SEAL_PATH="${SEAL_LINE#* }"
                        SEAL_SHA="$(tar -xOf pv-s-state.tar "$SEAL_PATH" 2>/dev/null | sha256sum | awk '{print $1}')"
                        echo "v3.8 seal: largest in tar: $SEAL_PATH (${SEAL_LINE%% *} bytes) sha256_from_tar=$SEAL_SHA (part 2 re-hashes the extracted file)"
                        {
                          echo "S_STATE=PENDING"
                          echo "SEAL_PATH=$SEAL_PATH"
                          echo "SEAL_SHA=$SEAL_SHA"
                        } > "$SSTATE"
                        echo "attempt S part 1 complete; handoff in $SSTATE"
                      fi
                    fi
                  fi
                fi
              fi
            fi
          } > "$SECS" 2>&1
          cat "$SECS"
          mkdir -p .pv-evidence-final
          cp "$SECS" .pv-evidence-final/ 2>/dev/null
          cp "$EVID/00f-disk-s1.txt" .pv-evidence-final/ 2>/dev/null
          if [ -s "$VERDICTS" ]; then cp "$VERDICTS" "$EVID/identity-verdict.txt"; cp "$EVID/identity-verdict.txt" .pv-evidence-final/ 2>/dev/null; fi
          echo "attempt S part 1 evidence merged into .pv-evidence-final"
      - name: PhoneVault step 12 of 15 - roundtrip5 attempt S part 2 - gated restore + snapshot boot + verdict (v3.9, roundtrip5 mode only)
        shell: bash
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"

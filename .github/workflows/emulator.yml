              CAPSHA="$(sed -n 's/^CAPSHA=//p' "$CSTATE" | tr -d '\r' | head -1)"
              CAP_MD5_BIRTH="$(sed -n 's/^CAP_MD5_BIRTH=//p' "$CSTATE" | tr -d '\r' | head -1)"
              RT4_TOKEN="$(sed -n 's/^CAP_TOKEN=//p' "$CSTATE" | tr -d '\r' | head -1)"
              RT4_MPATH="$(sed -n 's/^CAP_MPATH=//p' "$CSTATE" | tr -d '\r' | head -1)"
              RT4_ID1="$(sed -n 's/^CAP_BIRTH_ID=//p' "$CSTATE" | tr -d '\r' | head -1)"
              SEAL_PATH="$(sed -n 's/^SEAL_PATH=//p' "$CSTATE" | tr -d '\r' | head -1)"
              SEAL_SHA="$(sed -n 's/^SEAL_SHA=//p' "$CSTATE" | tr -d '\r' | head -1)"
              echo "capsule handoff read: android_id=$CAP_ID marker_token=$RT4_TOKEN marker_guest_path=$RT4_MPATH capsule_sha256=$CAPSHA settings_secure_md5_birth=$CAP_MD5_BIRTH seal_path=$SEAL_PATH seal_sha256=$SEAL_SHA"
              if [ ! -f pv-c-state.tar ] || [ ! -s "$CAPDIR/pv-capsule.tar" ]; then
                echo "ROUNDTRIP5-C: FAILED - part 1 reported PENDING but the local pack tar and/or the capsule tar is missing at part 2 start (build inconsistency, not a permanence result)"
                echo "ROUNDTRIP5-C: FAILED - pack tar or capsule missing at part 2 start" >> "$VERDICTS"
              else
                echo "-- v3.8 CERTIFICATE GATE (run 15 bug (c)): untar, read phonevault-version.txt FROM THE EXTRACTED FOLDER, assert identity BEFORE any boot; an empty or marker-less certificate is NOT EVALUATED, never IDENTITY LOST --"
                CTAR="$PWD/pv-c-state.tar"
                rm -rf "$AVDDIR" "$ANDROID_AVD_HOME/$AVD.ini"
                mkdir -p "$AVDDIR"
                printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/%s.avd\ntarget=android-34\n' "$AVDDIR" "$AVD" > "$ANDROID_AVD_HOME/$AVD.ini"
                tar -xf "$CTAR" -C "$AVDDIR" 2>&1; UNTARRC=$?; echo "untar_rc=$UNTARRC"
                ls -lh "$AVDDIR" 2>&1 | head -20
                echo "-- certificate FROM THE EXTRACTED FOLDER (the values the verdict uses) --"
                cat "$AVDDIR/phonevault-version.txt" 2>&1
                X_ID="$(sed -n 's/^android_id=//p' "$AVDDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                X_MOK="$(sed -n 's/^marker_ok=//p' "$AVDDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                X_MT="$(sed -n 's/^marker_token=//p' "$AVDDIR/phonevault-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                X_SHA=""
                if [ -n "$SEAL_PATH" ] && [ -f "$AVDDIR/$SEAL_PATH" ]; then X_SHA="$(sha256sum "$AVDDIR/$SEAL_PATH" | awk '{print $1}')"; fi
                echo "extracted_android_id=$X_ID extracted_marker_ok=$X_MOK extracted_marker_token=$X_MT"
                echo "integrity: sha256(extracted $SEAL_PATH)=$X_SHA vs seal (from-tar, part 1)=$SEAL_SHA - both printed; match by construction unless extraction corrupted the file"
                GATE_OK=1; GATE_REASON=""
                if [ "$UNTARRC" != "0" ]; then GATE_OK=0; GATE_REASON="untar_rc=$UNTARRC (extraction fault)"; fi
                if [ -z "$X_ID" ]; then GATE_OK=0; GATE_REASON="$GATE_REASON extracted certificate android_id is EMPTY;"; fi
                if [ "$X_MOK" != "1" ]; then GATE_OK=0; GATE_REASON="$GATE_REASON extracted certificate marker_ok != 1 (was '$X_MOK');"; fi
                if [ -z "$SEAL_SHA" ] || [ "$X_SHA" != "$SEAL_SHA" ]; then GATE_OK=0; GATE_REASON="$GATE_REASON integrity hash mismatch (extracted $X_SHA vs seal $SEAL_SHA);"; fi
                if [ "$GATE_OK" != "1" ]; then
                  echo "ROUNDTRIP5-C: NOT EVALUATED (certificate gate failed BEFORE boot:$GATE_REASON - a transport/extraction fault is not an identity result)"
                  echo "ROUNDTRIP5-C: NOT EVALUATED - certificate gate failed before boot" >> "$VERDICTS"
                else
                  echo "certificate gate PASSED: extracted_android_id=$X_ID marker_ok=1 integrity hash matches the from-tar seal"
                  echo "-- restore boot (standard flags, -no-snapshot, NO -wipe-data) --"
                  rt4_boot "$EVID/rt4-c-boot2.log" -no-snapshot
                  if [ "$RT4_BOOTED" != "1" ]; then
                    echo "ROUNDTRIP5-C: NOT EVALUATED - restore boot never reached sys.boot_completed=1 in ~15 min, and the one in-attempt retry also failed"
                    echo "ROUNDTRIP5-C: NOT EVALUATED - restore boot failed on both attempts" >> "$VERDICTS"
                  else
                    PRE_ID="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                    PRE_MARKER="$(adb -s emulator-5554 shell cat "$RT4_MPATH" 2>/dev/null | tr -d '\r')"
                    echo "restored_android_id_BEFORE_apply=$PRE_ID (CONTROL reading: runs No.9/11 and the diagnosis proved the disk restore re-initialises /data, so this is expected NOT to be the capsule value - identity is applied next, by code)"
                    echo "restored_marker_BEFORE_apply (${RT4_MPATH})='${PRE_MARKER:-<missing/empty>}'"
                    rt4_root
                    if [ "$RT4_ROOTED" != "1" ]; then
                      echo "ROUNDTRIP5-C: FAILED - adb root did not yield a uid=0 shell on the restored boot, so the capsule could not be applied (birth_id=$RT4_ID1 capsule_id=$CAP_ID restored_id=$PRE_ID)"
                      echo "ROUNDTRIP5-C: FAILED - adb root failed on the restored boot" >> "$VERDICTS"
                    else
                      PRE_MD5="$(adb -s emulator-5554 shell md5sum /data/system/users/0/settings_secure.xml 2>/dev/null | awk '{print $1}' | tr -d '\r')"

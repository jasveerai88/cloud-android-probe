              ALIVE=""
              if [ -n "$RT4_PID" ] && kill -0 "$RT4_PID" 2>/dev/null; then ALIVE="$ALIVE launcher_pid=$RT4_PID"; fi
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then ALIVE="$ALIVE qemu-system present"; fi
              if [ -z "$ALIVE" ]; then RT4_GRACEFUL=1; echo "graceful stop confirmed at poll $i"; break; fi

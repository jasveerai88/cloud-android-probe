                      adb -s emulator-5554 shell "tar -xf /data/local/tmp/pv-capsule-restore.tar -C /" 2>&1; echo "capsule_extract_rc=$?"
                      adb -s emulator-5554 shell settings put secure android_id "$CAP_ID" 2>&1; echo "settings_put_rc=$?"
                      POST_ID="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                      POST_MARKER="$(adb -s emulator-5554 shell cat "$RT4_MPATH" 2>/dev/null | tr -d '\r')"
                      echo "android_id_AFTER_apply=$POST_ID"
                      echo "marker_AFTER_apply (${RT4_MPATH})=$POST_MARKER (expected: $RT4_TOKEN)"
                      echo "-- SECOND reboot (plain guest reboot): the usability test - a code-applied identity counts only if it survives this --"
                      adb -s emulator-5554 reboot 2>&1; echo "reboot_rc=$?"
                      sleep 10

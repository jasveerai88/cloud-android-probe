            fi
            if [ "$RT2_SHAOK" = "1" ]; then echo "tar integrity: recomputed largest-userdata SHA-256 == certificate - YES"; else echo "tar integrity: recomputed largest-userdata SHA-256 == certificate - NO"; fi
            echo "-- WIPE the AVD folder completely (the phone now exists ONLY inside the tar) --"
            rm -rf "$AVDDIR" "$ANDROID_AVD_HOME/$AVD.ini"
            echo "-- hand-make a clean AVD folder (diagnosis attempt B shape) --"
            mkdir -p "$AVDDIR"
            printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/%s.avd\ntarget=android-34\n' "$AVDDIR" "$AVD" > "$ANDROID_AVD_HOME/$AVD.ini"
            echo "-- untar the pack into the clean folder --"
            tar -xf "$TAR" -C "$AVDDIR" 2>&1; echo "untar_rc=$?"
            ls -lh "$AVDDIR" 2>&1 | head -25
            if [ -d "$AVDDIR/snapshots" ]; then echo "-- restored snapshots tree --"; find "$AVDDIR/snapshots" -maxdepth 2 2>&1 | head -20; fi
            if pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "WARNING: qemu-system still alive before boot 2"; fi
            echo "-- boot 2 (extra flags: $*) --"
            rt2_boot "$EVID/rt2-boot2-console.log" "$@"
            RT2_ID2=""; RT2_RB=""
            if [ "$RT2_BOOTED" = "1" ]; then
              RT2_ID2="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
              RT2_RB="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
            fi
            echo "birth_android_id (certificate)=$RT2_CID"
            echo "restored_android_id=$RT2_ID2"
            echo "marker_expected (certificate)=$RT2_CMK"
            echo "marker_readback=$RT2_RB"
          }
          rt2_judge() {
            # $1 = verdict label (ROUNDTRIP2-N / ROUNDTRIP2-S). Appends
            # exactly one verdict line to $VERDICTS. RT2_EXTRA_FAIL may add
            # a failure component.
            local LBL="$1" FAIL=""
            if [ "$RT2_BOOTED" != "1" ]; then
              echo "$LBL: NOT EVALUATED - restore boot never reached sys.boot_completed=1 in the bounded wait"
              echo "$LBL: NOT EVALUATED - restore boot failed" >> "$VERDICTS"; return 0
            fi
            if [ "$RT2_ID2" != "$RT2_CID" ]; then FAIL="android_id mismatch (birth $RT2_CID, restored $RT2_ID2)"; fi
            if [ -n "$RT2_CMK" ] && [ "$RT2_RB" != "$RT2_CMK" ]; then
              if [ -n "$FAIL" ]; then FAIL="$FAIL; "; fi
              FAIL="${FAIL}marker mismatch (expected $RT2_CMK, got '${RT2_RB:-<missing/empty>}')"
            fi
            if [ "$RT2_SHAOK" != "1" ]; then
              if [ -n "$FAIL" ]; then FAIL="$FAIL; "; fi
              FAIL="${FAIL}tar integrity mismatch (recomputed SHA-256 != certificate)"
            fi
            if [ -n "$RT2_EXTRA_FAIL" ]; then
              if [ -n "$FAIL" ]; then FAIL="$FAIL; "; fi
              FAIL="${FAIL}$RT2_EXTRA_FAIL"
            fi
            if [ -z "$FAIL" ]; then
              echo "$LBL: SAME PHONE (birth $RT2_CID == restored $RT2_ID2, marker readback matched)"
              echo "$LBL: SAME PHONE" >> "$VERDICTS"
            else
              echo "$LBL: IDENTITY LOST - $FAIL"
              echo "$LBL: IDENTITY LOST - $FAIL" >> "$VERDICTS"
            fi
          }
          rt2_feature_state() {
            # $1 = verbose boot log. Prints the EncryptUserData lines
            # verbatim and sets RT2_FSTATE to the FINAL '= on/off'
            # assignment in file order (default parse first, overrides
            # applied after - last wins).
            echo "-- FeatureControl EncryptUserData lines from $1 (verbatim, unique) --"
            grep 'EncryptUserData' "$1" 2>/dev/null | sort -u | head -8
            RT2_FSTATE="$(grep 'EncryptUserData' "$1" 2>/dev/null | grep -oE '= (on|off)' | tail -1 | tr -d '= ')"
            if [ -z "$RT2_FSTATE" ]; then
              LASTLINE="$(grep 'EncryptUserData' "$1" 2>/dev/null | tail -1)"
              case "$LASTLINE" in *off*) RT2_FSTATE="off";; *on*) RT2_FSTATE="on";; esac
            fi
            echo "feature_state_final=${RT2_FSTATE:-<no EncryptUserData line in log>}"
          }
          # ---- attempt S ----
          SECS="$EVID/08b-roundtrip2-s.txt"; : > "$SECS"
          VERDICTS="$EVID/rt2-verdicts.txt"; [ -f "$VERDICTS" ] || : > "$VERDICTS"
          {
            echo "===== 8b roundtrip2 attempt S: snapshot capsule (save pv1, pack the WHOLE AVD incl. snapshots/, boot -snapshot pv1) ====="
            if [ "$MODE" = "roundtrip3" ] || [ "$MODE" = "roundtrip4" ] || [ "$MODE" = "roundtrip5" ]; then
              echo "mode=$MODE - attempt S (v3.6 form) not applicable: its v3.7 form is attempt S2 in section 08c; its v3.8 form is attempt S in sections 11/12, re-sequenced to run SECOND, after attempt C; roundtrip5 (v3.9) likewise runs its pair in sections 09-12"
            elif [ "$MODE" != "roundtrip2" ]; then
              echo "mode=$MODE - attempt S not applicable (roundtrip2 mode only)"
            elif [ "$AVD_OK" != "1" ]; then
              echo "ROUNDTRIP2-S: NOT RUN (AVD creation failed in step 2 - no AVD to birth)"
              echo "ROUNDTRIP2-S: NOT RUN (AVD creation failed in step 2)" >> "$VERDICTS"
            elif pgrep -f 'qemu-system' >/dev/null 2>&1; then
              echo "ROUNDTRIP2-S: NOT RUN (a qemu-system process from an earlier step/attempt is still alive - resetting the AVD under a live emulator would corrupt the test)"
              echo "ROUNDTRIP2-S: NOT RUN (qemu-system still alive at attempt start)" >> "$VERDICTS"
            else
              echo "-- reset the AVD to birth-clean: config set kept, every state file removed (attempt N's restored phone must not leak into attempt S) --"
              find "$AVDDIR" -mindepth 1 -maxdepth 1 ! -name 'config.ini' ! -name 'emulator-user.ini' ! -name 'hardware-qemu.ini' -exec rm -rf {} + 2>&1
              ls -la "$AVDDIR" 2>&1
              echo "-- birth boot (-wipe-data; snapshots ENABLED - deliberately NO -no-snapshot flag, or the save below cannot work) --"
              rt2_boot "$EVID/rt2-s-boot1.log" -wipe-data
              if [ "$RT2_BOOTED" != "1" ]; then
                echo "ROUNDTRIP2-S: NOT RUN (birth boot never reached sys.boot_completed=1 - runner problem, not evidence)"
                echo "ROUNDTRIP2-S: NOT RUN (birth boot failed)" >> "$VERDICTS"
              else
                RT2_ID1="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                echo "attempt_s_birth_android_id=$RT2_ID1"
                rt2_marker
                echo "-- save the capsule: adb emu avd snapshot save pv1 --"
                adb -s emulator-5554 emu avd snapshot save pv1 2>&1; echo "snapshot_save_rc=$?"
                sleep 3
                SNAP_OK=0
                if [ -d "$AVDDIR/snapshots/pv1" ] && [ -n "$(find "$AVDDIR/snapshots/pv1" -type f 2>/dev/null | head -1)" ]; then SNAP_OK=1; fi
                echo "-- snapshots tree after the save --"
                find "$AVDDIR/snapshots" -type f -exec ls -lh {} \; 2>&1 | head -25
                echo "snapshot_saved=$SNAP_OK"
                rt2_stop
                if [ "$SNAP_OK" != "1" ]; then
                  echo "ROUNDTRIP2-S: NOT RUN (snapshot save produced no snapshots/pv1 capsule on disk - the capsule route could not be created on this emulator build)"
                  echo "ROUNDTRIP2-S: NOT RUN (snapshot save failed - no snapshots/pv1 on disk)" >> "$VERDICTS"
                elif [ "$RT2_GRACEFUL" != "1" ]; then
                  echo "ROUNDTRIP2-S: NOT RUN (graceful stop unproven - pack refused under the v3.5 H5 guard)"
                  echo "ROUNDTRIP2-S: NOT RUN (graceful stop unproven)" >> "$VERDICTS"
                else
                  rt2_pack pv-s-state.tar 1 "route=roundtrip2-s" "snapshot_name=pv1" "snapshot_packed=1 - the ENTIRE AVD folder incl. snapshots/ was packed; the restore boot loads the capsule with -snapshot pv1"
                  if [ "$RT2_PACK_OK" != "1" ]; then
                    echo "ROUNDTRIP2-S: NOT RUN (pack failed - see pack lines above)"
                    echo "ROUNDTRIP2-S: NOT RUN (pack failed)" >> "$VERDICTS"
                  else
                    RT2_EXTRA_FAIL=""
                    rt2_restore "$PWD/pv-s-state.tar" -snapshot pv1 -verbose
                    echo "-- snapshot lines from the restore boot log (verbatim, first 12) --"
                    grep -i 'snapshot' "$EVID/rt2-boot2-console.log" 2>/dev/null | head -12
                    if ! grep -qi 'snapshot' "$EVID/rt2-boot2-console.log" 2>/dev/null; then echo "(no snapshot lines in the restore boot log)"; fi
                    rt2_judge "ROUNDTRIP2-S"
                    if [ "$RT2_BOOTED" = "1" ]; then rt2_stop; fi
                  fi
                fi
              fi
            fi
          } > "$SECS" 2>&1
          cat "$SECS"
          mkdir -p .pv-evidence-final
          cp "$SECS" .pv-evidence-final/ 2>/dev/null
          if [ -s "$VERDICTS" ]; then cp "$VERDICTS" "$EVID/identity-verdict.txt"; cp "$EVID/identity-verdict.txt" .pv-evidence-final/ 2>/dev/null; fi
          echo "-- roundtrip2 verdicts (both attempts) --"
          cat "$VERDICTS" 2>&1
          echo "attempt S evidence merged into .pv-evidence-final"

      - name: PhoneVault step 9 of 15 - roundtrip5 attempt C part 1 - capsule capture + pack (v3.9, roundtrip5 mode only)
        shell: bash
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"
          AVDDIR="$ANDROID_AVD_HOME/$AVD.avd"
          EMU_BIN="$ANDROID_HOME/emulator/emulator"
          MARKER_GUEST=/data/local/tmp/phonevault-marker.txt
          MARKER_NAME=phonevault-marker.txt
          # ---- rt4 helper family (per-step copies: steps are separate shells, only files persist) ----
          rt4_kill_hung() {
            # hung-emulator stop: graceful kill, hard kill if qemu survives 60s. Returns 0 when gone.
            adb -s emulator-5554 emu kill 2>&1; echo "kill_hung emu_kill_rc=$?"
            local i
            for i in $(seq 1 24); do
              if ! pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "emulator gone at poll $i"; RT4_PID=""; sync 2>/dev/null; return 0; fi
              if [ "$i" = "12" ]; then echo "still alive after 60s graceful - hard kill"; pkill -f 'qemu-system' 2>&1; if [ -n "$RT4_PID" ]; then kill "$RT4_PID" 2>/dev/null; fi; fi
              sleep 5
            done
            echo "KILL_HUNG_FAILED=1 - qemu-system still alive"; return 1
          }
          rt4_boot() {
            # $1 = boot log; rest = extra flags. ~15 min poll; timeout -> stop + retry ONCE. Sets RT4_BOOTED/PID.
            local LOG="$1"; shift
            RT4_BOOTED=""
            local TRY BC i
            for TRY in 1 2; do
              echo "-- boot attempt $TRY (extra flags: $*) --"
              nohup "$EMU_BIN" @"$AVD" -port 5554 -no-window -no-audio -no-boot-anim \
                -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 "$@" > "$LOG" 2>&1 &
              RT4_PID=$!
              echo "emulator_pid=$RT4_PID"
              timeout 90 adb -s emulator-5554 wait-for-device 2>&1; echo "wait_for_device_rc=$?"
              for i in $(seq 1 45); do
                BC="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
                echo "boot poll $i (attempt $TRY): sys.boot_completed='$BC'"
                if [ "$BC" = "1" ]; then RT4_BOOTED=1; break; fi
                sleep 20
              done
              if [ "$RT4_BOOTED" = "1" ]; then echo "boot_wait_result: sys.boot_completed=1 reached on attempt $TRY"; break; fi
              echo "boot_wait_result: attempt $TRY TIMEOUT after ~15 min"
              if [ "$TRY" = "1" ]; then echo "retrying the boot once (run 15 flake pattern) - stopping the hung emulator first"; rt4_kill_hung; fi
            done
          }
          rt4_stop() {
            # v3.5 graceful stop: emu kill, poll until qemu gone. NO hard kill, ever.
            RT4_GRACEFUL=0
            adb -s emulator-5554 emu kill 2>&1; echo "emu_kill_rc=$?"
            local i ALIVE
            for i in $(seq 1 24); do
              ALIVE=""
              if [ -n "$RT4_PID" ] && kill -0 "$RT4_PID" 2>/dev/null; then ALIVE="$ALIVE launcher_pid=$RT4_PID"; fi
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then ALIVE="$ALIVE qemu-system present"; fi
              if [ -z "$ALIVE" ]; then RT4_GRACEFUL=1; echo "graceful stop confirmed at poll $i"; break; fi
              echo "shutdown poll $i: still alive:$ALIVE"; sleep 5
            done
            if [ "$RT4_GRACEFUL" != "1" ]; then echo "GRACEFUL_STOP=0 - launcher/qemu still alive after 120s"; fi
            sync 2>/dev/null; echo "host sync done"
          }
          rt4_root() {
            # adbd as root (userdebug image); bounded poll for uid=0.
            if [ "$RT4_ROOTED" = "1" ]; then echo "already rooted"; return 0; fi
            RT4_ROOTED=0
            adb -s emulator-5554 root 2>&1; echo "adb_root_rc=$?"
            sleep 3
            local i IDOUT
            for i in $(seq 1 8); do
              IDOUT="$(adb -s emulator-5554 shell id 2>/dev/null | tr -d '\r')"
              echo "root poll $i: id='$IDOUT'"
              case "$IDOUT" in *uid=0*) RT4_ROOTED=1; break;; esac
              sleep 5
            done
            echo "rooted=$RT4_ROOTED"
          }
          rt4_marker() {
            # v3.8 marker: root write to /data/local/tmp, readback-verified; /sdcard bounded fallback. Sets RT4_TOKEN/MOK/MPATH.
            RT4_TOKEN="pv1-$(date -u +%Y%m%d%H%M%S)-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            RT4_MOK=0; RT4_MPATH=""
            printf '%s\n' "$RT4_TOKEN" > rt4-marker-local.txt
            echo "marker_token: $RT4_TOKEN"
            rt4_root
            if [ "$RT4_ROOTED" = "1" ]; then
              adb -s emulator-5554 push rt4-marker-local.txt "$MARKER_GUEST" 2>&1
              RB="$(adb -s emulator-5554 shell cat "$MARKER_GUEST" 2>/dev/null | tr -d '\r')"
              echo "marker_readback: $RB"
              if [ "$RB" = "$RT4_TOKEN" ]; then RT4_MOK=1; RT4_MPATH="$MARKER_GUEST"; echo "MARKER_OK=1 - root write to /data/local/tmp, verified by readback"; fi
            fi
            if [ "$RT4_MOK" != "1" ]; then
              echo "-- marker fallback: /sdcard, bounded retries --"
              local i SDRB
              for i in $(seq 1 12); do
                echo "sdcard status poll $i: '$(adb -s emulator-5554 shell cmd sdcard status 2>/dev/null | tr -d '\r')'"
                adb -s emulator-5554 push rt4-marker-local.txt /sdcard/phonevault-marker-boot1.txt 2>&1
                SDRB="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
                if [ "$SDRB" = "$RT4_TOKEN" ]; then RT4_MOK=1; RT4_MPATH=/sdcard/phonevault-marker-boot1.txt; echo "MARKER_OK=1 - /sdcard fallback verified at poll $i"; break; fi
                sleep 10
              done
              echo "marker_fallback_readback: $SDRB"
            fi
            if [ "$RT4_MOK" != "1" ]; then echo "MARKER_FAILED - neither path reproduced the token at birth"; fi
          }
          rt4_pack_c() {
            # attempt C pack (no snapshots). $1 = tar name; $2.. = extra cert
            RT4_PACK_OK=0; RT4_TAR="$1"; shift
            df -h . | tail -1
            echo "-- AVD folder listing BEFORE pack --"; ls -lh "$AVDDIR" 2>&1
            UD_PRESENT=""
            local uf f
            for uf in userdata-qemu.img.qcow2 userdata-qemu.img userdata.img; do
              if [ -f "$AVDDIR/$uf" ]; then UD_PRESENT="$UD_PRESENT $uf"; fi
            done
            if [ -z "$UD_PRESENT" ]; then echo "PACK_SKIPPED=1 - no userdata candidate in the AVD folder"; return 0; fi
            EMU_PKG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            SYSIMG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            if [ "$RT4_MOK" = "1" ]; then MT="$RT4_TOKEN"; else MT=""; fi
            LIST="$UD_PRESENT"
            for f in encryptionkey.img.qcow2 encryptionkey.img sdcard.img config.ini emulator-user.ini hardware-qemu.ini; do
              if [ -f "$AVDDIR/$f" ]; then LIST="$LIST $f"; fi
            done
            {
              echo "avd_name=$AVD"; echo "system_image=$SYSIMG"
              echo "emulator_pkg_revision=$EMU_PKG_REV"; echo "system_image_revision=$SYSIMG_REV"
              echo "session=1"; echo "packed_utc=$(date -u +%FT%TZ)"
              echo "android_id=$RT4_ID1"; echo "marker_token=$MT"; echo "marker_ok=$RT4_MOK"; echo "marker_guest_path=$RT4_MPATH"
              for line in "$@"; do echo "$line"; done
              for f in $LIST; do printf 'packed_file: %s %s bytes\n' "$f" "$(stat -c %s "$AVDDIR/$f")"; done
              echo "packed_file: phonevault-version.txt (this file)"
            } > "$AVDDIR/phonevault-version.txt"
            echo "-- phonevault-version.txt (in pack) --"; cat "$AVDDIR/phonevault-version.txt"
            LIST="$LIST phonevault-version.txt"
            rm -f "$RT4_TAR"
            tar -cf "$RT4_TAR" -C "$AVDDIR" $LIST 2>"$EVID/rt4-tar-err.txt"; TARRC=$?
            cat "$EVID/rt4-tar-err.txt" 2>&1; echo "tar_rc=$TARRC"
            ls -lh "$RT4_TAR" 2>&1
            if [ "$TARRC" = "0" ] && [ -s "$RT4_TAR" ]; then RT4_PACK_OK=1; echo "PACK_OK=1 - local tar $RT4_TAR complete (tar_rc=0; never uploaded)"; else echo "PACK_FAILED=1 - tar_rc=$TARRC; the pack is NOT trusted and the AVD will NOT be wiped under it"; fi
          }
          # ---- attempt C part 1 (runs FIRST in roundtrip5) ----
          rt5_disk_guard() {
            # v3.9 disk guard ($1 = label): rc=1 when free < 2 GB.
            local FREEKB
            FREEKB="$(df -Pk . 2>/dev/null | awk 'NR==2 {print $4}')"
            echo "disk guard ($1): free_kb=${FREEKB:-unknown} floor_kb=2097152"
            df -h . 2>&1 | tail -1
            if [ -n "$FREEKB" ] && [ "$FREEKB" -lt 2097152 ]; then echo "DISK_GUARD=TRIPPED ($1)"; return 1; fi
            echo "DISK_GUARD=OK ($1)"
          }
          SECC="$EVID/09-roundtrip5-c.txt"; : > "$SECC"
          VERDICTS="$EVID/rt4-verdicts.txt"; : > "$VERDICTS"
          CSTATE="$EVID/rt4-c-state.txt"
          # v3.9: a guard trip seals NOT EVALUATED (disk) + skips the
          # body (deduped: one ROUNDTRIP5-C line per attempt).
          PV_SKIP_C1=""
          rt5_disk_guard "attempt C part 1 start" > "$EVID/00d-disk-c1.txt" 2>&1 || PV_SKIP_C1=1
          cat "$EVID/00d-disk-c1.txt"
          if [ "$PV_SKIP_C1" = "1" ]; then grep -q '^ROUNDTRIP5-C:' "$VERDICTS" 2>/dev/null || echo "ROUNDTRIP5-C: NOT EVALUATED (disk - free < 2 GB at the attempt C part 1 boundary; harness fault, not evidence)" >> "$VERDICTS"; fi
          {
            echo "===== 9 roundtrip5 attempt C (part 1): identity-as-code, FIRST ====="
            if [ "$MODE" != "roundtrip5" ] || [ "$PV_SKIP_C1" = "1" ]; then
              if [ "$PV_SKIP_C1" = "1" ]; then echo "attempt C part 1 SKIPPED - ROUNDTRIP5-C NOT EVALUATED (disk) sealed by the v3.9 guard above"; else echo "mode=$MODE - attempt C part 1 not applicable (roundtrip5 mode only)"; fi
            elif [ "$AVD_OK" != "1" ]; then
              echo "ROUNDTRIP5-C: NOT RUN (AVD creation failed in step 2 - no AVD to birth)"
              echo "ROUNDTRIP5-C: NOT RUN (AVD creation failed in step 2)" >> "$VERDICTS"
            else
              echo "-- process gate: C runs FIRST; a leftover qemu-system is cleared and verified gone first --"
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "leftover qemu-system at C start: $(pgrep -af 'qemu-system' 2>/dev/null)"; rt4_kill_hung; fi
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then
                echo "ROUNDTRIP5-C: NOT RUN (leftover qemu-system unclearable at attempt start)"
                echo "ROUNDTRIP5-C: NOT RUN (leftover qemu-system could not be cleared at attempt start)" >> "$VERDICTS"
              else
                echo "process gate clean - attempt C proceeds"
                echo "-- reset the AVD to birth-clean: config set kept, every state file removed --"
                find "$AVDDIR" -mindepth 1 -maxdepth 1 ! -name 'config.ini' ! -name 'emulator-user.ini' ! -name 'hardware-qemu.ini' -exec rm -rf {} + 2>&1
                echo "-- birth boot (NORMAL encrypted phone, -wipe-data -no-snapshot; the disk restore is EXPECTED to lose identity - the identity-as-code premise) --"
                rt4_boot "$EVID/rt4-c-boot1.log" -wipe-data -no-snapshot
                if [ "$RT4_BOOTED" != "1" ]; then
                  echo "ROUNDTRIP5-C: NOT RUN (birth boot failed on both attempts - runner problem, not evidence)"
                  echo "ROUNDTRIP5-C: NOT RUN (birth boot failed on both attempts)" >> "$VERDICTS"
                else
                  RT4_ID1="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                  echo "attempt_c_birth_android_id=$RT4_ID1"
                  rt4_marker
                  if [ "$RT4_MOK" != "1" ]; then
                    echo "ROUNDTRIP5-C: NOT EVALUATED (marker not written+verified at birth - v3.8 validity gate: such a birth proves nothing)"
                    echo "ROUNDTRIP5-C: NOT EVALUATED - marker write/verify failed at birth" >> "$VERDICTS"
                    rt4_stop
                  else
                    rt4_root
                    if [ "$RT4_ROOTED" != "1" ]; then
                      echo "ROUNDTRIP5-C: NOT RUN (adb root gave no uid=0 shell - capsule cannot be captured/applied on this image)"
                      echo "ROUNDTRIP5-C: NOT RUN (adb root failed at birth)" >> "$VERDICTS"
                      rt4_stop
                    else
                      echo "-- capture the identity capsule --"
                      echo "capsule design (minimal): (a) the android_id VALUE; (b) the marker FILE at $MARKER_GUEST; (c) settings_secure.xml in a guest-side tar - the store carrying android_id on Android 14. Excluded: app dirs (none), settings_global/system, /data/misc. The capsule lives HOST-side: the guest disk cannot be trusted to survive."
                      CAPDIR="pv-capsule-c"; rm -rf "$CAPDIR"; mkdir -p "$CAPDIR"
                      CAP_ID="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                      echo "capsule_android_id=$CAP_ID"
                      CAP_FILES="data/system/users/0/settings_secure.xml ${MARKER_GUEST#/}"
                      adb -s emulator-5554 shell "tar -cf /data/local/tmp/pv-capsule.tar -C / $CAP_FILES" 2>&1; echo "capsule_tar_rc=$?"
                      adb -s emulator-5554 pull /data/local/tmp/pv-capsule.tar "$CAPDIR/pv-capsule.tar" 2>&1
                      echo "-- capsule tar contents --"
                      CAPLIST="$(tar -tf "$CAPDIR/pv-capsule.tar" 2>&1)"; echo "$CAPLIST"
                      CAPSHA=""; CAP_OK=0
                      if [ -s "$CAPDIR/pv-capsule.tar" ] && echo "$CAPLIST" | grep -q 'settings_secure.xml' && echo "$CAPLIST" | grep -q "$MARKER_NAME"; then CAP_OK=1; CAPSHA="$(sha256sum "$CAPDIR/pv-capsule.tar" | awk '{print $1}')"; fi
                      echo "capsule_ok=$CAP_OK capsule_sha256=$CAPSHA"
                      CAP_MD5_BIRTH="$(adb -s emulator-5554 shell md5sum /data/system/users/0/settings_secure.xml 2>/dev/null | awk '{print $1}' | tr -d '\r')"
                      echo "settings_secure.xml md5 at birth=$CAP_MD5_BIRTH"

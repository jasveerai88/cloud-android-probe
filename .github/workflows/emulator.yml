            done
            if [ -z "$UD_PRESENT" ]; then echo "PACK_SKIPPED=1 - no userdata candidate in the AVD folder"; return 0; fi
            EMU_PKG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            SYSIMG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            EMUVER="$("$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -1 | tr -d '\r')"
            if [ -z "$EMUVER" ]; then EMUVER="pkgrev:$EMU_PKG_REV"; fi
            local LARGEST="" LARGEST_SIZE=0 SHA
            for uf in $UD_PRESENT; do
              SZ="$(stat -c %s "$AVDDIR/$uf" 2>/dev/null)"; case "$SZ" in ''|*[!0-9]*) SZ=0;; esac
              if [ "$SZ" -gt "$LARGEST_SIZE" ]; then LARGEST_SIZE=$SZ; LARGEST=$uf; fi
            done
            SHA="$(sha256sum "$AVDDIR/$LARGEST" | awk '{print $1}')"
            local LIST="$UD_PRESENT"
            for f in encryptionkey.img.qcow2 encryptionkey.img sdcard.img config.ini emulator-user.ini hardware-qemu.ini pv-capsule.tar capsule-manifest.txt; do
              if [ -f "$AVDDIR/$f" ]; then LIST="$LIST $f"; fi
            done
            {
              echo "avd_name=$AVD"; echo "system_image=$SYSIMG"
              echo "emulator_version=$EMUVER"; echo "emulator_pkg_revision=$EMU_PKG_REV"; echo "system_image_revision=$SYSIMG_REV"
              echo "production=1"; echo "session=$PV40_SESSION"
              echo "born_utc=$PV40_BORN"; echo "packed_utc=$(date -u +%FT%TZ)"
              echo "android_id=$PV40_ID"; echo "marker_token=$PV40_TOKEN"; echo "marker_ok=$PV40_MOK"; echo "marker_guest_path=$PV40_MPATH"
              echo "phone=${PV_PHONE_ID:-one}"; echo "route=$PV40_ROUTE"; echo "identity_capsule=android_id + marker + settings_secure.xml tar (adb root capture; re-applied pre-read on wakes)"
              echo "capsule_sha256=$PV40_CAPSHA"; echo "settings_secure_md5_birth=$PV40_MD5"
              echo "largest_userdata_file=$LARGEST"; echo "largest_userdata_size_bytes=$LARGEST_SIZE"; echo "largest_userdata_sha256=$SHA"
              for f in $LIST; do printf 'packed_file: %s %s bytes\n' "$f" "$(stat -c %s "$AVDDIR/$f")"; done
              echo "packed_file: phonevault-version.txt (this file)"
            } > "$AVDDIR/phonevault-version.txt"
            echo "-- phonevault-version.txt (in pack) --"; cat "$AVDDIR/phonevault-version.txt"
            LIST="$LIST phonevault-version.txt"
            echo "pack set:$LIST"
            echo "excluded by construction (never in the candidate list): cache.img, cache.img.qcow2, snapshots/, *.lock"
            rm -f "$PV40_TAR"
            tar -cf "$PV40_TAR" -C "$AVDDIR" $LIST 2>pv40-tar-err.txt; local TARRC=$?
            cat pv40-tar-err.txt 2>&1; echo "tar_rc=$TARRC"
            ls -lh "$PV40_TAR" 2>&1
            if [ "$TARRC" != "0" ] || [ ! -s "$PV40_TAR" ]; then echo "PACK_FAILED=1 - tar_rc=$TARRC; the pack is NOT trusted and is NOT flagged for upload"; return 0; fi
            local SEAL_SHA
            SEAL_SHA="$(tar -xOf "$PV40_TAR" "$LARGEST" 2>/dev/null | sha256sum | awk '{print $1}')"
            echo "seal check: sha256($LARGEST) recomputed FROM the finished tar=$SEAL_SHA vs certificate=$SHA"
            if [ "$SEAL_SHA" != "$SHA" ]; then echo "PACK_FAILED=1 - from-tar seal != certificate hash; the pack is NOT trusted"; return 0; fi
            PV40_PACK_SHA="$(sha256sum "$PV40_TAR" | awk '{print $1}')"
            PV40_PACK_OK=1
            echo "PACK_OK=1 - production pack $PV40_TAR complete (tar_rc=0, seal verified from the tar)"
            echo "pack_sha256=$PV40_PACK_SHA"
            printf 'PACK_OK=1\n' > "$EVID/pack-state.txt"
            mkdir -p .pv-evidence-final; cp "$EVID/pack-state.txt" .pv-evidence-final/ 2>/dev/null
            touch .pv-pack-ok
          }
          # ---- production WAKE part 2 (v4.0): second reboot, verdict, re-pack ----
          SECW2="$EVID/07c-wake2.txt"; : > "$SECW2"
          WVERD="$EVID/prod-wake-verdict.txt"; [ -f "$WVERD" ] || : > "$WVERD"
          WSTATE="$EVID/pv40-wake-state.txt"
          PV_SKIP_W2=""
          rt5_disk_guard "production wake part 2 start" > "$EVID/00j-disk-wake2.txt" 2>&1 || PV_SKIP_W2=1
          cat "$EVID/00j-disk-wake2.txt"
          if [ "$PV_SKIP_W2" = "1" ] && [ "$MODE" = "wake" ]; then grep -q '^WAKE:' "$WVERD" 2>/dev/null || echo "WAKE: NOT EVALUATED (disk - free < 2 GB at the wake part 2 boundary; harness fault, not evidence)" >> "$WVERD"; fi
          {
            echo "===== 7c production WAKE part 2 (v4.3): app side-load, second reboot, identity verdict, state re-pack ====="
            if [ "$MODE" != "wake" ] || [ "$PV_SKIP_W2" = "1" ]; then
              if [ "$PV_SKIP_W2" = "1" ]; then echo "wake part 2 SKIPPED - WAKE NOT EVALUATED (disk) sealed by the v3.9 guard above"; else echo "mode=$MODE - production wake part 2 not applicable (wake mode only)"; fi
            elif [ ! -f "$WSTATE" ] || ! grep -q 'WAKE_STATE=PENDING' "$WSTATE" 2>/dev/null; then
              echo "wake already concluded in part 1 (section 07b) or never started - no second verdict line is written here"
            else
              CID="$(sed -n 's/^CID=//p' "$WSTATE" | tr -d '\r' | head -1)"
              CTOKEN="$(sed -n 's/^CTOKEN=//p' "$WSTATE" | tr -d '\r' | head -1)"
              CMPATH="$(sed -n 's/^CMPATH=//p' "$WSTATE" | tr -d '\r' | head -1)"
              CCAPSHA="$(sed -n 's/^CCAPSHA=//p' "$WSTATE" | tr -d '\r' | head -1)"
              CMD5="$(sed -n 's/^CMD5=//p' "$WSTATE" | tr -d '\r' | head -1)"
              CBORN="$(sed -n 's/^CBORN=//p' "$WSTATE" | tr -d '\r' | head -1)"
              CSES="$(sed -n 's/^CSES=//p' "$WSTATE" | tr -d '\r' | head -1)"
              PRE_ID="$(sed -n 's/^PRE_ID=//p' "$WSTATE" | tr -d '\r' | head -1)"
              POST_ID="$(sed -n 's/^POST_ID=//p' "$WSTATE" | tr -d '\r' | head -1)"
              POST_MARKER="$(sed -n 's/^POST_MARKER=//p' "$WSTATE" | tr -d '\r' | head -1)"
              case "$CSES" in ''|*[!0-9]*) CSES=1;; esac
              if [ -z "$CMPATH" ]; then CMPATH="$MARKER_GUEST"; fi
              echo "wake handoff read: android_id=$CID marker_token=$CTOKEN marker_guest_path=$CMPATH capsule_sha256=$CCAPSHA session=$CSES born_utc=$CBORN control_pre_apply_id=$PRE_ID post_apply_id=$POST_ID"
              echo "-- APP side-load (v4.3): hash-pinned set from the repo apps manifest, installed BEFORE the survival reboot; install-every-wake by design (V43-NOTES persistence verdict); app outcomes never touch the identity verdict --"
              APPSTAT="$EVID/prod-app-status.txt"; : > "$APPSTAT"
              PV_APPS="${{ inputs.install_apps }}"
              APPS_DIR=""; APP_FIRST_PKG=""; APP_INSTALLED_LIST=""
              for cand in phonevault/apps apps; do if [ -f "$cand/apps.txt" ]; then APPS_DIR="$cand"; break; fi; done
              if [ "$PV_APPS" = "no" ]; then
                echo "APP: SKIPPED - install_apps=no at dispatch" | tee -a "$APPSTAT"
              elif [ -z "$APPS_DIR" ]; then
                echo "APP: SKIPPED - no apps.txt manifest in this checkout (looked in phonevault/apps and apps) - the apps folder must be deployed into the repo with the workflow file" | tee -a "$APPSTAT"
                adb -s emulator-5554 exec-out screencap -p > .pv-screencap.png 2>/dev/null; ls -l .pv-screencap.png 2>&1
              else
                echo "apps manifest in use: $APPS_DIR/apps.txt"
                PKGS0="$(adb -s emulator-5554 shell pm list packages 2>/dev/null | tr -d '\r')" || true
                while IFS= read -r MLINE; do
                  MLINE="$(printf '%s' "$MLINE" | sed 's/^[[:space:]]*//')"
                  case "$MLINE" in ''|'#'*) continue;; esac
                  set -- $MLINE; MF="$1"; MSHA="$2"; MPKG="$3"
                  case "$MF" in */*) echo "APP: MANIFEST REJECTED - '$MF' is not a bare filename" | tee -a "$APPSTAT"; continue;; esac
                  if [ -z "$MSHA" ] || [ -z "$MPKG" ]; then echo "APP: MANIFEST REJECTED - line lacks the sha256 or package field: $MLINE" | tee -a "$APPSTAT"; continue; fi
                  if grep -qx "package:$MPKG" <<< "$PKGS0"; then echo "APP: PREEXISTING $MPKG - present BEFORE this wake's install phase (cross-run persistence evidence; the install is still re-applied)" | tee -a "$APPSTAT"; else echo "APP: ABSENT-BEFORE-INSTALL $MPKG - not present at the start of this wake" | tee -a "$APPSTAT"; fi
                  APK="$APPS_DIR/$MF"
                  if [ ! -s "$APK" ]; then echo "APP: FAILED $MPKG ($MF) - file missing or empty in checkout" | tee -a "$APPSTAT"; continue; fi
                  GOTSHA="$(sha256sum "$APK" | awk '{print $1}')"
                  if [ "$GOTSHA" != "$MSHA" ]; then echo "APP: HASH MISMATCH $MPKG ($MF) - manifest sha256=$MSHA vs file sha256=$GOTSHA - NOT installed" | tee -a "$APPSTAT"; continue; fi
                  echo "hash verified for $MF: sha256=$GOTSHA matches the manifest"
                  timeout 300 adb -s emulator-5554 install -r "$APK" 2>&1; echo "adb_install_rc=$? ($MF)"
                  PKGSI="$(adb -s emulator-5554 shell pm list packages 2>/dev/null | tr -d '\r')" || true
                  if grep -qx "package:$MPKG" <<< "$PKGSI"; then
                    echo "APP: INSTALLED $MPKG ($MF sha256=$GOTSHA)" | tee -a "$APPSTAT"
                    APP_INSTALLED_LIST="$APP_INSTALLED_LIST $MPKG"
                    if [ -z "$APP_FIRST_PKG" ]; then APP_FIRST_PKG="$MPKG"; fi
                  else
                    echo "APP: FAILED $MPKG ($MF) - adb install ran but the package is not present" | tee -a "$APPSTAT"
                  fi
                done < "$APPS_DIR/apps.txt"
                if [ -n "$APP_FIRST_PKG" ]; then
                  adb -s emulator-5554 shell monkey -p "$APP_FIRST_PKG" -c android.intent.category.LAUNCHER 1 2>&1 | tail -1
                  sleep 8
                fi
                adb -s emulator-5554 exec-out screencap -p > .pv-screencap.png 2>/dev/null; ls -l .pv-screencap.png 2>&1
              fi
              echo "-- SECOND reboot (plain guest reboot): the run No.19 standard - a wake counts only if the applied identity survives it --"
              adb -s emulator-5554 reboot 2>&1; echo "reboot_rc=$?"
              sleep 10
              rt4_reboot_wait
              if [ "$RT4_BOOTED" != "1" ]; then
                echo "WAKE: NOT EVALUATED - the second reboot never reached sys.boot_completed=1 in ~15 min (the part 1 apply readings stand; survival unproven)"
                echo "WAKE: NOT EVALUATED - second reboot failed" >> "$WVERD"
                rt4_stop
              else
                FINAL_ID="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                FINAL_MARKER="$(adb -s emulator-5554 shell cat "$CMPATH" 2>/dev/null | tr -d '\r')"
                echo "android_id_AFTER_reboot2=$FINAL_ID"
                echo "marker_AFTER_reboot2 (${CMPATH})=$FINAL_MARKER"
                if [ -n "$APP_INSTALLED_LIST" ]; then
                  PKGS2="$(adb -s emulator-5554 shell pm list packages 2>/dev/null | tr -d '\r')" || true
                  for SPKG in $APP_INSTALLED_LIST; do
                    if grep -qx "package:$SPKG" <<< "$PKGS2"; then
                      echo "APP: SURVIVED reboot 2 - $SPKG still installed after the survival reboot" | tee -a "$APPSTAT"
                    else
                      echo "APP: LOST at reboot 2 - $SPKG missing after the survival reboot (the install had succeeded)" | tee -a "$APPSTAT"
                    fi
                  done
                fi
                W_FAIL=""
                if [ "$POST_ID" != "$CID" ]; then W_FAIL="settings put did not take (post-apply android_id $POST_ID != certificate $CID)"; fi
                if [ "$POST_MARKER" != "$CTOKEN" ]; then if [ -n "$W_FAIL" ]; then W_FAIL="$W_FAIL; "; fi; W_FAIL="${W_FAIL}marker not restored by the capsule tar (post-apply readback '${POST_MARKER:-<missing/empty>}')"; fi
                if [ "$FINAL_ID" != "$CID" ]; then if [ -n "$W_FAIL" ]; then W_FAIL="$W_FAIL; "; fi; W_FAIL="${W_FAIL}applied android_id did NOT survive the extra reboot (after reboot2: $FINAL_ID)"; fi
                if [ "$FINAL_MARKER" != "$CTOKEN" ]; then if [ -n "$W_FAIL" ]; then W_FAIL="$W_FAIL; "; fi; W_FAIL="${W_FAIL}marker did not survive the extra reboot (after reboot2: '${FINAL_MARKER:-<missing/empty>}')"; fi
                rt4_stop
                if [ -n "$W_FAIL" ]; then
                  echo "WAKE: FAILED - $W_FAIL (certificate $CID, control-pre-apply $PRE_ID, post-apply $POST_ID, after-reboot2 $FINAL_ID; NO re-pack - the pinned pack stays the newest good state)"
                  echo "WAKE: FAILED - $W_FAIL" >> "$WVERD"
                elif [ "$RT4_GRACEFUL" != "1" ]; then
                  echo "WAKE: SAME PHONE (identity proven: capsule android_id $CID re-applied by root - the wake boot had woken as $PRE_ID - and SURVIVED the extra reboot; marker matched after apply and after reboot 2) BUT RE-PACK REFUSED - graceful stop unproven (H5 guard); the shelf was NOT advanced"
                  echo "WAKE: SAME PHONE - identity restored + survived reboot 2; re-pack refused (graceful stop unproven), shelf not advanced" >> "$WVERD"
                else
                  PV40_ID="$CID"; PV40_TOKEN="$CTOKEN"; PV40_MOK=1; PV40_MPATH="$CMPATH"
                  PV40_CAPSHA="$CCAPSHA"; PV40_MD5="$CMD5"; PV40_SESSION=$((CSES + 1)); PV40_BORN="$CBORN"; PV40_ROUTE="wake-v4.0"
                  pv40_pack phonevault-state.tar
                  if [ "$PV40_PACK_OK" != "1" ]; then
                    echo "WAKE: SAME PHONE (identity proven as above) BUT RE-PACK FAILED (pack tar/seal failed); the shelf was NOT advanced - the pinned pack remains the newest good state"
                    echo "WAKE: SAME PHONE - identity restored + survived reboot 2; re-pack FAILED, shelf not advanced" >> "$WVERD"
                  else
                    echo "WAKE: SAME PHONE - capsule android_id $CID re-applied by root after the disk restore (the wake boot had woken as $PRE_ID) and SURVIVED the extra reboot; marker restored from $CMPATH and survived; state RE-PACKED as session $PV40_SESSION with the same capsule and uploaded as the new $PV_ART_NAME (pack_sha256=$PV40_PACK_SHA) - the NEXT wake pins THIS run"
                    echo "WAKE: SAME PHONE - applied android_id survived the extra reboot; session advanced to $PV40_SESSION" >> "$WVERD"
                  fi
                fi
              fi
            fi
          } > "$SECW2" 2>&1
          cat "$SECW2"
          mkdir -p .pv-evidence-final
          cp "$SECW2" .pv-evidence-final/ 2>/dev/null
          cp "$EVID/00j-disk-wake2.txt" .pv-evidence-final/ 2>/dev/null
          if [ "$MODE" = "wake" ] && [ -s "$EVID/prod-app-status.txt" ]; then cat "$EVID/prod-app-status.txt" >> "$WVERD"; cp .pv-screencap.png .pv-evidence-final/ 2>/dev/null; fi
          if [ "$MODE" = "wake" ] && [ -s "$WVERD" ]; then cp "$WVERD" "$EVID/identity-verdict.txt"; cp "$EVID/identity-verdict.txt" .pv-evidence-final/ 2>/dev/null; fi
          echo "-- production wake verdict --"
          cat "$WVERD" 2>&1
          echo "production wake part 2 evidence merged into .pv-evidence-final"

      - name: Upload boot screencap (artifact only, never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshot
          path: .pv-screencap.png
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Determine pack state (flag for the conditioned state upload)
        id: packflag
        if: always()
        shell: bash
        run: |
          if [ -f .pv-pack-ok ] && [ -f phonevault-state.tar ]; then
            echo "pack_ok=true" >> "$GITHUB_OUTPUT"
            echo "verified pack present (.pv-pack-ok + phonevault-state.tar): the state upload step runs and must find the tar (if-no-files-found: error)"
          else
            echo "pack_ok=false" >> "$GITHUB_OUTPUT"
            echo "no verified pack this run: the state upload step is skipped - nothing-to-upload is a legitimate outcome (not booted / pack skipped), not an error"
          fi

      - name: Upload PhoneVault AVD state (artifact transport only, never committed)
        if: steps.packflag.outputs.pack_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PV_ART_NAME }}
          path: phonevault-state.tar
          if-no-files-found: error
          retention-days: 30

      - name: Upload PhoneVault evidence (v3.9 output survival - small files only, never the state tar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonevault-evidence
          path: .pv-evidence-final
          if-no-files-found: ignore
          retention-days: 7

      - name: Write verdict + commit output back
        if: always()
        shell: bash
        run: |
          set +e
          OUT="${PV_OUT_FILE:-emulator-output.txt}"
          EVID=.pv-evidence-final
          MODE="$(cat .pv-mode.txt 2>/dev/null | tr -d '\r\n')"
          if [ -z "$MODE" ]; then MODE="fresh"; fi
          IVERD=""
          if [ -f "$EVID/identity-verdict.txt" ]; then IVERD="$(cat "$EVID/identity-verdict.txt")"; fi
          # v3.9 OUTPUT SURVIVAL: both verdict lines go to the GitHub step
          # summary NOW - readable on the run page even if the output
          # assembly/commit below fails (run No.17 died exactly there).
          if [ -n "$IVERD" ]; then
            {
              echo "## PhoneVault verdicts (mode: $MODE)"
              echo ""
              echo '```'
              echo "$IVERD"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "verdict lines written to the GitHub step summary"
          fi
          BOOTED=0; CAPOK=0
          [ -f "$EVID/03-boot.txt" ] && BOOTED="$(grep -c 'BOOTED_FLAG=1' "$EVID/03-boot.txt")"
          [ -f "$EVID/04-capture.txt" ] && CAPOK="$(grep -c 'CAPTURE_OK=1' "$EVID/04-capture.txt")"
          # v3.4 HONEST VERDICT: PACKED and MARKER below are derived from the
          # flags the run actually set (pack-state.txt from section 6,
          # marker-state.txt from section 4, the restore identity verdict) -
          # never asserted by template. Run No.3's verdict line claimed
          # "state packed" while its own section 6 said PACK_SKIPPED=1; that
          # class of lie is what this derivation removes.
          PACKOK=0
          if [ -f "$EVID/pack-state.txt" ] && grep -q 'PACK_OK=1' "$EVID/pack-state.txt"; then PACKOK=1; fi
          if [ "$PACKOK" = "1" ]; then PACKTXT="PACKED=1 (state packed as artifact phonevault-avd-state, section 6)"; else PACKTXT="PACKED=0 (state NOT packed - see section 6)"; fi
          if [ "$PACKOK" = "1" ] && { [ "$MODE" = "birth" ] || [ "$MODE" = "wake" ]; }; then PACKTXT="PACKED=1 (production pack uploaded as artifact phonevault-avd-state, sections 07a/07b/07c)"; fi
          MARKER_STATE="unknown"
          if [ "$MODE" = "restore" ] || [ "$MODE" = "roundtrip" ] || [ "$MODE" = "roundtrip2" ] || [ "$MODE" = "roundtrip3" ] || [ "$MODE" = "roundtrip4" ] || [ "$MODE" = "roundtrip5" ] || [ "$MODE" = "birth" ] || [ "$MODE" = "wake" ]; then
            case "$IVERD" in
              *"SAME PHONE"*) MARKER_STATE="see identity verdict above" ;;
              *"PHONE BORN"*) MARKER_STATE="OK (birth: marker verified at birth and sealed in the certificate)" ;;
              *"marker mismatch"*) MARKER_STATE="FAILED" ;;
              *"NOT EVALUATED"*) MARKER_STATE="not evaluated (phone did not boot)" ;;
              *) if grep -q 'NOT EVALUATED' "$EVID/04-capture.txt" 2>/dev/null; then MARKER_STATE="not evaluated (restored pack carried no verified marker)"; fi ;;
            esac
          elif [ -f "$EVID/marker-state.txt" ]; then
            if grep -q 'MARKER_OK=1' "$EVID/marker-state.txt"; then MARKER_STATE="OK"; else MARKER_STATE="FAILED"; fi
          fi
          MARKERTXT="marker: $MARKER_STATE"
          if [ "$MARKER_STATE" = "FAILED" ]; then MARKERTXT="MARKER_FAILED (marker: FAILED - see section 4)"; fi
          {
            if { [ "$MODE" = "restore" ] || [ "$MODE" = "roundtrip" ] || [ "$MODE" = "roundtrip2" ] || [ "$MODE" = "roundtrip3" ] || [ "$MODE" = "roundtrip4" ] || [ "$MODE" = "roundtrip5" ] || [ "$MODE" = "birth" ] || [ "$MODE" = "wake" ]; } && [ -n "$IVERD" ]; then
              echo "$IVERD"
            fi
            if [ "$MODE" = "roundtrip2" ] && [ -n "$IVERD" ]; then
              echo "EMULATOR BOOT: BOOTED - roundtrip2 job (attempt N no-lock birth: section 08a; attempt S snapshot capsule: section 08b); the two ROUNDTRIP2 verdicts above are this job's permanence proofs and no artifact shelf was used; each attempt packed to a LOCAL tar only (nothing uploaded); marker: see the identity verdicts above"
            elif [ "$MODE" = "roundtrip3" ] && [ -n "$IVERD" ]; then
              echo "EMULATOR BOOT: BOOTED - roundtrip3 job (attempt S2 snapshot capsule FIRST: section 08c; attempt C identity-as-code SECOND: sections 08d/08e); the two ROUNDTRIP3 verdicts above are this job's permanence proofs and no artifact shelf was used; each attempt packed to a LOCAL tar only (nothing uploaded); marker: see the identity verdicts above"
            elif [ "$MODE" = "roundtrip4" ] && [ -n "$IVERD" ]; then
              echo "EMULATOR BOOT: BOOTED - roundtrip4 job (attempt C identity-as-code FIRST: sections 09/10; attempt S snapshot capsule SECOND: sections 11/12); the two ROUNDTRIP4 verdicts above are this job's permanence proofs and no artifact shelf was used; each attempt packed to a LOCAL tar only (nothing uploaded); marker: see the identity verdicts above"
            elif [ "$MODE" = "roundtrip5" ] && [ -n "$IVERD" ]; then
              echo "EMULATOR BOOT: BOOTED - roundtrip5 job (attempt C identity-as-code FIRST: sections 09/10; attempt S snapshot capsule SECOND: sections 11/12; v3.9 disk discipline: start-of-job audit section 0c, per-attempt payload cleanup, 2 GB attempt-boundary disk guard, verdicts also in the step summary + phonevault-evidence artifact); the two ROUNDTRIP5 verdicts above are this job's permanence proofs and no artifact shelf was used; each attempt packed to a LOCAL tar only (nothing uploaded); marker: see the identity verdicts above"
            elif [ "$MODE" = "birth" ] && [ -n "$IVERD" ]; then
              echo "EMULATOR BOOT: BOOTED - birth job (v4.0 production: fresh -wipe-data birth boot, root marker verified at birth, identity capsule captured by adb root and sealed INSIDE the pack, graceful production pack uploaded as artifact phonevault-avd-state; section 07a); $PACKTXT; $MARKERTXT"
            elif [ "$MODE" = "wake" ] && [ -n "$IVERD" ]; then
              echo "EMULATOR BOOT: BOOTED - wake job (v4.0 production: pinned + certificate-verified pack restored into a clean hand-made folder, boot WITHOUT -wipe-data, capsule re-applied by root BEFORE the verdict identity read, identity re-judged after a second plain reboot, state re-packed with session+1 and uploaded; sections 07b/07c); $PACKTXT; $MARKERTXT"
            elif [ "$BOOTED" = "1" ] && [ "$CAPOK" = "1" ]; then
              if [ "$MODE" = "roundtrip" ]; then
                echo "EMULATOR BOOT: BOOTED - roundtrip job (boot 1: sections 3-4; graceful pack: sections 5-6; wipe + clean-room restore + boot 2: section 7); the roundtrip verdict above is this job's permanence proof and no artifact shelf was used; $PACKTXT; $MARKERTXT"
              elif [ "$MODE" = "restore" ]; then
                echo "EMULATOR BOOT: BOOTED - sys.boot_completed=1 reached on factoryphone restored from artifact phonevault-avd-state (no -wipe-data); identity verdict above + section 4; $PACKTXT; $MARKERTXT"
              else
                echo "EMULATOR BOOT: BOOTED - sys.boot_completed=1 reached on factoryphone (android-34 google_apis x86_64, KVM accel, headless); identity + screencap captured; $PACKTXT; $MARKERTXT; no vault state was restored in this run (fresh mode, by design)"
              fi
            elif [ "$BOOTED" = "1" ]; then
              echo "EMULATOR BOOT: NO BOOT - emulator reported boot_completed but identity capture failed (see section 4)"
            else
              KVM="$(grep -h 'KVM_GATE:' "$EVID/00-baseline.txt" 2>/dev/null)"
              CFG="$(grep -h 'CONFIG_MISSING' "$EVID/02-avd.txt" 2>/dev/null)"
              RST="$(grep -h 'RESTORE_FAILED' "$EVID/02c-restore.txt" 2>/dev/null)"
              if echo "$KVM" | grep -q ABSENT; then
                echo "EMULATOR BOOT: NO BOOT - /dev/kvm absent on this runner (see section 0)"
              elif [ -n "$CFG" ]; then
                ARC="$(grep -h 'avdmanager_rc=' "$EVID/02-avd.txt" 2>/dev/null | tail -1)"
                echo "EMULATOR BOOT: NO BOOT - AVD creation failed, no config.ini ($ARC; boot skipped by design; FULL avdmanager output in section 02b below)"
              elif [ -n "$RST" ]; then
                echo "EMULATOR BOOT: NO BOOT - restore mode: state restore failed, boot not attempted (see section 02c below)"
              else
                echo "EMULATOR BOOT: NO BOOT - sys.boot_completed never reached 1 within the 12-minute bounded wait (see sections 3-4 + emulator console log tail)"
              fi
            fi
            echo ""
            for f in "$EVID"/0*.txt; do
              [ -f "$f" ] || continue
              echo "########## $f ##########"
              cat "$f"
              echo ""
            done
          } > "$OUT" 2>&1
          cat "$OUT"
          git config user.name "cloud-android-probe"
          git config user.email "probe@localhost"
          git add "$OUT"
          git commit -m "emulator output [skip ci]" || exit 0
          git push

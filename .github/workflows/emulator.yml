          # body (deduped: one ROUNDTRIP5-C line per attempt).
          PV_SKIP_C2=""
          rt5_disk_guard "attempt C part 2 start" > "$EVID/00e-disk-c2.txt" 2>&1 || PV_SKIP_C2=1
          cat "$EVID/00e-disk-c2.txt"
          if [ "$PV_SKIP_C2" = "1" ]; then grep -q '^ROUNDTRIP5-C:' "$VERDICTS" 2>/dev/null || echo "ROUNDTRIP5-C: NOT EVALUATED (disk - free < 2 GB at the attempt C part 2 boundary; harness fault, not evidence)" >> "$VERDICTS"; fi

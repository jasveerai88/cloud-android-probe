            if [ "$RT4_CMOK" != "1" ]; then RT4_GATE_FAIL="$RT4_GATE_FAIL extracted certificate marker_ok != 1 (was '$RT4_CMOK');"; fi
            if [ -z "$SEAL_SHA" ] || [ "$X_SHA" != "$SEAL_SHA" ]; then RT4_GATE_FAIL="$RT4_GATE_FAIL integrity hash mismatch (extracted $X_SHA vs seal $SEAL_SHA);"; fi

              return 0
            fi
            echo "restore gates PASSED (certificate + integrity + snapshot) - booting the capsule"
            if pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "WARNING: qemu-system still alive before boot 2"; fi
            echo "-- boot 2 (extra flags: $*) --"
            rt4_boot "$EVID/rt4-s-boot2.log" "$@"
            RT4_ID2=""; RT4_RB=""
            if [ "$RT4_BOOTED" = "1" ]; then
              RT4_ID2="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
              RT4_RB="$(adb -s emulator-5554 shell cat "$RT4_CMPATH" 2>/dev/null | tr -d '\r')"
            fi
            echo "birth_android_id (extracted certificate)=$RT4_CID"
            echo "restored_android_id=$RT4_ID2"
            echo "marker_expected (extracted certificate)=$RT4_CMK"
            echo "marker_readback (${RT4_CMPATH})=$RT4_RB"
          }
          rt4_judge() {
            # attempt S verdict. The pv1 snapshot-load evidence is part of
            # the verdict: if the restore boot log cannot show pv1 loading,
            # even a matching identity is SNAPSHOT LOAD UNPROVEN - never a
            # clean SAME PHONE on ambiguous evidence (run 15 bug (b)).
            if [ -n "$RT4_GATE_FAIL" ]; then
              echo "ROUNDTRIP5-S: NOT EVALUATED (restore gate failed before boot:$RT4_GATE_FAIL - transport/extraction fault, not an identity result)"
              echo "ROUNDTRIP5-S: NOT EVALUATED - restore gate failed before boot" >> "$VERDICTS"; return 0
            fi
            if [ "$RT4_BOOTED" != "1" ]; then
              echo "ROUNDTRIP5-S: NOT EVALUATED - restore boot never reached sys.boot_completed=1 in ~15 min, and the one in-attempt retry also failed"
              echo "ROUNDTRIP5-S: NOT EVALUATED - restore boot failed on both attempts" >> "$VERDICTS"; return 0
            fi
            echo "-- snapshot-load evidence from the restore boot log --"
            grep -iE 'loading snapshot|snapshot.*(load|pv1)|load.*snapshot' "$EVID/rt4-s-boot2.log" 2>/dev/null | head -12
            LOAD_OK=0
            if grep -qiE 'loading snapshot.*pv1|snapshot pv1.*load|loading.*pv1' "$EVID/rt4-s-boot2.log" 2>/dev/null; then LOAD_OK=1; fi
            echo "snapshot_load_proven=$LOAD_OK"
            FAIL=""
            if [ "$RT4_ID2" != "$RT4_CID" ]; then FAIL="android_id mismatch (birth $RT4_CID, restored $RT4_ID2)"; fi
            if [ -n "$RT4_CMK" ] && [ "$RT4_RB" != "$RT4_CMK" ]; then
              if [ -n "$FAIL" ]; then FAIL="$FAIL; "; fi
              FAIL="${FAIL}marker mismatch (expected $RT4_CMK, got '${RT4_RB:-<missing/empty>}')"
            fi
            if [ -z "$FAIL" ] && [ "$LOAD_OK" = "1" ]; then
              echo "ROUNDTRIP5-S: SAME PHONE (birth $RT4_CID == restored $RT4_ID2, marker readback matched, pv1 snapshot load proven in the boot log)"
              echo "ROUNDTRIP5-S: SAME PHONE" >> "$VERDICTS"
            elif [ -z "$FAIL" ]; then
              echo "ROUNDTRIP5-S: IDENTITY MATCHED BUT SNAPSHOT LOAD UNPROVEN (birth $RT4_CID == restored $RT4_ID2 and the marker matched, but the restore boot log shows no pv1 load line - the capsule may not be what carried the identity)"
              echo "ROUNDTRIP5-S: IDENTITY MATCHED BUT SNAPSHOT LOAD UNPROVEN" >> "$VERDICTS"
            else
              echo "ROUNDTRIP5-S: IDENTITY LOST - $FAIL (snapshot_load_proven=$LOAD_OK)"
              echo "ROUNDTRIP5-S: IDENTITY LOST - $FAIL" >> "$VERDICTS"
            fi
          }
          # ---- attempt S part 2 (gated restore + snapshot boot + verdict) ----
          rt5_disk_guard() {
            # v3.9 disk guard ($1 = label): rc=1 when free < 2 GB.
            local FREEKB
            FREEKB="$(df -Pk . 2>/dev/null | awk 'NR==2 {print $4}')"
            echo "disk guard ($1): free_kb=${FREEKB:-unknown} floor_kb=2097152"
            df -h . 2>&1 | tail -1
            if [ -n "$FREEKB" ] && [ "$FREEKB" -lt 2097152 ]; then echo "DISK_GUARD=TRIPPED ($1)"; return 1; fi
            echo "DISK_GUARD=OK ($1)"
          }
          SECS2="$EVID/12-roundtrip5-s2.txt"; : > "$SECS2"
          VERDICTS="$EVID/rt4-verdicts.txt"; [ -f "$VERDICTS" ] || : > "$VERDICTS"
          SSTATE="$EVID/rt4-s-state.txt"
          # v3.9: a guard trip seals NOT EVALUATED (disk) + skips the
          # body (deduped: one ROUNDTRIP5-S line per attempt).
          PV_SKIP_S2=""
          rt5_disk_guard "attempt S part 2 start" > "$EVID/00g-disk-s2.txt" 2>&1 || PV_SKIP_S2=1
          cat "$EVID/00g-disk-s2.txt"
          if [ "$PV_SKIP_S2" = "1" ]; then grep -q '^ROUNDTRIP5-S:' "$VERDICTS" 2>/dev/null || echo "ROUNDTRIP5-S: NOT EVALUATED (disk - free < 2 GB at the attempt S part 2 boundary; harness fault, not evidence)" >> "$VERDICTS"; fi
          {
            echo "===== 12 roundtrip5 attempt S (part 2): gated restore + snapshot boot + verdict ====="
            if [ "$MODE" != "roundtrip5" ] || [ "$PV_SKIP_S2" = "1" ]; then
              if [ "$PV_SKIP_S2" = "1" ]; then echo "attempt S part 2 SKIPPED - ROUNDTRIP5-S NOT EVALUATED (disk) sealed by the v3.9 guard above"; else echo "mode=$MODE - attempt S part 2 not applicable (roundtrip5 mode only)"; fi
            elif [ ! -f "$SSTATE" ] || ! grep -q 'S_STATE=PENDING' "$SSTATE" 2>/dev/null; then
              echo "attempt S already concluded in part 1 (section 11) or never started - no second verdict line is written here"
            elif [ ! -f pv-s-state.tar ]; then
              echo "ROUNDTRIP5-S: FAILED - part 1 reported PENDING but the local pack tar is missing at part 2 start (build inconsistency, not a permanence result)"
              echo "ROUNDTRIP5-S: FAILED - pack tar missing at part 2 start" >> "$VERDICTS"
            else
              SEAL_PATH="$(sed -n 's/^SEAL_PATH=//p' "$SSTATE" | tr -d '\r' | head -1)"
              SEAL_SHA="$(sed -n 's/^SEAL_SHA=//p' "$SSTATE" | tr -d '\r' | head -1)"
              echo "seal handoff read: seal_path=$SEAL_PATH seal_sha256=$SEAL_SHA"
              rt4_restore "$PWD/pv-s-state.tar" -snapshot pv1 -verbose
              echo "-- snapshot lines from the restore boot log (verbatim, first 12) --"
              grep -i 'snapshot' "$EVID/rt4-s-boot2.log" 2>/dev/null | head -12
              if ! grep -qi 'snapshot' "$EVID/rt4-s-boot2.log" 2>/dev/null; then echo "(no snapshot lines in the restore boot log)"; fi
              rt4_judge
              if [ "$RT4_BOOTED" = "1" ]; then rt4_stop; fi
            fi
          } > "$SECS2" 2>&1
          cat "$SECS2"
          mkdir -p .pv-evidence-final
          cp "$SECS2" .pv-evidence-final/ 2>/dev/null
          cp "$EVID/00g-disk-s2.txt" .pv-evidence-final/ 2>/dev/null
          if [ -s "$VERDICTS" ]; then cp "$VERDICTS" "$EVID/identity-verdict.txt"; cp "$EVID/identity-verdict.txt" .pv-evidence-final/ 2>/dev/null; fi
          echo "-- roundtrip5 verdicts (both attempts) --"
          cat "$VERDICTS" 2>&1
          echo "attempt S part 2 evidence merged into .pv-evidence-final"
          # v3.9 cleanup: attempt S's verdict is sealed - delete its
          # multi-GB tar so the output steps assemble with room to spare.
          if [ "$MODE" = "roundtrip5" ]; then
            echo "-- v3.9 cleanup after attempt S (verdict sealed) --"
            ls -lh pv-s-state.tar 2>&1
            rm -f pv-s-state.tar
            df -h . 2>&1 | tail -1
          fi

      - name: PhoneVault step 13 of 15 - production birth (v4.0, birth mode only)
        shell: bash
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"
          AVDDIR="$ANDROID_AVD_HOME/$AVD.avd"
          EMU_BIN="$ANDROID_HOME/emulator/emulator"
          MARKER_GUEST=/data/local/tmp/phonevault-marker.txt
          MARKER_NAME=phonevault-marker.txt
          # ---- pv40 helper family (per-step copies) ----
          rt4_kill_hung() {
            # hung-emulator stop: graceful kill, hard kill if qemu survives 60s. Returns 0 when gone.
            adb -s emulator-5554 emu kill 2>&1; echo "kill_hung emu_kill_rc=$?"
            local i
            for i in $(seq 1 24); do
              if ! pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "emulator gone at poll $i"; RT4_PID=""; sync 2>/dev/null; return 0; fi
              if [ "$i" = "12" ]; then echo "still alive after 60s graceful - hard kill"; pkill -f 'qemu-system' 2>&1; if [ -n "$RT4_PID" ]; then kill "$RT4_PID" 2>/dev/null; fi; fi
              sleep 5
            done
            echo "KILL_HUNG_FAILED=1 - qemu-system still alive"; return 1
          }
          rt4_boot() {
            # $1 = boot log; rest = extra flags. ~15 min poll; timeout -> stop + retry ONCE. Sets RT4_BOOTED/PID.
            local LOG="$1"; shift
            RT4_BOOTED=""
            local TRY BC i
            for TRY in 1 2; do
              echo "-- boot attempt $TRY (extra flags: $*) --"
              nohup "$EMU_BIN" @"$AVD" -port 5554 -no-window -no-audio -no-boot-anim \
                -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 "$@" > "$LOG" 2>&1 &
              RT4_PID=$!
              echo "emulator_pid=$RT4_PID"
              timeout 90 adb -s emulator-5554 wait-for-device 2>&1; echo "wait_for_device_rc=$?"
              for i in $(seq 1 45); do
                BC="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
                echo "boot poll $i (attempt $TRY): sys.boot_completed='$BC'"
                if [ "$BC" = "1" ]; then RT4_BOOTED=1; break; fi
                sleep 20
              done
              if [ "$RT4_BOOTED" = "1" ]; then echo "boot_wait_result: sys.boot_completed=1 reached on attempt $TRY"; break; fi
              echo "boot_wait_result: attempt $TRY TIMEOUT after ~15 min"
              if [ "$TRY" = "1" ]; then echo "retrying the boot once (run 15 flake pattern) - stopping the hung emulator first"; rt4_kill_hung; fi
            done
          }
          rt4_stop() {
            # v3.5 graceful stop: emu kill, poll until qemu gone. NO hard kill, ever.
            RT4_GRACEFUL=0
            adb -s emulator-5554 emu kill 2>&1; echo "emu_kill_rc=$?"
            local i ALIVE
            for i in $(seq 1 24); do
              ALIVE=""
              if [ -n "$RT4_PID" ] && kill -0 "$RT4_PID" 2>/dev/null; then ALIVE="$ALIVE launcher_pid=$RT4_PID"; fi
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then ALIVE="$ALIVE qemu-system present"; fi
              if [ -z "$ALIVE" ]; then RT4_GRACEFUL=1; echo "graceful stop confirmed at poll $i"; break; fi
              echo "shutdown poll $i: still alive:$ALIVE"; sleep 5
            done
            if [ "$RT4_GRACEFUL" != "1" ]; then echo "GRACEFUL_STOP=0 - launcher/qemu still alive after 120s"; fi
            sync 2>/dev/null; echo "host sync done"
          }
          rt4_root() {
            # adbd as root (userdebug image); bounded poll for uid=0.
            if [ "$RT4_ROOTED" = "1" ]; then echo "already rooted"; return 0; fi
            RT4_ROOTED=0
            adb -s emulator-5554 root 2>&1; echo "adb_root_rc=$?"
            sleep 3
            local i IDOUT
            for i in $(seq 1 8); do
              IDOUT="$(adb -s emulator-5554 shell id 2>/dev/null | tr -d '\r')"
              echo "root poll $i: id='$IDOUT'"
              case "$IDOUT" in *uid=0*) RT4_ROOTED=1; break;; esac
              sleep 5
            done
            echo "rooted=$RT4_ROOTED"
          }
          rt4_marker() {
            # v3.8 marker: root write to /data/local/tmp, readback-verified; /sdcard bounded fallback. Sets RT4_TOKEN/MOK/MPATH.
            RT4_TOKEN="pv1-$(date -u +%Y%m%d%H%M%S)-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            RT4_MOK=0; RT4_MPATH=""
            printf '%s\n' "$RT4_TOKEN" > rt4-marker-local.txt
            echo "marker_token: $RT4_TOKEN"
            rt4_root
            if [ "$RT4_ROOTED" = "1" ]; then
              adb -s emulator-5554 push rt4-marker-local.txt "$MARKER_GUEST" 2>&1
              RB="$(adb -s emulator-5554 shell cat "$MARKER_GUEST" 2>/dev/null | tr -d '\r')"
              echo "marker_readback: $RB"
              if [ "$RB" = "$RT4_TOKEN" ]; then RT4_MOK=1; RT4_MPATH="$MARKER_GUEST"; echo "MARKER_OK=1 - root write to /data/local/tmp, verified by readback"; fi
            fi
            if [ "$RT4_MOK" != "1" ]; then
              echo "-- marker fallback: /sdcard, bounded retries --"
              local i SDRB
              for i in $(seq 1 12); do
                echo "sdcard status poll $i: '$(adb -s emulator-5554 shell cmd sdcard status 2>/dev/null | tr -d '\r')'"
                adb -s emulator-5554 push rt4-marker-local.txt /sdcard/phonevault-marker-boot1.txt 2>&1
                SDRB="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
                if [ "$SDRB" = "$RT4_TOKEN" ]; then RT4_MOK=1; RT4_MPATH=/sdcard/phonevault-marker-boot1.txt; echo "MARKER_OK=1 - /sdcard fallback verified at poll $i"; break; fi
                sleep 10
              done
              echo "marker_fallback_readback: $SDRB"
            fi
            if [ "$RT4_MOK" != "1" ]; then echo "MARKER_FAILED - neither path reproduced the token at birth"; fi
          }
          rt5_disk_guard() {
            # v3.9 disk guard ($1 = label): rc=1 when free < 2 GB.
            local FREEKB
            FREEKB="$(df -Pk . 2>/dev/null | awk 'NR==2 {print $4}')"
            echo "disk guard ($1): free_kb=${FREEKB:-unknown} floor_kb=2097152"
            df -h . 2>&1 | tail -1
            if [ -n "$FREEKB" ] && [ "$FREEKB" -lt 2097152 ]; then echo "DISK_GUARD=TRIPPED ($1)"; return 1; fi
            echo "DISK_GUARD=OK ($1)"
          }
          pv40_pack() {
            # v4.0 production pack: $1 = tar name. Globals in: PV40_ID / PV40_TOKEN /
            # PV40_MOK / PV40_MPATH / PV40_CAPSHA / PV40_MD5 / PV40_SESSION /
            # PV40_BORN / PV40_ROUTE (set by the caller from ITS OWN certificate or
            # birth readings - never literals). Sets PV40_PACK_OK + PV40_PACK_SHA.
            # tar_rc=0 required; the largest userdata file is hashed for the
            # certificate AND re-verified FROM the finished tar (v3.8 seal).
            PV40_PACK_OK=0; PV40_TAR="$1"; PV40_PACK_SHA=""
            df -h . | tail -1
            echo "-- AVD folder listing BEFORE pack --"; ls -lh "$AVDDIR" 2>&1
            local UD_PRESENT="" uf f SZ
            for uf in userdata-qemu.img.qcow2 userdata-qemu.img userdata.img; do
              if [ -f "$AVDDIR/$uf" ]; then UD_PRESENT="$UD_PRESENT $uf"; fi
            done
            if [ -z "$UD_PRESENT" ]; then echo "PACK_SKIPPED=1 - no userdata candidate in the AVD folder"; return 0; fi
            EMU_PKG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            SYSIMG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            EMUVER="$("$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -1 | tr -d '\r')"
            if [ -z "$EMUVER" ]; then EMUVER="pkgrev:$EMU_PKG_REV"; fi
            local LARGEST="" LARGEST_SIZE=0 SHA
            for uf in $UD_PRESENT; do
              SZ="$(stat -c %s "$AVDDIR/$uf" 2>/dev/null)"; case "$SZ" in ''|*[!0-9]*) SZ=0;; esac
              if [ "$SZ" -gt "$LARGEST_SIZE" ]; then LARGEST_SIZE=$SZ; LARGEST=$uf; fi
            done
            SHA="$(sha256sum "$AVDDIR/$LARGEST" | awk '{print $1}')"
            local LIST="$UD_PRESENT"
            for f in encryptionkey.img.qcow2 encryptionkey.img sdcard.img config.ini emulator-user.ini hardware-qemu.ini pv-capsule.tar capsule-manifest.txt; do
              if [ -f "$AVDDIR/$f" ]; then LIST="$LIST $f"; fi
            done
            {
              echo "avd_name=$AVD"; echo "system_image=$SYSIMG"
              echo "emulator_version=$EMUVER"; echo "emulator_pkg_revision=$EMU_PKG_REV"; echo "system_image_revision=$SYSIMG_REV"
              echo "production=1"; echo "session=$PV40_SESSION"
              echo "born_utc=$PV40_BORN"; echo "packed_utc=$(date -u +%FT%TZ)"
              echo "android_id=$PV40_ID"; echo "marker_token=$PV40_TOKEN"; echo "marker_ok=$PV40_MOK"; echo "marker_guest_path=$PV40_MPATH"
              echo "phone=${PV_PHONE_ID:-one}"; echo "route=$PV40_ROUTE"; echo "identity_capsule=android_id + marker + settings_secure.xml tar (adb root capture; re-applied pre-read on wakes)"
              echo "capsule_sha256=$PV40_CAPSHA"; echo "settings_secure_md5_birth=$PV40_MD5"
              echo "largest_userdata_file=$LARGEST"; echo "largest_userdata_size_bytes=$LARGEST_SIZE"; echo "largest_userdata_sha256=$SHA"
              for f in $LIST; do printf 'packed_file: %s %s bytes\n' "$f" "$(stat -c %s "$AVDDIR/$f")"; done
              echo "packed_file: phonevault-version.txt (this file)"
            } > "$AVDDIR/phonevault-version.txt"
            echo "-- phonevault-version.txt (in pack) --"; cat "$AVDDIR/phonevault-version.txt"
            LIST="$LIST phonevault-version.txt"
            echo "pack set:$LIST"
            echo "excluded by construction (never in the candidate list): cache.img, cache.img.qcow2, snapshots/, *.lock"
            rm -f "$PV40_TAR"
            tar -cf "$PV40_TAR" -C "$AVDDIR" $LIST 2>pv40-tar-err.txt; local TARRC=$?
            cat pv40-tar-err.txt 2>&1; echo "tar_rc=$TARRC"
            ls -lh "$PV40_TAR" 2>&1
            if [ "$TARRC" != "0" ] || [ ! -s "$PV40_TAR" ]; then echo "PACK_FAILED=1 - tar_rc=$TARRC; the pack is NOT trusted and is NOT flagged for upload"; return 0; fi
            local SEAL_SHA
            SEAL_SHA="$(tar -xOf "$PV40_TAR" "$LARGEST" 2>/dev/null | sha256sum | awk '{print $1}')"
            echo "seal check: sha256($LARGEST) recomputed FROM the finished tar=$SEAL_SHA vs certificate=$SHA"
            if [ "$SEAL_SHA" != "$SHA" ]; then echo "PACK_FAILED=1 - from-tar seal != certificate hash; the pack is NOT trusted"; return 0; fi
            PV40_PACK_SHA="$(sha256sum "$PV40_TAR" | awk '{print $1}')"
            PV40_PACK_OK=1
            echo "PACK_OK=1 - production pack $PV40_TAR complete (tar_rc=0, seal verified from the tar)"
            echo "pack_sha256=$PV40_PACK_SHA"
            printf 'PACK_OK=1\n' > "$EVID/pack-state.txt"
            mkdir -p .pv-evidence-final; cp "$EVID/pack-state.txt" .pv-evidence-final/ 2>/dev/null
            touch .pv-pack-ok
          }
          # ---- production BIRTH (v4.0): the real permanent phone is born ONCE ----
          SECB="$EVID/07a-birth.txt"; : > "$SECB"
          BVERD="$EVID/prod-birth-verdict.txt"; : > "$BVERD"
          PV_SKIP_B=""
          rt5_disk_guard "production birth start" > "$EVID/00h-disk-birth.txt" 2>&1 || PV_SKIP_B=1
          cat "$EVID/00h-disk-birth.txt"
          if [ "$PV_SKIP_B" = "1" ] && [ "$MODE" = "birth" ]; then echo "BIRTH: NOT EVALUATED (disk - free < 2 GB at the birth boundary; harness fault, not evidence)" >> "$BVERD"; fi
          {
            echo "===== 7a production BIRTH (v4.0): birth + identity capsule + production pack (birth mode only) ====="
            if [ "$MODE" != "birth" ] || [ "$PV_SKIP_B" = "1" ]; then
              if [ "$PV_SKIP_B" = "1" ]; then echo "birth SKIPPED - BIRTH NOT EVALUATED (disk) sealed by the v3.9 guard above"; else echo "mode=$MODE - production birth not applicable (birth mode only)"; fi
            elif [ "$AVD_OK" != "1" ]; then
              echo "BIRTH: NOT RUN (AVD creation failed in step 2 - no AVD to birth)"
              echo "BIRTH: NOT RUN (AVD creation failed in step 2)" >> "$BVERD"
            else
              echo "-- process gate: a leftover qemu-system is cleared and verified gone first --"
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "leftover qemu-system at birth start: $(pgrep -af 'qemu-system' 2>/dev/null)"; rt4_kill_hung; fi
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then
                echo "BIRTH: NOT RUN (leftover qemu-system unclearable at birth start)"
                echo "BIRTH: NOT RUN (leftover qemu-system could not be cleared)" >> "$BVERD"
              else
                echo "process gate clean - birth proceeds"
                echo "-- reset the AVD to birth-clean: config set kept, every state file removed --"
                find "$AVDDIR" -mindepth 1 -maxdepth 1 ! -name 'config.ini' ! -name 'emulator-user.ini' ! -name 'hardware-qemu.ini' -exec rm -rf {} + 2>&1
                PV40_BORN="$(date -u +%FT%TZ)"; echo "born_utc=$PV40_BORN"
                echo "-- birth boot (fresh AVD, -wipe-data -no-snapshot, standard flags) --"
                rt4_boot "$EVID/pv40-birth-boot.log" -wipe-data -no-snapshot
                if [ "$RT4_BOOTED" != "1" ]; then
                  echo "BIRTH: NOT RUN (birth boot failed on both attempts - runner problem, not evidence)"
                  echo "BIRTH: NOT RUN (birth boot failed on both attempts)" >> "$BVERD"
                else
                  RT4_ID1="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                  echo "birth_android_id=$RT4_ID1"
                  rt4_marker
                  if [ "$RT4_MOK" != "1" ]; then
                    echo "BIRTH: NOT EVALUATED (marker not written+verified at birth - v3.8 validity gate: an unverified-marker birth is never packed)"
                    echo "BIRTH: NOT EVALUATED - marker write/verify failed at birth" >> "$BVERD"
                    rt4_stop
                  else
                    adb -s emulator-5554 exec-out screencap -p > .pv-screencap.png 2>/dev/null; ls -l .pv-screencap.png 2>&1
                    rt4_root
                    if [ "$RT4_ROOTED" != "1" ]; then
                      echo "BIRTH: NOT RUN (adb root gave no uid=0 shell - the capsule cannot be captured on this image)"
                      echo "BIRTH: NOT RUN (adb root failed at birth)" >> "$BVERD"
                      rt4_stop
                    else
                      echo "-- capture the identity capsule (exactly the attempt-C recipe; the run No.19 verdict made it the standard) --"
                      echo "capsule design (minimal): android_id VALUE + marker FILE at $MARKER_GUEST + settings_secure.xml tar (carries android_id on Android 14); capsule travels INSIDE the pack - a wake runs in a LATER run."
                      CAPDIR="pv-capsule"; rm -rf "$CAPDIR"; mkdir -p "$CAPDIR"
                      CAP_ID="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                      echo "capsule_android_id=$CAP_ID"
                      CAP_FILES="data/system/users/0/settings_secure.xml ${MARKER_GUEST#/}"
                      adb -s emulator-5554 shell "tar -cf /data/local/tmp/pv-capsule.tar -C / $CAP_FILES" 2>&1; echo "capsule_tar_rc=$?"
                      adb -s emulator-5554 pull /data/local/tmp/pv-capsule.tar "$CAPDIR/pv-capsule.tar" 2>&1
                      echo "-- capsule tar contents --"
                      CAPLIST="$(tar -tf "$CAPDIR/pv-capsule.tar" 2>&1)"; echo "$CAPLIST"
                      CAPSHA=""; CAP_OK=0
                      if [ -s "$CAPDIR/pv-capsule.tar" ] && echo "$CAPLIST" | grep -q 'settings_secure.xml' && echo "$CAPLIST" | grep -q "$MARKER_NAME"; then CAP_OK=1; CAPSHA="$(sha256sum "$CAPDIR/pv-capsule.tar" | awk '{print $1}')"; fi
                      echo "capsule_ok=$CAP_OK capsule_sha256=$CAPSHA"
                      CAP_MD5_BIRTH="$(adb -s emulator-5554 shell md5sum /data/system/users/0/settings_secure.xml 2>/dev/null | awk '{print $1}' | tr -d '\r')"
                      echo "settings_secure.xml md5 at birth=$CAP_MD5_BIRTH"
                      {
                        echo "capsule_format=phonevault-identity-capsule-v2"
                        echo "android_id=$CAP_ID"
                        echo "marker_token=$RT4_TOKEN"
                        echo "marker_guest_path=$RT4_MPATH"
                        echo "capsule_sha256=$CAPSHA"
                        echo "settings_secure_md5_birth=$CAP_MD5_BIRTH"
                      } > "$CAPDIR/capsule-manifest.txt"
                      cat "$CAPDIR/capsule-manifest.txt"
            if [ "${PV_PHONE_ID:-one}" = "two" ]; then
              echo "-- phone two: US tz/locale --"
              adb -s emulator-5554 shell setprop persist.sys.timezone America/New_York 2>&1
              adb -s emulator-5554 shell service call alarm 3 s16 America/New_York >/dev/null 2>&1
              adb -s emulator-5554 shell settings put global auto_time_zone 0 2>&1
              adb -s emulator-5554 shell settings put system system_locales en-US 2>&1
              echo "PHONE TWO US SETTINGS: tz=$(adb -s emulator-5554 shell getprop persist.sys.timezone 2>/dev/null | tr -d '\r') locales=$(adb -s emulator-5554 shell settings get system system_locales 2>/dev/null | tr -d '\r')"
            fi
            if [ "${PV_PHONE_ID:-one}" = "verify" ]; then
              A="adb -s emulator-5554 shell"; Z=America/Los_Angeles
              $A setprop persist.sys.timezone $Z 2>&1
              $A service call alarm 3 s16 $Z >/dev/null 2>&1
              $A settings put global auto_time_zone 0 2>&1
              $A settings put system system_locales en-US 2>&1
              echo "PHONE VERIFY US SETTINGS: tz=$($A getprop persist.sys.timezone 2>/dev/null | tr -d '\r') locales=$($A settings get system system_locales 2>/dev/null | tr -d '\r')"
            fi
                      rt4_stop
                      if [ "$CAP_OK" != "1" ]; then
                        echo "BIRTH: NOT RUN (capsule capture failed - root could not tar the chosen paths)"
                        echo "BIRTH: NOT RUN (identity capsule capture failed)" >> "$BVERD"
                      elif [ "$RT4_GRACEFUL" != "1" ]; then
                        echo "BIRTH: NOT RUN (graceful stop unproven - pack refused under the v3.5 H5 guard)"
                        echo "BIRTH: NOT RUN (graceful stop unproven)" >> "$BVERD"
                      else
                        cp "$CAPDIR/pv-capsule.tar" "$AVDDIR/pv-capsule.tar"
                        cp "$CAPDIR/capsule-manifest.txt" "$AVDDIR/capsule-manifest.txt"
                        PV40_ID="$CAP_ID"; PV40_TOKEN="$RT4_TOKEN"; PV40_MOK=1; PV40_MPATH="$RT4_MPATH"
                        PV40_CAPSHA="$CAPSHA"; PV40_MD5="$CAP_MD5_BIRTH"; PV40_SESSION=1; PV40_ROUTE="birth-v4.0"
                        pv40_pack phonevault-state.tar
                        if [ "$PV40_PACK_OK" != "1" ]; then
                          echo "BIRTH: FAILED - the phone was born (android_id $CAP_ID, marker verified) but the production pack failed (pack tar/seal failed); NOTHING was uploaded - re-dispatch birth"
                          echo "BIRTH: FAILED - production pack failed; nothing uploaded" >> "$BVERD"
                        else
                          echo "BIRTH: PHONE BORN (android_id $CAP_ID, marker $RT4_TOKEN) - identity capsule sealed inside the pack; pack_sha256=$PV40_PACK_SHA; the pack uploads as artifact $PV_ART_NAME on the conditioned upload step; every later power-on is mode=wake pinned to THIS run"
                          echo "BIRTH: PHONE BORN (android_id $CAP_ID, marker $RT4_TOKEN)" >> "$BVERD"
                        fi
                      fi
                    fi
                  fi
                fi
              fi
            fi
          } > "$SECB" 2>&1
          cat "$SECB"
          mkdir -p .pv-evidence-final
          cp "$SECB" .pv-evidence-final/ 2>/dev/null
          cp "$EVID/00h-disk-birth.txt" .pv-evidence-final/ 2>/dev/null
          if [ "$MODE" = "birth" ] && [ -s "$BVERD" ]; then cp "$BVERD" "$EVID/identity-verdict.txt"; cp "$EVID/identity-verdict.txt" .pv-evidence-final/ 2>/dev/null; fi
          echo "production birth evidence merged into .pv-evidence-final"

      - name: PhoneVault step 14 of 15 - production wake part 1 - pinned fetch + certificate gate + capsule apply (v4.0, wake mode only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"
          AVDDIR="$ANDROID_AVD_HOME/$AVD.avd"
          EMU_BIN="$ANDROID_HOME/emulator/emulator"
          MARKER_GUEST=/data/local/tmp/phonevault-marker.txt
          MARKER_NAME=phonevault-marker.txt
          # ---- pv40 helper family (per-step copies) ----
          rt4_kill_hung() {
            # hung-emulator stop: graceful kill, hard kill if qemu survives 60s. Returns 0 when gone.
            adb -s emulator-5554 emu kill 2>&1; echo "kill_hung emu_kill_rc=$?"
            local i
            for i in $(seq 1 24); do
              if ! pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "emulator gone at poll $i"; RT4_PID=""; sync 2>/dev/null; return 0; fi
              if [ "$i" = "12" ]; then echo "still alive after 60s graceful - hard kill"; pkill -f 'qemu-system' 2>&1; if [ -n "$RT4_PID" ]; then kill "$RT4_PID" 2>/dev/null; fi; fi
              sleep 5
            done
            echo "KILL_HUNG_FAILED=1 - qemu-system still alive"; return 1
          }
          rt4_boot() {
            # $1 = boot log; rest = extra flags. ~15 min poll; timeout -> stop + retry ONCE. Sets RT4_BOOTED/PID.
            local LOG="$1"; shift
            RT4_BOOTED=""
            local TRY BC i
            for TRY in 1 2; do
              echo "-- boot attempt $TRY (extra flags: $*) --"
              nohup "$EMU_BIN" @"$AVD" -port 5554 -no-window -no-audio -no-boot-anim \
                -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 "$@" > "$LOG" 2>&1 &
              RT4_PID=$!
              echo "emulator_pid=$RT4_PID"
              timeout 90 adb -s emulator-5554 wait-for-device 2>&1; echo "wait_for_device_rc=$?"
              for i in $(seq 1 45); do
                BC="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
                echo "boot poll $i (attempt $TRY): sys.boot_completed='$BC'"
                if [ "$BC" = "1" ]; then RT4_BOOTED=1; break; fi
                sleep 20
              done
              if [ "$RT4_BOOTED" = "1" ]; then echo "boot_wait_result: sys.boot_completed=1 reached on attempt $TRY"; break; fi
              echo "boot_wait_result: attempt $TRY TIMEOUT after ~15 min"
              if [ "$TRY" = "1" ]; then echo "retrying the boot once (run 15 flake pattern) - stopping the hung emulator first"; rt4_kill_hung; fi
            done
          }
          rt4_stop() {
            # v3.5 graceful stop: emu kill, poll until qemu gone. NO hard kill, ever.
            RT4_GRACEFUL=0
            adb -s emulator-5554 emu kill 2>&1; echo "emu_kill_rc=$?"
            local i ALIVE
            for i in $(seq 1 24); do
              ALIVE=""
              if [ -n "$RT4_PID" ] && kill -0 "$RT4_PID" 2>/dev/null; then ALIVE="$ALIVE launcher_pid=$RT4_PID"; fi
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then ALIVE="$ALIVE qemu-system present"; fi
              if [ -z "$ALIVE" ]; then RT4_GRACEFUL=1; echo "graceful stop confirmed at poll $i"; break; fi
              echo "shutdown poll $i: still alive:$ALIVE"; sleep 5
            done
            if [ "$RT4_GRACEFUL" != "1" ]; then echo "GRACEFUL_STOP=0 - launcher/qemu still alive after 120s"; fi
            sync 2>/dev/null; echo "host sync done"
          }
          rt4_root() {
            # adbd as root (userdebug image); bounded poll for uid=0.
            if [ "$RT4_ROOTED" = "1" ]; then echo "already rooted"; return 0; fi
            RT4_ROOTED=0
            adb -s emulator-5554 root 2>&1; echo "adb_root_rc=$?"
            sleep 3
            local i IDOUT
            for i in $(seq 1 8); do
              IDOUT="$(adb -s emulator-5554 shell id 2>/dev/null | tr -d '\r')"
              echo "root poll $i: id='$IDOUT'"
              case "$IDOUT" in *uid=0*) RT4_ROOTED=1; break;; esac
              sleep 5
            done
            echo "rooted=$RT4_ROOTED"
          }
          rt5_disk_guard() {
            # v3.9 disk guard ($1 = label): rc=1 when free < 2 GB.
            local FREEKB
            FREEKB="$(df -Pk . 2>/dev/null | awk 'NR==2 {print $4}')"
            echo "disk guard ($1): free_kb=${FREEKB:-unknown} floor_kb=2097152"
            df -h . 2>&1 | tail -1
            if [ -n "$FREEKB" ] && [ "$FREEKB" -lt 2097152 ]; then echo "DISK_GUARD=TRIPPED ($1)"; return 1; fi
            echo "DISK_GUARD=OK ($1)"
          }
          # ---- production WAKE part 1 (v4.0): pinned fetch, certificate gate, boot, apply ----
          SECW="$EVID/07b-wake.txt"; : > "$SECW"
          WVERD="$EVID/prod-wake-verdict.txt"; : > "$WVERD"
          WSTATE="$EVID/pv40-wake-state.txt"
          PV_SKIP_W=""
          rt5_disk_guard "production wake part 1 start" > "$EVID/00i-disk-wake.txt" 2>&1 || PV_SKIP_W=1
          cat "$EVID/00i-disk-wake.txt"
          if [ "$PV_SKIP_W" = "1" ] && [ "$MODE" = "wake" ]; then echo "WAKE: NOT EVALUATED (disk - free < 2 GB at the wake part 1 boundary; harness fault, not evidence)" >> "$WVERD"; fi
          {
            echo "===== 7b production WAKE part 1 (v4.0): pinned + gated restore, capsule re-apply (wake mode only) ====="
            if [ "$MODE" != "wake" ] || [ "$PV_SKIP_W" = "1" ]; then
              if [ "$PV_SKIP_W" = "1" ]; then echo "wake part 1 SKIPPED - WAKE NOT EVALUATED (disk) sealed by the v3.9 guard above"; else echo "mode=$MODE - production wake not applicable (wake mode only; every other mode keeps its v3.9 behaviour)"; fi
            else
              PIN="${{ inputs.pin_run_id }}"
              echo "pin_run_id_input=${PIN:-<none>}"
              echo "wake rule (the poisoned-shelf lesson, run No.9): wake NEVER takes the newest artifact blindly - pin_run_id names the birth run or the newest GOOD wake run, and the pack is accepted only when its OWN certificate passes the gates below BEFORE anything is extracted or booted."
              PIN_OK=1
              case "$PIN" in ''|*[!0-9]*) PIN_OK=0;; esac
              if [ "$PIN_OK" != "1" ]; then
                echo "WAKE: NOT EVALUATED (pin_run_id is REQUIRED for wake and must be a numeric run ID - got '${PIN:-<empty>}'; no download attempted)"
                echo "WAKE: NOT EVALUATED - pin_run_id missing or non-numeric" >> "$WVERD"
              else
                DLDIR="pv-wake-dl"; STAGE="pv-wake-stage"
                rm -rf "$DLDIR"; mkdir -p "$DLDIR"
                echo "-- download artifact $PV_ART_NAME from pinned run $PIN --"
                gh run download "$PIN" --name "$PV_ART_NAME" --dir "$DLDIR" 2>&1 | tail -2
                if [ ! -f "$DLDIR/phonevault-state.tar" ]; then
                  echo "-- gh run download produced no tar; fallback: artifacts API, filtered to the pinned run --"
                  gh api "repos/${{ github.repository }}/actions/artifacts?name=$PV_ART_NAME&per_page=100" > pv-wake-arts.json 2>pv-wake-arts.err; echo "artifacts_api_rc=$?"
                  WAKE_AID="$(python3 -c 'import sys,json; pin=sys.argv[1]; d=json.load(open("pv-wake-arts.json")); live=[a for a in d.get("artifacts",[]) if not a.get("expired") and str((a.get("workflow_run") or {}).get("id"))==pin]; live.sort(key=lambda a: a.get("created_at") or "", reverse=True); print(live[0].get("id") if live else "")' "$PIN" 2>/dev/null)"
                  echo "artifacts_api_candidate_id=${WAKE_AID:-<none>}"
                  if [ -n "$WAKE_AID" ]; then
                    if gh api "repos/${{ github.repository }}/actions/artifacts/$WAKE_AID/zip" > "$DLDIR/phonevault-state.zip" 2>pv-wake-dl.err && [ -s "$DLDIR/phonevault-state.zip" ]; then
                      if command -v unzip >/dev/null 2>&1; then unzip -o "$DLDIR/phonevault-state.zip" -d "$DLDIR" >/dev/null 2>&1; else python3 -c "import zipfile; zipfile.ZipFile('$DLDIR/phonevault-state.zip').extractall('$DLDIR')" 2>&1; fi
                    else echo "artifact zip download failed:"; cat pv-wake-dl.err 2>&1; fi
                  fi
                fi
                if [ ! -f "$DLDIR/phonevault-state.tar" ]; then
                  echo "WAKE: NOT EVALUATED (no $PV_ART_NAME artifact downloadable from pinned run $PIN - expired (90-day retention), deleted, or that run never uploaded one)"
                  echo "WAKE: NOT EVALUATED - no artifact from the pinned run" >> "$WVERD"
                else
                  ls -lh "$DLDIR/phonevault-state.tar"
                  echo "-- CERTIFICATE GATE (BEFORE extraction or boot): the pack's own phonevault-version.txt must prove android_id present + marker_ok=1, capsule integrity (the pack's pv-capsule.tar re-hashed vs the certificate capsule_sha256) and disk integrity (the certificate's largest userdata file, extracted from the pack and re-hashed, vs largest_userdata_sha256). Gate failure = WAKE: NOT EVALUATED with the certificate printed - printed below either way --"
                  rm -rf "$STAGE"; mkdir -p "$STAGE"
                  tar -xf "$DLDIR/phonevault-state.tar" -C "$STAGE" phonevault-version.txt 2>/dev/null; CERT_RC=$?
                  if [ "$CERT_RC" != "0" ] || [ ! -f "$STAGE/phonevault-version.txt" ]; then
                    echo "WAKE: NOT EVALUATED (certificate gate failed BEFORE boot: no phonevault-version.txt extractable from the pinned pack)"
                    echo "WAKE: NOT EVALUATED - no certificate in the pinned pack" >> "$WVERD"
                  else
                    CERT="$STAGE/phonevault-version.txt"
                    echo "-- pinned pack's phonevault-version.txt (the certificate the verdict uses) --"; cat "$CERT"
                    CID="$(sed -n 's/^android_id=//p' "$CERT" | tr -d '\r' | head -1)"
                    CMOK="$(sed -n 's/^marker_ok=//p' "$CERT" | tr -d '\r' | head -1)"
                    CTOKEN="$(sed -n 's/^marker_token=//p' "$CERT" | tr -d '\r' | head -1)"
                    CMPATH="$(sed -n 's/^marker_guest_path=//p' "$CERT" | tr -d '\r' | head -1)"
                    CCAPSHA="$(sed -n 's/^capsule_sha256=//p' "$CERT" | tr -d '\r' | head -1)"
                    CMD5="$(sed -n 's/^settings_secure_md5_birth=//p' "$CERT" | tr -d '\r' | head -1)"
                    CBORN="$(sed -n 's/^born_utc=//p' "$CERT" | tr -d '\r' | head -1)"
                    CSES="$(sed -n 's/^session=//p' "$CERT" | tr -d '\r' | head -1)"
                    CLF="$(sed -n 's/^largest_userdata_file=//p' "$CERT" | tr -d '\r' | head -1)"
                    CLS="$(sed -n 's/^largest_userdata_sha256=//p' "$CERT" | tr -d '\r' | head -1)"
                    case "$CSES" in ''|*[!0-9]*) CSES=1;; esac
                    if [ -z "$CMPATH" ]; then CMPATH="$MARKER_GUEST"; fi
                    echo "certificate values: android_id=$CID marker_ok=$CMOK marker_token=$CTOKEN marker_guest_path=$CMPATH capsule_sha256=$CCAPSHA session=$CSES born_utc=$CBORN largest_userdata_file=$CLF"
                    CAPACT=""; ACT=""
                    if tar -tf "$DLDIR/phonevault-state.tar" 2>/dev/null | grep -qx 'pv-capsule.tar'; then
                      tar -xf "$DLDIR/phonevault-state.tar" -C "$STAGE" pv-capsule.tar 2>/dev/null
                      if [ -f "$STAGE/pv-capsule.tar" ]; then CAPACT="$(sha256sum "$STAGE/pv-capsule.tar" | awk '{print $1}')"; fi
                    fi
                    if [ -n "$CLF" ]; then
                      tar -xf "$DLDIR/phonevault-state.tar" -C "$STAGE" "$CLF" 2>/dev/null
                      if [ -f "$STAGE/$CLF" ]; then ACT="$(sha256sum "$STAGE/$CLF" | awk '{print $1}')"; fi
                    fi
                    echo "integrity: sha256(pv-capsule.tar from the pack)=$CAPACT vs certificate capsule_sha256=$CCAPSHA; sha256($CLF from the pack)=$ACT vs certificate largest_userdata_sha256=$CLS"
                    GATE_OK=1; GATE_REASON=""
                    if [ -z "$CID" ]; then GATE_OK=0; GATE_REASON="$GATE_REASON certificate android_id is EMPTY;"; fi
                    if [ "$CMOK" != "1" ]; then GATE_OK=0; GATE_REASON="$GATE_REASON certificate marker_ok != 1 (was '$CMOK');"; fi
                    if [ -z "$CTOKEN" ]; then GATE_OK=0; GATE_REASON="$GATE_REASON certificate marker_token is EMPTY;"; fi
                    if [ -z "$CCAPSHA" ] || [ "$CAPACT" != "$CCAPSHA" ]; then GATE_OK=0; GATE_REASON="$GATE_REASON capsule integrity mismatch (pack capsule $CAPACT vs certificate $CCAPSHA);"; fi
                    if [ -z "$CLS" ] || [ "$ACT" != "$CLS" ]; then GATE_OK=0; GATE_REASON="$GATE_REASON disk integrity mismatch (pack largest file $ACT vs certificate $CLS);"; fi
                    if [ "$GATE_OK" != "1" ]; then
                      echo "WAKE: NOT EVALUATED (certificate gate failed BEFORE boot:$GATE_REASON - a transport/shelf fault is not an identity result; the certificate is printed above)"
                      echo "WAKE: NOT EVALUATED - certificate gate failed before boot" >> "$WVERD"
                    else
                      echo "certificate gate PASSED: android_id=$CID marker_ok=1 capsule + disk integrity match the certificate"
                      echo "-- process gate: a leftover qemu-system is cleared and verified gone first --"
                      if pgrep -f 'qemu-system' >/dev/null 2>&1; then echo "leftover qemu-system at wake start: $(pgrep -af 'qemu-system' 2>/dev/null)"; rt4_kill_hung; fi
                      if pgrep -f 'qemu-system' >/dev/null 2>&1; then
                        echo "WAKE: NOT RUN (leftover qemu-system unclearable at wake start)"
                        echo "WAKE: NOT RUN (leftover qemu-system could not be cleared)" >> "$WVERD"
                      else
                        echo "-- extract into a CLEAN HAND-MADE AVD folder (no avdmanager pre-create - the diagnosis clean-room rule) --"
                        rm -rf "$AVDDIR" "$ANDROID_AVD_HOME/$AVD.ini"
                        mkdir -p "$AVDDIR"
                        printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/%s.avd\ntarget=android-34\n' "$AVDDIR" "$AVD" > "$ANDROID_AVD_HOME/$AVD.ini"
                        tar -xf "$DLDIR/phonevault-state.tar" -C "$AVDDIR" 2>&1; UNTARRC=$?; echo "untar_rc=$UNTARRC"
                        ls -lh "$AVDDIR" 2>&1 | head -24
                        if [ "$UNTARRC" != "0" ]; then
                          echo "WAKE: NOT EVALUATED (extraction of the verified pack failed, untar_rc=$UNTARRC - transport fault, not an identity result)"
                          echo "WAKE: NOT EVALUATED - pack extraction failed" >> "$WVERD"
                        else
                          echo "-- wake boot (standard flags, -no-snapshot, NEVER -wipe-data) --"
                          rt4_boot "$EVID/pv40-wake-boot.log" -no-snapshot
                          if [ "$RT4_BOOTED" != "1" ]; then
                            echo "WAKE: NOT EVALUATED - wake boot never reached sys.boot_completed=1 in ~15 min, and the one in-attempt retry also failed"
                            echo "WAKE: NOT EVALUATED - wake boot failed on both attempts" >> "$WVERD"
                          else
                            PRE_ID="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                            PRE_MARKER="$(adb -s emulator-5554 shell cat "$CMPATH" 2>/dev/null | tr -d '\r')"
                            echo "android_id_BEFORE_apply=$PRE_ID (CONTROL reading, taken BEFORE any apply on purpose: the encryption wall - runs No.9/11 and the diagnosis proved the disk restore re-initialises /data, so this is expected NOT to be the certificate value; identity is applied next, by code)"
                            echo "marker_BEFORE_apply (${CMPATH})='${PRE_MARKER:-<missing/empty>}'"
                            rt4_root
                            if [ "$RT4_ROOTED" != "1" ]; then
                              echo "WAKE: FAILED - adb root did not yield a uid=0 shell on the wake boot, so the capsule could not be applied (certificate_id=$CID control_id=$PRE_ID)"
                              echo "WAKE: FAILED - adb root failed on the wake boot" >> "$WVERD"
                              rt4_stop
                            else
                              echo "-- apply the capsule as root (BEFORE identity is read for the verdict): push the capsule tar FROM THE PACK, extract at /, then settings put LAST so the settings provider's own write is the final word --"
                              adb -s emulator-5554 push "$AVDDIR/pv-capsule.tar" /data/local/tmp/pv-capsule-restore.tar 2>&1; echo "capsule_push_rc=$?"
                              adb -s emulator-5554 shell "tar -xf /data/local/tmp/pv-capsule-restore.tar -C /" 2>&1; echo "capsule_extract_rc=$?"
                              adb -s emulator-5554 shell settings put secure android_id "$CID" 2>&1; echo "settings_put_rc=$?"
                              POST_ID="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
                              POST_MARKER="$(adb -s emulator-5554 shell cat "$CMPATH" 2>/dev/null | tr -d '\r')"
                              echo "android_id_AFTER_apply=$POST_ID"
                              echo "marker_AFTER_apply (${CMPATH})=$POST_MARKER (expected: $CTOKEN)"
                              adb -s emulator-5554 exec-out screencap -p > .pv-screencap.png 2>/dev/null; ls -l .pv-screencap.png 2>&1
                              {
                                echo "WAKE_STATE=PENDING"
                                echo "CID=$CID"
                                echo "CTOKEN=$CTOKEN"
                                echo "CMPATH=$CMPATH"
                                echo "CCAPSHA=$CCAPSHA"
                                echo "CMD5=$CMD5"
                                echo "CBORN=$CBORN"
                                echo "CSES=$CSES"
                                echo "PRE_ID=$PRE_ID"
                                echo "POST_ID=$POST_ID"
                                echo "POST_MARKER=$POST_MARKER"
                              } > "$WSTATE"
                              echo "wake part 1 complete - the guest stays BOOTED; part 2 reboots it and judges survival; handoff in $WSTATE"
                              cat "$WSTATE"
                            fi
                          fi
                        fi
                      fi
                    fi
                  fi
                fi
              fi
            fi
          } > "$SECW" 2>&1
          cat "$SECW"
          mkdir -p .pv-evidence-final
          cp "$SECW" .pv-evidence-final/ 2>/dev/null
          cp "$EVID/00i-disk-wake.txt" .pv-evidence-final/ 2>/dev/null
          if [ "$MODE" = "wake" ] && [ -s "$WVERD" ]; then cp "$WVERD" "$EVID/identity-verdict.txt"; cp "$EVID/identity-verdict.txt" .pv-evidence-final/ 2>/dev/null; fi
          echo "production wake part 1 evidence merged into .pv-evidence-final"

      - name: PhoneVault step 14b of 15 - production wake live window + steady egress (v5.1, wake mode only)
        env:
          PV1_EP: ${{ secrets.PV_PROXY_ENDPOINT }}
          PV1_EXP: ${{ secrets.PV_EXPECTED_EGRESS_IP }}
          PV2_EP: ${{ secrets.PV2_PROXY_ENDPOINT }}
          PV2_EXP: ${{ secrets.PV2_EXPECTED_EGRESS_IP }}
          PVV_EP: ${{ secrets.PVV_PROXY_ENDPOINT }}
          PVV_EXP: ${{ secrets.PVV_EXPECTED_EGRESS_IP }}
          PV_KEY: ${{ secrets.PV_WEBSHARE_API_KEY }}
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          MODE="${MODE:-$(cat .pv-mode.txt 2>/dev/null | tr -d '\r\n')}"
          if [ -z "$MODE" ]; then MODE="fresh"; fi
          SECL="$EVID/07b2-live-egress.txt"; : > "$SECL"
          WSTATE="$EVID/pv40-wake-state.txt"

                find "$AVDDIR/snapshots" -type f 2>/dev/null | while read -r sf; do printf 'packed_file: %s %s bytes\n' "${sf#$AVDDIR/}" "$(stat -c %s "$sf" 2>/dev/null)"; done >> "$EVID/rt2-pack-sizes.txt"
                grep 'snapshots/' "$EVID/rt2-pack-sizes.txt" 2>/dev/null || echo "no snapshot files listed"
              else
                echo "pack: snapshots dir ABSENT though include_snapshots=1 - the capsule will have no snapshot to load"
              fi
            fi
            EMU_PKG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            SYSIMG_REV="$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/source.properties" 2>/dev/null | head -1 | tr -d '\r')"
            EMUVER="$("$EMU_BIN" -version 2>&1 | head -1 | tr -d '\r')"; if [ -z "$EMUVER" ]; then EMUVER="pkgrev:$EMU_PKG_REV"; fi
            if [ "$RT2_MOK" = "1" ]; then MT="$RT2_TOKEN"; else MT=""; fi
            {

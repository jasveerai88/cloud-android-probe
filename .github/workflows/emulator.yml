            adb -s emulator-5554 emu kill 2>&1; echo "emu_kill_rc=$?"
            local i ALIVE
            for i in $(seq 1 24); do
              ALIVE=""
              if [ -n "$RT4_PID" ] && kill -0 "$RT4_PID" 2>/dev/null; then ALIVE="$ALIVE launcher_pid=$RT4_PID"; fi
              if pgrep -f 'qemu-system' >/dev/null 2>&1; then ALIVE="$ALIVE qemu-system present"; fi
              if [ -z "$ALIVE" ]; then RT4_GRACEFUL=1; echo "graceful stop confirmed at poll $i"; break; fi
              echo "shutdown poll $i: still alive:$ALIVE"; sleep 5
            done
            if [ "$RT4_GRACEFUL" != "1" ]; then echo "GRACEFUL_STOP=0 - launcher/qemu still alive after 120s"; fi
            sync 2>/dev/null; echo "host sync done"
          }
          rt4_restore() {
            # $1 = local tar; rest = boot-2 extra flags. v3.8 restore: untar
            # into a clean hand-made folder, then the CERTIFICATE GATE and
            # the SNAPSHOT GATE run BEFORE boot (run 15 bugs (b)+(c)): cert
            # read from the EXTRACTED folder, android_id asserted non-empty
            # + marker_ok=1, integrity re-hash vs the part-1 seal (globals
            # SEAL_PATH / SEAL_SHA), snapshots/pv1/ram.bin asserted present
            # and non-empty. A gate failure sets RT4_GATE_FAIL and NO boot
            # happens - a transport fault is NOT EVALUATED, never LOST.

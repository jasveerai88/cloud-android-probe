name: cloud-android-emulator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fresh = new phone (boots with -wipe-data); restore = boot the newest packed phonevault-avd-state artifact (no -wipe-data, identity proof)"
        type: choice
        options:
          - fresh
          - restore
        default: fresh
        required: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/emulator.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: phonevault-emulator
  cancel-in-progress: false

jobs:
  emulator-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PhoneVault step 1 of 5 - baseline, KVM gate, SDK install (v3.4.1 split of v3.4)
        shell: bash
        run: |
          set +e
          OUT=emulator-output.txt
          EVID=.pv-evidence
          mkdir -p "$EVID"
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="fresh"; fi
          {
            echo "PHONEVAULT EMULATOR BOOT TEST v3.4"
            echo "v3.4 changes over v3.3, each from run No.3 hard evidence (BOOTED, but PACK_SKIPPED + marker lost): (1) PACK BY DISCOVERY - v3.2/v3.3 packed a fixed DESIGN.md section 2 filename this emulator version never writes, so the pack skipped; v3.4 lists the AVD folder first and tars whichever of the candidate state files are actually present (userdata-qemu.img.qcow2 / userdata-qemu.img / userdata.img + encryptionkey images + config set), skipping only when NO userdata candidate exists; the generated phonevault-version.txt records the exact packed file list, per-file sizes and the SHA-256 of the largest userdata file. (2) MARKER VIA PUSH - run No.3's shell redirect to /sdcard failed with 'Operation not permitted' (empty readback); the marker is now written to a local runner file and adb-pushed to /sdcard, verified by readback, and reported MARKER_FAILED when the push/readback does not reproduce the token. (3) HONEST VERDICT - the verdict line derives BOOTED / PACKED / MARKER from the actual PACK_OK / MARKER_OK flags, and the phonevault-avd-state upload step runs only when a verified pack exists (if-no-files-found: error). RESTORE mode and all v3.3 behaviour otherwise unchanged (ANDROID_AVD_HOME pin, full avdmanager capture, device fallback, CONFIG_MISSING hard abort, bounded waits)"
            echo "run_started_utc: $(date -u +%FT%TZ)"
            echo "workflow_run_number: ${{ github.run_number }}"
            echo "workflow_run_id: ${{ github.run_id }}"
            echo "workflow_run_attempt: ${{ github.run_attempt }}"
            echo "mode: $MODE (push-triggered runs are always fresh; restore is dispatch-only)"
            echo "note: artifact transport is NOT the vault - DESIGN.md section 5 chunk_vault/HF wiring replaces it for real sessions (build step 3)"
            echo "===== 0 runner / kvm gate ====="
            echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH ImageOS=$ImageOS ImageVersion=$ImageVersion"
            uname -a; nproc; free -h; df -h / | tail -1
            ls -l /dev/kvm 2>&1
            if [ ! -e /dev/kvm ]; then
              echo "KVM_GATE: ABSENT - emulator cannot use hardware acceleration on this runner"
            else
              echo "KVM_GATE: PRESENT"
            fi
            echo "===== 0b kvm permissions (standard GitHub emulator step) ====="
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules 2>&1
            sudo udevadm control --reload-rules 2>&1
            sudo udevadm trigger --name-match=kvm 2>&1
            ls -l /dev/kvm 2>&1
            touch /dev/kvm 2>/dev/null; echo "kvm_touch_rc=$? (0 = runner user can open the device)"
          } > "$EVID/00-baseline.txt" 2>&1
          cat "$EVID/00-baseline.txt"

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          SDKMANAGER="$(command -v sdkmanager)"
          AVD="factoryphone"
          SYSIMG="system-images;android-34;google_apis;x86_64"
          # v3.3 (diagnosis fix, DIAGNOSIS-NOTES.md): pin the AVD home explicitly.
          # With ANDROID_AVD_HOME unset, avdmanager on this runner resolves its home
          # via the XDG config dir and creates the AVD under
          # $HOME/.config/.android/avd/ - while every check below looked in
          # $HOME/.android/avd/. Creation never failed; the check looked in the
          # wrong folder. Exported here, before any avdmanager/emulator call, so
          # create, boot, restore and pack all resolve the same AVD home.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          {
            echo "===== 1 sdkmanager installs (emulator + platform-tools + system image) ====="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "sdkmanager=$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1; echo "licenses_rc=$?"
            "$SDKMANAGER" "emulator" "platform-tools" "$SYSIMG" 2>&1 | tail -15
            echo "install_rc=${PIPESTATUS[0]}"
            ls "$ANDROID_HOME/emulator/emulator" 2>&1
            ls "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/" 2>&1 | head -8
          } > "$EVID/01-install.txt" 2>&1
          cat "$EVID/01-install.txt"


          # v3.4.1 split bridge: hand the small scalars to the following steps
          {
            echo "MODE=$MODE"
            echo "AVD=$AVD"
            echo "SYSIMG=$SYSIMG"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          } >> "$GITHUB_ENV"
      - name: PhoneVault step 2 of 5 - create AVD + restore fetch (v3.4.1 split of v3.4)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"
          SDKMANAGER="$(command -v sdkmanager)"

          AVD_OK=0
          {
            echo "===== 2 create AVD factoryphone (fixed PhoneVault profile) ====="
            echo "avd_home=$ANDROID_AVD_HOME"
            echo "----- 2a pre-create diagnostics -----"
            echo "-- avdmanager list device, filtered for pixel_6 --"
            avdmanager list device 2>&1 | grep -i -B1 -A2 'pixel_6' || echo "pixel_6 NOT FOUND in avdmanager list device output"
            if avdmanager list device 2>/dev/null | grep -qi 'pixel_6'; then PIXEL6_LISTED=1; else PIXEL6_LISTED=0; fi
            echo "pixel_6_listed=$PIXEL6_LISTED"
            echo "-- installed system-image dir --"
            ls -la "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/" 2>&1
            echo "-- sdkmanager --list_installed, system-images lines --"
            "$SDKMANAGER" --list_installed 2>&1 | grep -i 'system-images' || echo "no system-images package line in --list_installed output"
            echo "----- 2b create attempts (FULL avdmanager output in section 02b) -----"
            printf 'no\n' > "$EVID/avd-answer.txt"
            : > "$EVID/02b-avdmanager.txt"
            # avdmanager runs with stdin redirected from a file - NO pipeline -
            # so $? immediately after the call IS avdmanager's own exit code
            # (v3 piped through tail and read the wrong PIPESTATUS slot).
            attempt_create() {
              if [ -n "$1" ]; then
                avdmanager create avd -n "$AVD" -k "$SYSIMG" -d "$1" --force < "$EVID/avd-answer.txt" >> "$EVID/02b-avdmanager.txt" 2>&1
              else
                avdmanager create avd -n "$AVD" -k "$SYSIMG" --force < "$EVID/avd-answer.txt" >> "$EVID/02b-avdmanager.txt" 2>&1
              fi
              AVD_RC=$?
            }
            CFG="$ANDROID_AVD_HOME/$AVD.avd/config.ini"
            AVD_RC=""
            DEVICE_USED=""
            if [ "$PIXEL6_LISTED" = "1" ]; then
              echo "--- create attempt 1: -d pixel_6 ---" >> "$EVID/02b-avdmanager.txt"
              attempt_create "pixel_6"
              DEVICE_USED="pixel_6"
              echo "attempt1: avdmanager_rc=$AVD_RC device=pixel_6"
            else
              echo "pixel_6 absent from the device list - going straight to the default-device fallback"
            fi
            if [ ! -f "$CFG" ]; then
              echo "--- create attempt 2: no -d flag (default device) ---" >> "$EVID/02b-avdmanager.txt"
              attempt_create ""
              DEVICE_USED="default (no -d flag)"
              echo "attempt2: avdmanager_rc=$AVD_RC device=default"
            fi
            echo "avdmanager_rc=$AVD_RC"
            echo "device_used=$DEVICE_USED"
            echo "config_path=$CFG"
            if [ -f "$CFG" ]; then
              AVD_OK=1
              # assert the frozen profile values (DESIGN.md section 3)
              sed -i '/^hw.ramSize=/d; /^hw.cpu.ncore=/d; /^disk.dataPartition.size=/d' "$CFG"
              printf 'hw.ramSize=2048\nhw.cpu.ncore=2\ndisk.dataPartition.size=4096M\n' >> "$CFG"
              grep -E '^(hw.ramSize|hw.cpu.ncore|disk.dataPartition.size|image.sysdir|hw.device.name)' "$CFG"
            else
              echo "CONFIG_MISSING - AVD creation failed"
            fi
            echo "-- AVD home contents after creation --"
            ls "$ANDROID_AVD_HOME" 2>&1
            echo "full avdmanager output (both attempts, uncut): section 02b (02b-avdmanager.txt)"
          } > "$EVID/02-avd.txt" 2>&1
          cat "$EVID/02-avd.txt"
          echo "########## 02b avdmanager full output ##########"
          cat "$EVID/02b-avdmanager.txt"

          RESTORE_OK=0
          EXPECTED_ID=""
          EXPECTED_MARKER=""
          RESTORED_SESSION=0
          RESTORED_MARKER_OK=0
          {
            echo "===== 2c restore state (restore mode only) ====="
            if [ "$MODE" != "restore" ]; then
              echo "mode=fresh - no restore; this run creates a new phone (boot passes -wipe-data)"
            elif [ "$AVD_OK" != "1" ]; then
              echo "RESTORE_FAILED=1 - AVD creation failed, nowhere to restore into (see section 2)"
            else
              AVDDIR="$ANDROID_AVD_HOME/$AVD.avd"
              echo "gh_version: $(gh --version 2>&1 | head -1)"
              DLDIR="pv-restore-dl"
              FOUND_RUN=""
              echo "-- previous successful runs of this workflow, newest first (this run excluded) --"
              RUN_IDS="$(gh run list --workflow emulator.yml --status success --limit 25 --json databaseId --jq '.[].databaseId' 2>&1)"
              echo "$RUN_IDS"
              for RID in $RUN_IDS; do
                case "$RID" in ''|*[!0-9]*) continue;; esac
                if [ "$RID" = "${{ github.run_id }}" ]; then echo "skip run $RID (this run)"; continue; fi
                rm -rf "$DLDIR"
                echo "-- trying artifact phonevault-avd-state from run $RID --"
                if gh run download "$RID" --name phonevault-avd-state --dir "$DLDIR" 2>&1 && [ -f "$DLDIR/phonevault-state.tar" ]; then
                  FOUND_RUN="$RID"
                  echo "artifact downloaded from run $RID"
                  break
                else
                  echo "no usable phonevault-avd-state artifact on run $RID"
                fi
              done
              # v3.4.2: RESTORE_PATH records which lookup delivered the state.
              RESTORE_PATH=""
              if [ -n "$FOUND_RUN" ]; then RESTORE_PATH="runs"; fi
              if [ -z "$FOUND_RUN" ]; then
                echo "-- run-list path yielded no artifact; falling back to the artifacts API --"
                mkdir -p "$DLDIR"
                ART_JSON="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=phonevault-avd-state&per_page=10" 2>&1)"
                echo "-- artifacts API raw response (first 1500 chars) --"
                echo "$ART_JSON" | head -c 1500; echo
                echo "-- artifacts API returned (name / id / run_id / expired / created_at) --"
                echo "$ART_JSON" | python3 -c 'import sys,json; d=json.loads(sys.stdin.read() or "{}"); [print("artifact name=%s id=%s run_id=%s expired=%s created_at=%s" % (a.get("name"), a.get("id"), (a.get("workflow_run") or {}).get("id"), a.get("expired"), a.get("created_at"))) for a in d.get("artifacts",[])]' 2>/dev/null || echo "artifacts_api_parse_error - response was not JSON"
                ART_ID="$(echo "$ART_JSON" | python3 -c 'import sys,json; d=json.loads(sys.stdin.read() or "{}"); live=[a for a in d.get("artifacts",[]) if not a.get("expired")]; live.sort(key=lambda a: a.get("created_at") or "", reverse=True); print(live[0]["id"] if live else "")' 2>/dev/null | tr -d '\r')"
                ART_RUN="$(echo "$ART_JSON" | python3 -c 'import sys,json; d=json.loads(sys.stdin.read() or "{}"); live=[a for a in d.get("artifacts",[]) if not a.get("expired")]; live.sort(key=lambda a: a.get("created_at") or "", reverse=True); print((live[0].get("workflow_run") or {}).get("id") if live else "")' 2>/dev/null | tr -d '\r')"
                if [ -n "$ART_ID" ]; then
                  echo "-- downloading artifact id $ART_ID (run $ART_RUN) via artifacts API zip --"
                  if gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > "$DLDIR/phonevault-state.zip" 2>"$EVID/artifacts-api-dl.err" && [ -s "$DLDIR/phonevault-state.zip" ]; then
                    if command -v unzip >/dev/null 2>&1; then unzip -o "$DLDIR/phonevault-state.zip" -d "$DLDIR" 2>&1 | tail -3; else python3 -c "import zipfile; zipfile.ZipFile('$DLDIR/phonevault-state.zip').extractall('$DLDIR')" 2>&1; fi
                  else
                    echo "artifacts API zip download failed:"; cat "$EVID/artifacts-api-dl.err" 2>&1
                  fi
                  if [ -f "$DLDIR/phonevault-state.tar" ]; then
                    FOUND_RUN="$ART_RUN"
                    RESTORE_PATH="artifacts-api"
                    echo "artifact downloaded via artifacts API (artifact id $ART_ID, run $ART_RUN)"
                  else
                    echo "artifacts API path produced no phonevault-state.tar"
                  fi
                else
                  echo "artifacts API returned no non-expired phonevault-avd-state artifact"
                fi
              fi
              echo "RESTORE_PATH=${RESTORE_PATH:-none}"
              if [ -z "$FOUND_RUN" ]; then
                echo "RESTORE_FAILED=1 - no phonevault-avd-state artifact found via run list or artifacts API"
              else
                echo "state_source_run=$FOUND_RUN"
                echo "restore_path=$RESTORE_PATH"
                ls -lh "$DLDIR/phonevault-state.tar"
                echo "-- restored phonevault-version.txt (the birth certificate to match) --"
                tar -xOf "$DLDIR/phonevault-state.tar" phonevault-version.txt > "$EVID/restored-version.txt" 2>&1
                cat "$EVID/restored-version.txt"
                EXPECTED_ID="$(sed -n 's/^android_id=//p' "$EVID/restored-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                EXPECTED_MARKER="$(sed -n 's/^marker_token=//p' "$EVID/restored-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                RESTORED_SESSION="$(sed -n 's/^session=//p' "$EVID/restored-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                case "$RESTORED_SESSION" in ''|*[!0-9]*) RESTORED_SESSION=0;; esac
                RESTORED_MARKER_OK="$(sed -n 's/^marker_ok=//p' "$EVID/restored-version.txt" 2>/dev/null | tr -d '\r' | head -1)"
                case "$RESTORED_MARKER_OK" in 1) : ;; *) if [ -n "$EXPECTED_MARKER" ]; then RESTORED_MARKER_OK=1; else RESTORED_MARKER_OK=0; fi;; esac
                echo "expected_android_id=$EXPECTED_ID"
                echo "expected_marker_token=$EXPECTED_MARKER"
                echo "restored_session=$RESTORED_SESSION"
                echo "restored_marker_ok=$RESTORED_MARKER_OK (0 = the packed run never verified its marker; the identity proof then judges android_id only)"
                echo "-- untar into $AVDDIR BEFORE boot (overwrites the fresh AVD's userdata + config.ini with the packed ones) --"
                tar -xf "$DLDIR/phonevault-state.tar" -C "$AVDDIR" 2>&1; echo "untar_rc=$?"
                ls -lh "$AVDDIR" 2>&1 | head -20
                # v3.4: no filename assumptions - the restore untars whatever the
                # tar holds; success = at least one userdata candidate + config.ini
                UD_FOUND=""
                for uf in userdata-qemu.img.qcow2 userdata-qemu.img userdata.img; do
                  if [ -f "$AVDDIR/$uf" ]; then UD_FOUND="$uf"; break; fi
                done
                if [ -n "$UD_FOUND" ] && [ -f "$AVDDIR/config.ini" ]; then
                  RESTORE_OK=1
                  echo "RESTORE_OK=1 - state restored (userdata file found: $UD_FOUND); boot will run WITHOUT -wipe-data"
                else
                  echo "RESTORE_FAILED=1 - untar produced no userdata candidate (userdata-qemu.img.qcow2 / userdata-qemu.img / userdata.img) and/or no config.ini in the AVD folder"
                fi
              fi
            fi
          } > "$EVID/02c-restore.txt" 2>&1
          cat "$EVID/02c-restore.txt"


          # v3.4.1 split bridge: hand the small scalars to the following steps
          {
            echo "AVD_OK=$AVD_OK"
            echo "RESTORE_OK=$RESTORE_OK"
            echo "EXPECTED_ID=$EXPECTED_ID"
            echo "EXPECTED_MARKER=$EXPECTED_MARKER"
            echo "RESTORED_SESSION=$RESTORED_SESSION"
            echo "RESTORED_MARKER_OK=$RESTORED_MARKER_OK"
          } >> "$GITHUB_ENV"
      - name: PhoneVault step 3 of 5 - boot + capture identity and marker (v3.4.1 split of v3.4)
        shell: bash
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"

          EMU_PID=""
          {
            echo "===== 3 boot emulator headless (bounded wait 12 min) ====="
            if [ "$AVD_OK" != "1" ]; then
              echo "BOOT_SKIPPED=1 - AVD creation failed (CONFIG_MISSING, see sections 2 + 02b); boot NOT attempted - the job ends in minutes with a NO BOOT verdict instead of hanging"
              echo "BOOTED_FLAG="
            elif [ "$MODE" = "restore" ] && [ "$RESTORE_OK" != "1" ]; then
              echo "BOOT_SKIPPED=1 - restore mode but the state restore failed (RESTORE_FAILED, see section 02c); boot NOT attempted"
              echo "BOOTED_FLAG="
            else
              EMU_BIN="$ANDROID_HOME/emulator/emulator"
              # -wipe-data is FRESH mode only: it guarantees a clean, deterministic
              # first start of a brand-new phone. RESTORE boots must NEVER pass it
              # (DESIGN.md section 3 - it would factory-reset the restored phone).
              if [ "$MODE" = "restore" ]; then WIPE_FLAG=""; else WIPE_FLAG="-wipe-data"; fi
              echo "mode=$MODE wipe_flag='${WIPE_FLAG:-<none - restore boot>}'"
              nohup "$EMU_BIN" @"$AVD" -port 5554 -no-window -no-audio -no-boot-anim \
                -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 \
                -no-snapshot $WIPE_FLAG > "$EVID/emulator-console.log" 2>&1 &
              EMU_PID=$!
              echo "emulator_pid=$EMU_PID"
              timeout 90 adb -s emulator-5554 wait-for-device 2>&1; echo "wait_for_device_rc=$? (124 = timed out after 90s; the bounded poll below still runs)"
              BOOTED=""
              for i in $(seq 1 36); do
                BC="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
                echo "poll $i: sys.boot_completed='$BC'"
                if [ "$BC" = "1" ]; then BOOTED=1; break; fi
                sleep 20
              done
              echo "BOOTED_FLAG=$BOOTED"
              adb devices 2>&1
              if [ "$BOOTED" = "1" ]; then echo "boot_wait_result: sys.boot_completed=1 reached"; else echo "boot_wait_result: TIMEOUT after 12 min"; fi
            fi
          } > "$EVID/03-boot.txt" 2>&1
          cat "$EVID/03-boot.txt"

          PV_MARKER=""
          MARKER_OK=0
          {
            echo "===== 4 capture identity + marker (only if booted) ====="
            BOOTED="$(grep -c 'BOOTED_FLAG=1' "$EVID/03-boot.txt")"
            if [ "$BOOTED" = "1" ]; then
              ANDROID_ID="$(adb -s emulator-5554 shell settings get secure android_id 2>/dev/null | tr -d '\r')"
              printf '%s' "$ANDROID_ID" > "$EVID/android-id.txt"
              echo "android_id: $ANDROID_ID"
              echo "model: $(adb -s emulator-5554 shell getprop ro.product.model 2>/dev/null | tr -d '\r')"
              echo "device: $(adb -s emulator-5554 shell getprop ro.product.device 2>/dev/null | tr -d '\r')"
              echo "android_release: $(adb -s emulator-5554 shell getprop ro.build.version.release 2>/dev/null | tr -d '\r')"
              echo "android_sdk: $(adb -s emulator-5554 shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r')"
              if [ "$MODE" = "restore" ]; then
                # RESTORE: the marker file is READ ONLY here - never overwritten.
                # Identity = BOTH the live android_id AND the marker readback equal
                # the values sealed in the restored phonevault-version.txt.
                ACTUAL_MARKER="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
                echo "expected_android_id: $EXPECTED_ID"
                echo "actual_android_id: $ANDROID_ID"
                echo "expected_marker_token: $EXPECTED_MARKER"
                echo "actual_marker_token: $ACTUAL_MARKER"
                FAILPARTS=""
                if [ "$ANDROID_ID" != "$EXPECTED_ID" ]; then FAILPARTS="android_id mismatch (expected $EXPECTED_ID, got $ANDROID_ID)"; fi
                # The marker half of the proof runs only when the packed run
                # actually verified its marker (marker_ok=1 in the restored
                # version file); otherwise identity is judged on android_id
                # alone and the marker is reported as not evaluated - never
                # silently passed, never failed on an empty expectation.
                MARKER_EVAL=1
                if [ "$RESTORED_MARKER_OK" != "1" ] || [ -z "$EXPECTED_MARKER" ]; then MARKER_EVAL=0; fi
                if [ "$MARKER_EVAL" = "1" ]; then
                  if [ "$ACTUAL_MARKER" != "$EXPECTED_MARKER" ]; then
                    if [ -n "$FAILPARTS" ]; then FAILPARTS="$FAILPARTS; "; fi
                    FAILPARTS="${FAILPARTS}marker mismatch (expected $EXPECTED_MARKER, got '${ACTUAL_MARKER:-<missing/empty>}')"
                    MARKER_OK=0
                  else
                    MARKER_OK=1
                  fi
                  echo "marker_check: EVALUATED (restored pack marker_ok=1)"
                else
                  MARKER_OK=$RESTORED_MARKER_OK
                  echo "marker_check: NOT EVALUATED - restored pack carries no verified marker (marker_ok=$RESTORED_MARKER_OK); identity judged on android_id only"
                fi
                if [ -z "$FAILPARTS" ]; then IVERDICT="IDENTITY PROOF: SAME PHONE"; else IVERDICT="IDENTITY LOST — $FAILPARTS"; fi
                echo "identity_verdict: $IVERDICT"
                printf '%s\n' "$IVERDICT" > "$EVID/identity-verdict.txt"
                printf 'MARKER_OK=%s\n' "$MARKER_OK" > "$EVID/marker-state.txt"
                PV_MARKER="$EXPECTED_MARKER"
              else
                TOKEN="pv1-$(date -u +%Y%m%d%H%M%S)-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
                echo "$TOKEN" > phonevault-marker-token.txt
                # v3.4 MARKER VIA PUSH: run No.3 evidence - the old shell
                # redirect (an adb-shell echo into /sdcard) failed on
                # this image with "/system/bin/sh: can't create
                # /sdcard/phonevault-marker-boot1.txt: Operation not
                # permitted" and the readback came back empty, yet CAPTURE_OK
                # still claimed success. Write the token to a local runner
                # file, adb push it, and verify by cat readback; the marker
                # counts only when the readback reproduces the token.
                printf '%s\n' "$TOKEN" > phonevault-marker-local.txt
                adb -s emulator-5554 push phonevault-marker-local.txt /sdcard/phonevault-marker-boot1.txt 2>&1; echo "marker_push_rc=$?"
                MARKER_READBACK="$(adb -s emulator-5554 shell cat /sdcard/phonevault-marker-boot1.txt 2>/dev/null | tr -d '\r')"
                echo "marker_token: $TOKEN"
                echo "marker_readback: $MARKER_READBACK"
                if [ "$MARKER_READBACK" = "$TOKEN" ]; then
                  MARKER_OK=1
                  echo "MARKER_OK=1 - marker pushed via adb push and verified by readback"
                else
                  MARKER_OK=0
                  echo "MARKER_FAILED - adb push/readback did not reproduce the token; the marker is NOT verified on the phone and must not be claimed"
                fi
                printf 'MARKER_OK=%s\n' "$MARKER_OK" > "$EVID/marker-state.txt"
                PV_MARKER="$TOKEN"
              fi
              adb -s emulator-5554 exec-out screencap -p > phone-boot.png 2>/dev/null
              ls -l phone-boot.png 2>&1
              echo "CAPTURE_OK=1"
            else
              echo "CAPTURE_OK=0 - not booted, no identity to capture"
              if [ "$MODE" = "restore" ]; then echo "identity_verdict: NOT EVALUATED - phone did not boot"; fi
              echo "--- emulator console log (tail 60) ---"
              if [ -f "$EVID/emulator-console.log" ]; then tail -60 "$EVID/emulator-console.log" 2>&1; else echo "no emulator console log (boot not attempted - see section 3)"; fi
            fi
          } > "$EVID/04-capture.txt" 2>&1
          cat "$EVID/04-capture.txt"


          # v3.4.1 split bridge: hand the small scalars to the following steps
          {
            echo "EMU_PID=$EMU_PID"
            echo "PV_MARKER=$PV_MARKER"
          } >> "$GITHUB_ENV"
      - name: PhoneVault step 4 of 5 - shutdown + pack (v3.4.1 split of v3.4)
        shell: bash
        run: |
          set +e
          EVID=.pv-evidence
          mkdir -p "$EVID"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="${AVD:-factoryphone}"
          SYSIMG="${SYSIMG:-system-images;android-34;google_apis;x86_64}"
          MODE="${MODE:-fresh}"

          {
            echo "===== 5 shutdown ====="
            if [ "$AVD_OK" != "1" ]; then echo "no emulator was started (boot skipped after CONFIG_MISSING)"; fi
            adb -s emulator-5554 emu kill 2>&1; echo "emu_kill_rc=$?"
            sleep 5
            if [ -n "$EMU_PID" ] && kill -0 "$EMU_PID" 2>/dev/null; then
              kill "$EMU_PID" 2>/dev/null; sleep 3
              kill -9 "$EMU_PID" 2>/dev/null
              echo "emulator process needed a hard kill"
            else
              echo "emulator process exited cleanly"
            fi
            df -h / | tail -1
            du -sh "$ANDROID_AVD_HOME/$AVD.avd" 2>/dev/null
            ls -lh "$ANDROID_AVD_HOME/$AVD.avd/" 2>/dev/null | head -20
          } > "$EVID/05-shutdown.txt" 2>&1
          cat "$EVID/05-shutdown.txt"

          {
            echo "===== 6 pack AVD state (artifact transport - NOT the vault) ====="
            printf 'PACK_OK=0\n' > "$EVID/pack-state.txt"
            BOOTED6="$(grep -c 'BOOTED_FLAG=1' "$EVID/03-boot.txt")"
            if [ "$BOOTED6" != "1" ]; then
              echo "PACK_SKIPPED=1 - phone did not boot; nothing worth sealing"
            elif [ -n "$EMU_PID" ] && kill -0 "$EMU_PID" 2>/dev/null; then
              echo "PACK_SKIPPED=1 - emulator process still alive after shutdown; refusing to seal a live userdata (DESIGN.md section 3)"
            else
              AVDDIR="$ANDROID_AVD_HOME/$AVD.avd"
              echo "-- AVD folder listing BEFORE pack (discovery evidence; no state filename is assumed) --"
              ls -lh "$AVDDIR" 2>&1
              # v3.4 PACK BY DISCOVERY. Run No.3 evidence: this emulator
              # version writes userdata-qemu.img (base) + userdata-qemu.img.qcow2
              # (the grown overlay) and encryptionkey.img + encryptionkey.img.qcow2;
              # the fixed filename DESIGN.md section 2 assumed is never
              # written, so the v3.2/v3.3 pack skipped every time. Discover
              # instead: tar every PRESENT file from the candidate list below;
              # skip only when NONE of the userdata candidates exists.
              # Why the encryptionkey images travel with userdata: /data is
              # file-based encrypted and its keys are wrapped against the
              # encryption key image - userdata without its encryptionkey set
              # is undecryptable on restore. The qcow2 set (userdata base +
              # overlay, encryptionkey base + overlay) IS the phone's
              # identity and travels as one.
              UD_CANDIDATES="userdata-qemu.img.qcow2 userdata-qemu.img userdata.img"
              UD_PRESENT=""
              for uf in $UD_CANDIDATES; do
                if [ -f "$AVDDIR/$uf" ]; then UD_PRESENT="$UD_PRESENT $uf"; else echo "pack discover: userdata candidate absent: $uf"; fi
              done
              if [ -z "$UD_PRESENT" ]; then
                echo "PACK_SKIPPED=1 - none of the userdata candidates ($UD_CANDIDATES) exists in the AVD folder; nothing to seal"
              else
                echo "userdata candidates present:$UD_PRESENT"
                if [ "$MODE" = "restore" ]; then SESSION=$((RESTORED_SESSION + 1)); else SESSION=1; fi
                EMUVER="$("$ANDROID_HOME/emulator/emulator" -version 2>/dev/null | head -1)"
                AID="$(cat "$EVID/android-id.txt" 2>/dev/null)"
                MARKER_OK_PACK=0
                if [ -f "$EVID/marker-state.txt" ] && grep -q 'MARKER_OK=1' "$EVID/marker-state.txt"; then MARKER_OK_PACK=1; fi
                if [ "$MARKER_OK_PACK" = "1" ]; then MT="$PV_MARKER"; else MT=""; fi
                # largest userdata file (by bytes) carries the grown phone;
                # its SHA-256 is the pack's integrity anchor
                LARGEST=""; LARGEST_SIZE=0
                for uf in $UD_PRESENT; do
                  SZ="$(stat -c %s "$AVDDIR/$uf" 2>/dev/null)"; case "$SZ" in ''|*[!0-9]*) SZ=0;; esac
                  if [ "$SZ" -gt "$LARGEST_SIZE" ]; then LARGEST_SIZE=$SZ; LARGEST=$uf; fi
                done
                SHA="$(sha256sum "$AVDDIR/$LARGEST" | awk '{print $1}')"
                # full candidate list for the tar: discovered userdata +
                # encryptionkey set + sdcard + the config set + the version
                # file generated below. Anything absent is simply not packed.
                CANDIDATES="$UD_PRESENT encryptionkey.img.qcow2 encryptionkey.img sdcard.img config.ini emulator-user.ini hardware-qemu.ini"
                LIST=""
                SIZES_FILE="$EVID/pack-sizes.txt"; : > "$SIZES_FILE"
                for f in $CANDIDATES; do
                  if [ -f "$AVDDIR/$f" ]; then
                    LIST="$LIST $f"
                    printf 'packed_file: %s %s bytes\n' "$f" "$(stat -c %s "$AVDDIR/$f" 2>/dev/null)" >> "$SIZES_FILE"
                  else
                    echo "pack: absent, skipped: $f"
                  fi
                done
                {
                  echo "avd_name=$AVD"
                  echo "system_image=$SYSIMG"
                  echo "emulator_version=$EMUVER"
                  echo "session=$SESSION"
                  echo "packed_utc=$(date -u +%FT%TZ)"
                  echo "android_id=$AID"
                  echo "marker_token=$MT"
                  echo "marker_ok=$MARKER_OK_PACK"
                  echo "largest_userdata_file=$LARGEST"
                  echo "largest_userdata_size_bytes=$LARGEST_SIZE"
                  echo "largest_userdata_sha256=$SHA"
                  cat "$SIZES_FILE"
                  echo "packed_file: phonevault-version.txt (this file)"
                } > "$AVDDIR/phonevault-version.txt"
                echo "-- phonevault-version.txt written into the pack --"
                cat "$AVDDIR/phonevault-version.txt"
                LIST="$LIST phonevault-version.txt"
                echo "pack set:$LIST"
                echo "excluded by construction (never in the candidate list): cache.img, cache.img.qcow2, snapshots/, *.lock"
                tar -cf phonevault-state.tar -C "$AVDDIR" $LIST 2>&1; echo "tar_rc=$?"
                ls -lh phonevault-state.tar 2>&1
                echo "-- tar contents --"
                tar -tf phonevault-state.tar 2>&1
                if [ -f phonevault-state.tar ]; then
                  printf 'PACK_OK=1\n' > "$EVID/pack-state.txt"
                  touch .pv-pack-ok
                  echo "PACK_OK=1 - pack tar created and flagged (.pv-pack-ok) for the conditioned upload step"
                else
                  echo "PACK_FAILED=1 - tar did not produce phonevault-state.tar"
                fi
              fi
            fi
          } > "$EVID/06-pack.txt" 2>&1
          cat "$EVID/06-pack.txt"

          # stash evidence where the (always) output step can find it
          cp -r "$EVID" .pv-evidence-final 2>/dev/null
          printf '%s\n' "$MODE" > .pv-mode.txt
          if [ -f phone-boot.png ]; then cp phone-boot.png .pv-screencap.png; fi
          if [ -f phonevault-marker-token.txt ]; then cp phonevault-marker-token.txt .pv-marker-token.txt; fi
          echo "evidence stashed"

      - name: Upload boot screencap (artifact only, never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshot
          path: .pv-screencap.png
          if-no-files-found: ignore

      - name: Determine pack state (flag for the conditioned state upload)
        id: packflag
        if: always()
        shell: bash
        run: |
          if [ -f .pv-pack-ok ] && [ -f phonevault-state.tar ]; then
            echo "pack_ok=true" >> "$GITHUB_OUTPUT"
            echo "verified pack present (.pv-pack-ok + phonevault-state.tar): the state upload step runs and must find the tar (if-no-files-found: error)"
          else
            echo "pack_ok=false" >> "$GITHUB_OUTPUT"
            echo "no verified pack this run: the state upload step is skipped - nothing-to-upload is a legitimate outcome (not booted / pack skipped), not an error"
          fi

      - name: Upload PhoneVault AVD state (artifact transport only, never committed)
        if: steps.packflag.outputs.pack_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phonevault-avd-state
          path: phonevault-state.tar
          if-no-files-found: error
          retention-days: 90

      - name: Write verdict + commit output back
        if: always()
        shell: bash
        run: |
          set +e
          OUT=emulator-output.txt
          EVID=.pv-evidence-final
          MODE="$(cat .pv-mode.txt 2>/dev/null | tr -d '\r\n')"
          if [ -z "$MODE" ]; then MODE="fresh"; fi
          IVERD=""
          if [ -f "$EVID/identity-verdict.txt" ]; then IVERD="$(cat "$EVID/identity-verdict.txt")"; fi
          BOOTED=0; CAPOK=0
          [ -f "$EVID/03-boot.txt" ] && BOOTED="$(grep -c 'BOOTED_FLAG=1' "$EVID/03-boot.txt")"
          [ -f "$EVID/04-capture.txt" ] && CAPOK="$(grep -c 'CAPTURE_OK=1' "$EVID/04-capture.txt")"
          # v3.4 HONEST VERDICT: PACKED and MARKER below are derived from the
          # flags the run actually set (pack-state.txt from section 6,
          # marker-state.txt from section 4, the restore identity verdict) -
          # never asserted by template. Run No.3's verdict line claimed
          # "state packed" while its own section 6 said PACK_SKIPPED=1; that
          # class of lie is what this derivation removes.
          PACKOK=0
          if [ -f "$EVID/pack-state.txt" ] && grep -q 'PACK_OK=1' "$EVID/pack-state.txt"; then PACKOK=1; fi
          if [ "$PACKOK" = "1" ]; then PACKTXT="PACKED=1 (state packed as artifact phonevault-avd-state, section 6)"; else PACKTXT="PACKED=0 (state NOT packed - see section 6)"; fi
          MARKER_STATE="unknown"
          if [ "$MODE" = "restore" ]; then
            case "$IVERD" in
              *"SAME PHONE"*) MARKER_STATE="see identity verdict above" ;;
              *"marker mismatch"*) MARKER_STATE="FAILED" ;;
              *"NOT EVALUATED"*) MARKER_STATE="not evaluated (phone did not boot)" ;;
              *) if grep -q 'NOT EVALUATED' "$EVID/04-capture.txt" 2>/dev/null; then MARKER_STATE="not evaluated (restored pack carried no verified marker)"; fi ;;
            esac
          elif [ -f "$EVID/marker-state.txt" ]; then
            if grep -q 'MARKER_OK=1' "$EVID/marker-state.txt"; then MARKER_STATE="OK"; else MARKER_STATE="FAILED"; fi
          fi
          MARKERTXT="marker: $MARKER_STATE"
          if [ "$MARKER_STATE" = "FAILED" ]; then MARKERTXT="MARKER_FAILED (marker: FAILED - see section 4)"; fi
          {
            if [ "$MODE" = "restore" ] && [ -n "$IVERD" ]; then
              echo "$IVERD"
            fi
            if [ "$BOOTED" = "1" ] && [ "$CAPOK" = "1" ]; then
              if [ "$MODE" = "restore" ]; then
                echo "EMULATOR BOOT: BOOTED - sys.boot_completed=1 reached on factoryphone restored from artifact phonevault-avd-state (no -wipe-data); identity verdict above + section 4; $PACKTXT; $MARKERTXT"
              else
                echo "EMULATOR BOOT: BOOTED - sys.boot_completed=1 reached on factoryphone (android-34 google_apis x86_64, KVM accel, headless); identity + screencap captured; $PACKTXT; $MARKERTXT; no vault state was restored in this run (fresh mode, by design)"
              fi
            elif [ "$BOOTED" = "1" ]; then
              echo "EMULATOR BOOT: NO BOOT - emulator reported boot_completed but identity capture failed (see section 4)"
            else
              KVM="$(grep -h 'KVM_GATE:' "$EVID/00-baseline.txt" 2>/dev/null)"
              CFG="$(grep -h 'CONFIG_MISSING' "$EVID/02-avd.txt" 2>/dev/null)"
              RST="$(grep -h 'RESTORE_FAILED' "$EVID/02c-restore.txt" 2>/dev/null)"
              if echo "$KVM" | grep -q ABSENT; then
                echo "EMULATOR BOOT: NO BOOT - /dev/kvm absent on this runner (see section 0)"
              elif [ -n "$CFG" ]; then
                ARC="$(grep -h 'avdmanager_rc=' "$EVID/02-avd.txt" 2>/dev/null | tail -1)"
                echo "EMULATOR BOOT: NO BOOT - AVD creation failed, no config.ini ($ARC; boot skipped by design; FULL avdmanager output in section 02b below)"
              elif [ -n "$RST" ]; then
                echo "EMULATOR BOOT: NO BOOT - restore mode: state restore failed, boot not attempted (see section 02c below)"
              else
                echo "EMULATOR BOOT: NO BOOT - sys.boot_completed never reached 1 within the 12-minute bounded wait (see sections 3-4 + emulator console log tail)"
              fi
            fi
            echo ""
            for f in "$EVID"/0*.txt; do
              [ -f "$f" ] || continue
              echo "########## $f ##########"
              cat "$f"
              echo ""
            done
          } > "$OUT" 2>&1
          cat "$OUT"
          git config user.name "cloud-android-probe"
          git config user.email "probe@localhost"
          git add emulator-output.txt
          git commit -m "emulator output [skip ci]" || exit 0
          git push
